<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e0d" />
    <meta name="description" content="练迹 FitLog —— 移动优先的健身训练记录与分析原型。查阅动作、记录训练、获得有依据的复盘与安全提示。" />
    <meta name="format-detection" content="telephone=no" />
    <title>练迹 FitLog · 训练记录</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="练迹" />
    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/pages.css" />
    <link rel="stylesheet" href="./src/styles/settings.css" />
    <link rel="stylesheet" href="./src/features/library/library.css" />
    <link rel="stylesheet" href="./src/features/log/log.css" />
    <link rel="stylesheet" href="./src/features/analysis/analysis.css" />
  </head>
  <body>
    <div id="offline-bar" class="offline-bar" hidden>当前处于离线状态：记录会保存在本机，联网后可继续使用（原型阶段暂不涉及云端同步）</div>

    <main id="app" aria-live="polite">
      <section class="screen boot">
        <div class="boot__logo">练迹</div>
        <p class="boot__text">正在加载动作库与训练数据…</p>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <a class="tabbar__item" data-tab="home" href="#/">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>首页</span>
      </a>
      <a class="tabbar__item" data-tab="library" href="#/library">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6"/><path d="M7 7v10"/><path d="M17 7v10"/><path d="M20 9v6"/><path d="M7 12h10"/></svg>
        <span>动作库</span>
      </a>
      <a class="tabbar__item" data-tab="history" href="#/history">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/><path d="M12 7v5l3 2"/></svg>
        <span>记录</span>
      </a>
      <a class="tabbar__item" data-tab="settings" href="#/settings">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="M4.5 4.5 6.6 6.6"/><path d="M17.4 17.4l2.1 2.1"/><path d="M19.5 4.5 17.4 6.6"/><path d="M6.6 17.4l-2.1 2.1"/></svg>
        <span>我的</span>
      </a>
    </nav>

    <noscript>
      <p style="padding: 24px; color: #eef4f0">本原型需要启用 JavaScript 才能使用。</p>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
