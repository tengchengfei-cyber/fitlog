    desc: '腿 / 推 / 拉各两次：A 日强度、B 日容量。跑步独立于力量训练统计。',
    body: '<div class="card flat" style="margin-bottom:14px">' + rows + '</div>' +
      '<div class="section-label" style="margin-top:0">每周起始训练量 · 共 ' + totalSets + ' 组</div>' + '<div class="bars">' + vol + '</div>' +
      '<div class="note mt16">' + icon('info') + '<span>A 日主项 5 组大重量低次数，B 日 2–3 组中等重量高次数。组数是起点不是硬指标；臀与小腿只计直接组，深蹲、分腿蹲、硬拉另有间接刺激。</span></div>',
    actions: [{ label: '编辑计划', cls: 'primary', onClick: () => { setTimeout(() => openPlanEditor(), 220); } }]
  });
}

/* ==========================================================
   历史
   ========================================================== */
function renderHistory() {
  const month = UI.historyMonth;
  const y = month.getFullYear(), m = month.getMonth();
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const today = todayKey();

  let cells = ['一', '二', '三', '四', '五', '六', '日'].map(d => '<div class="wd-name">' + d + '</div>').join('');
  for (let i = 0; i < offset; i++) cells += '<div></div>';

  for (let d = 1; d <= days; d++) {
    const k = dateKey(new Date(y, m, d));
    const done = DB.sessions.some(s => s.date === k && s.status === 'completed');
    const run = DB.runs.some(r => r.date === k);
    const planned = PLAN[dayKeyOf(parseKey(k))].exercises.length > 0;
    let cls = 'cal-d';
    if (done) cls += ' done';
    else if (run) cls += ' run';
    else if (planned && k < today && DB.sessions.length) cls += ' miss';
    if (k === today) cls += ' today';
    if (k === UI.selectedDate) cls += ' sel';
    cells += '<button class="' + cls + '" data-date="' + k + '">' + d + '<span class="mk"></span></button>';
  }

  return pageHeader('训练历史', '按日期查看实际完成情况',
      '<div class="flex gap8">' +
        '<button class="btn sm ghost" data-add-session="1">补记</button>' +
        '<button class="btn sm ghost" data-add-run>跑步</button>' +
      '</div>') +
    '<div class="card">' +
      '<div class="cal-head">' +
        '<button class="icon-btn prev" style="width:32px;height:32px" data-month="-1">' + icon('chev') + '</button>' +
        '<div class="m">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
        '<button class="icon-btn" style="width:32px;height:32px" data-month="1">' + icon('chev') + '</button>' +
      '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="legend" style="margin-top:12px">' +
        '<span><i style="background:var(--accent)"></i>力量训练</span>' +
        '<span><i style="background:var(--blue)"></i>跑步</span>' +
        '<span><i style="background:rgba(0,0,0,.22)"></i>计划未记录</span>' +
      '</div>' +
    '</div>' +
    renderDayDetail(UI.selectedDate);
}

function renderDayDetail(k) {
  const list = sessionsOn(k).filter(s => s.status !== 'in_progress');
  const runs = runsOn(k);
  const bst = bodyStatus(k);
  let html = '<div class="section-label">' + fmtCN(k, true) + ' · ' + WEEK_LABEL[dayKeyOf(parseKey(k))] + '</div>';

  html += '<div class="card" style="padding:12px 16px">' +
    '<div class="flex between aic gap12">' +
      '<div class="grow"><div class="f13" style="font-weight:600">' + (bst.has ? esc(bst.text) : '这天没有体重 / 状态记录') + '</div>' +
        '<div class="f12 mut" style="margin-top:3px">' + (bst.has ? '体重与睡眠来自每日打卡' : '体重、腰围、睡眠与疲劳会进入趋势图和复盘') + '</div></div>' +
      '<button class="btn sm ghost" data-body-date="' + k + '">' + (bst.has ? '修改' : '记录') + '</button>' +
    '</div>' +
  '</div>';

  if (!list.length && !runs.length) {
    const plan = PLAN[dayKeyOf(parseKey(k))];
    html += '<div class="card">' +
      emptyBlock(plan.exercises.length ? '这天没有训练记录（计划：' + plan.name + '）' : '恢复日，无训练记录', 'calendar') +
      '<div class="flex gap8 mt12">' +
        '<button class="btn sm grow" data-backfill="' + k + '">补记这天训练</button>' +
        '<button class="btn sm ghost grow" data-add-run="' + k + '">记录跑步</button>' +
      '</div></div>';
  }

  list.forEach(s => {
    const sets = sessionDoneSets(s);
    const total = sessionSetCount(s);
    html += '<div class="card">' +
      '<div class="card-title"><div><h2>' + esc(s.dayName) + '</h2>' +
        '<div class="f12 mut" style="margin-top:3px">' + sessionDurationMin(s) + ' 分钟 · ' + sets + '/' + total + ' 组' +
        (s.status === 'aborted' ? ' · 未完成' : '') + (s.backfill ? ' · 补记' : '') + '</div></div>' +
        '<div class="flex gap8">' +
          '<button class="icon-btn" style="width:34px;height:34px" data-edit-session="' + s.id + '" aria-label="修改日期">' + icon('edit') + '</button>' +
          '<button class="icon-btn" style="width:34px;height:34px" data-del-session="' + s.id + '" aria-label="删除">' + icon('trash') + '</button>' +
        '</div>' +
      '</div>' +
      s.exercises.map(ex => {
        const done = ex.sets.filter(st => st.status === 'completed');
        if (!done.length && ex.status !== 'skipped') return '';
        return '<div style="padding:11px 0;border-bottom:1px solid var(--line)">' +
          '<div class="flex between aic"><div class="f13" style="font-weight:600">' + esc(ex.name) +
            (ex.tech ? ' <span class="tag">技术组</span>' : '') + '</div>' +
          (ex.status === 'skipped' ? '<span class="tag danger">跳过</span>' : '<span class="tag mute">' + done.length + ' 组</span>') + '</div>' +
          '<div class="setpills">' +
            done.map((st, i) =>
              '<button class="pill" data-edit-set="' + s.id + '|' + s.exercises.indexOf(ex) + '|' + ex.sets.indexOf(st) + '"><i>' + (i + 1) + '</i>' +
              fmtSetValue(st, ex.exId) +
              (exMode(ex.exId) === 'reps' && st.rir != null ? '<em>@' + st.rir + '</em>' : '') +
              '</button>'
            ).join('') +
          '</div>' +
          (ex.swappedFrom ? '<div class="f11 mut" style="margin-top:4px">替换了原计划：' + esc(ex.swappedFrom) + '</div>' : '') +
        '</div>';
      }).join('') +
    '</div>';
  });

  runs.forEach(r => {
    html += '<div class="card"><div class="card-title"><h2>' + icon('activity') + ' 跑步</h2>' +
      '<button class="icon-btn" style="width:32px;height:32px" data-del-run="' + r.id + '">' + icon('trash') + '</button></div>' +
      '<div class="f13" style="font-weight:550">' + esc(r.title || '轻松跑') + '</div>' +
      '<div class="f12 mut mt8">' + r.minutes + ' 分钟' + (r.distance ? ' · ' + r.distance + ' km' : '') + (r.rpe ? ' · RPE ' + r.rpe : '') + '</div>' +
      (r.note ? '<div class="f12 mut mt8">' + esc(r.note) + '</div>' : '') +
    '</div>';
  });

  return html;
}

/* 补记直接录入：不进入训练状态机，按动作填一组统一数据并立即保存 */
function openBackfillRecordSheet(dayKey, date) {
  const plan = PLAN[dayKey];
  if (!plan || !plan.exercises.length) { toast('这一天没有计划动作'); return; }
  const u = unitLabel();
  const rows = plan.exercises.map((pe, i) => {
    const ex = makeExerciseFromPlan(pe);
    if (!ex) return '';
    const mode = exMode(ex.exId);
    const assist = isAssist(ex.exId);
    const headCols = mode === 'time'
      ? ['秒数', 'RIR']
      : mode === 'quality'
        ? ['RPE', '次数']
        : [(assist ? '辅助重量 (' : '重量 (') + u + ')', '次数', 'RIR'];
    const setRows = ex.sets.map((st, si) => {
      const wField = mode === 'time'
        ? '<input class="input" data-bf="sec" type="text" inputmode="numeric" placeholder="' + pe.reps[0] + '">'
        : mode === 'quality'
          ? '<input class="input" data-bf="rpe" type="text" inputmode="decimal" placeholder="8">'
          : '<input class="input" data-bf="w" type="text" inputmode="decimal" placeholder="' + u + '">';
      const rField = mode === 'time'
        ? '<input class="input" data-bf="rir" type="text" inputmode="numeric" placeholder="RIR">'
        : mode === 'quality'
          ? '<input class="input" data-bf="r" type="text" inputmode="numeric" placeholder="' + pe.reps[0] + '–' + pe.reps[1] + '">'
          : '<input class="input" data-bf="r" type="text" inputmode="numeric" placeholder="' + pe.reps[0] + '–' + pe.reps[1] + '">';
      const rirField = mode === 'reps' && !assist
        ? '<input class="input" data-bf="rir" type="text" inputmode="numeric" placeholder="RIR">'
        : mode === 'reps'
          ? '<input class="input" data-bf="rir" type="text" inputmode="numeric" placeholder="RIR">'
          : '';
      return '<div class="bf-set-row" data-bf-set="' + si + '">' +
        '<span class="bf-set-no">' + (si + 1) + '</span>' + wField + rField + rirField +
      '</div>';
    }).join('');
    return '<div class="bf-ex" data-bf-ex="' + i + '">' +
      '<div class="bf-head"><span class="bf-name">' + esc(ex.name) + '</span>' +
        '<span class="bf-target">计划 ' + ex.sets.length + ' 组 · ' + repRange(pe.reps) + (pe.unit === 'sec' ? ' 秒' : ' 次') + '</span></div>' +
      '<div class="bf-set-head"><span></span>' + headCols.map(x => '<span>' + x + '</span>').join('') + '</div>' +
      '<div class="bf-set-list">' + setRows + '</div>' +
    '</div>';
  }).join('');

  const h = openSheet({
    title: '补记 ' + plan.name + ' · ' + fmtCN(date),
    desc: '每一组单独填写；填了任意字段的组算完成，空白组算未做',
    body: '<div class="f12 mut" style="line-height:1.65;margin-bottom:12px">' +
        '按实际训练逐组填写。只填做过的组，没做的组留空；保存后直接进入历史当天。' +
      '</div>' + rows +
      '<div class="f11 mut mt12">补记不会改变计划模板；重量单位按设置中的 ' + unitLabel() + '。</div>',
    actions: [
      { label: '取消', cls: 'ghost' },
      {
        label: '保存补记', cls: 'primary', onClick: () => {
          const s = buildSession(dayKey, date);
          s.backfill = true;
          s.status = 'completed';
          s.phase = 'WorkoutComplete';
          s.warmup = '';
          s.stretch = '';
          const base = parseKey(date).getTime() + 19 * 3600e3;
          s.realStart = base;
          s.startedAt = new Date(base).toISOString();
          s.endedAt = new Date(base + 60 * 60e3).toISOString();
          let recorded = 0;
          s.exercises.forEach((ex, i) => {
            const box = h.el.querySelector('[data-bf-ex="' + i + '"]');
            if (!box) { ex.status = 'skipped'; ex.sets.forEach(st => { st.status = 'skipped'; }); return; }
            const mode = exMode(ex.exId);
            const setRows = box.querySelectorAll('[data-bf-set]');
            ex.sets.forEach((st, si) => {
              const row = setRows[si];
              if (!row) { st.status = 'skipped'; return; }
              const val = name => {
                const el = row.querySelector('[data-bf="' + name + '"]');
                return el ? el.value.trim() : '';
              };
              const rawW = val(mode === 'time' ? 'sec' : mode === 'quality' ? 'rpe' : 'w');
              const rawR = val(mode === 'time' ? 'rir' : 'r');
              const rawRir = mode === 'reps' ? val('rir') : (mode === 'time' ? val('rir') : '');
              if (rawW === '' && rawR === '' && rawRir === '') {
                st.status = 'skipped';
                return;
              }
              st.status = 'completed';
              st.completedAt = Date.now();
              st.note = '';
              if (mode === 'time') {
                st.seconds = rawW === '' ? null : Math.max(0, Math.round(Number(rawW) || 0));
                st.rir = rawRir === '' ? null : Math.max(0, Math.min(10, Number(rawRir) || 0));
              } else if (mode === 'quality') {
                st.rpe = rawW === '' ? null : Math.max(0, Math.min(10, Number(rawW) || 0));
                st.reps = rawR === '' ? null : Math.max(0, Math.round(Number(rawR) || 0));
              } else {
                st.weight = rawW === '' ? null : fromUnit(rawW);
                st.reps = rawR === '' ? null : Math.max(0, Math.round(Number(rawR) || 0));
                st.rir = rawRir === '' ? null : Math.max(0, Math.min(10, Number(rawRir) || 0));
              }
              st.dataComplete = setHasData(st, ex.exId);
              recorded++;
            });
            ex.status = ex.sets.some(st => st.status === 'completed') ? 'done' : 'skipped';
            if (ex.status === 'skipped') ex.sets.forEach(st => { if (st.status !== 'completed') st.status = 'skipped'; });
          });
          if (!recorded) { toast('至少填一组数据'); return false; }
          DB.sessions.push(s);
          saveDB(true);
          UI.tab = 'history';
          UI.selectedDate = date;
          setTimeout(() => {
            renderCurrentTab();
            toast('补记已保存');
          }, 220);
          return true;
        }
      }
    ]
  });
}

/* ==========================================================
   数据与复盘
   ========================================================== */
function weeksRange(n) {
  const monday = startOfWeek(new Date());
  const arr = [];
  for (let i = n - 1; i >= 0; i--) {
    const start = dateKey(addDays(monday, -7 * i));
    const end = dateKey(addDays(monday, -7 * i + 6));
    arr.push({ start, end });
  }
  return arr;
}

function weekSessions(startKey, endKey) {
  return DB.sessions.filter(s => s.date >= startKey && s.date <= endKey);
}

/* 本周计划组数：当前周只统计已过的训练日，避免拿半周和整周比较 */
function weekPlannedSets(week) {
  const isCur = week.start === dateKey(startOfWeek(new Date()));
  let n = 0;
  WEEK_ORDER.forEach((k, i) => {
    const d = dateKey(addDays(parseKey(week.start), i));
    if (isCur && d > todayKey()) return;
    n += PLAN[k].exercises.reduce((a, e) => a + e.sets, 0);
  });
  return n;
}

function isCurrentWeek(week) {
  return week.start === dateKey(startOfWeek(new Date()));
}

function dataWeeks(weeks) {
  const list = weeks.filter(w =>
    DB.sessions.some(s => s.date >= w.start && s.date <= w.end && s.status !== 'in_progress') ||
    DB.runs.some(r => r.date >= w.start && r.date <= w.end));
  return list.length ? list : weeks.slice(-1);
}

function renderStats() {
  const weeks = weeksRange(UI.statsWeeks);
  const cur = weeks[weeks.length - 1];
  const sessions = weekSessions(cur.start, cur.end).filter(s => s.status !== 'in_progress');
  const doneSets = sessions.reduce((n, s) => n + sessionDoneSets(s), 0);
  const plannedSets = weekPlannedSets(cur);
  const rate = Math.min(100, Math.round(doneSets / Math.max(1, plannedSets) * 100));
  const showWeeks = dataWeeks(weeks);
  const runs = DB.runs.filter(r => r.date >= cur.start && r.date <= cur.end);
  const runMin = runs.reduce((n, r) => n + (r.minutes || 0), 0);
  const runKm = runs.reduce((n, r) => n + (r.distance || 0), 0);

  const bodyPts = DB.body.filter(b => b.weight != null).sort((a, b) => (a.date < b.date ? -1 : 1));
  const waistPts = DB.body.filter(b => b.waist != null).sort((a, b) => (a.date < b.date ? -1 : 1));
  const latestW = bodyPts.length ? bodyPts[bodyPts.length - 1].weight : null;
  const firstW = bodyPts.length ? bodyPts[0].weight : null;
  const wDelta = latestW != null && firstW != null ? Math.round((latestW - firstW) * 10) / 10 : null;

  const emptyHint = DB.sessions.length ? '' :
    '<div class="card" style="padding:15px 16px;border-color:rgba(0,0,0,.16);background:rgba(0,0,0,.04)">' +
      '<div class="f13" style="font-weight:600;color:var(--accent)">还没有训练记录</div>' +
      '<div class="f12 mut" style="margin-top:5px;line-height:1.7">完成第一次训练后，完成率、主项表现、肌群分配与每周复盘会自动出现在这里。体重趋势需要先在数据页记录。</div>' +
    '</div>';

  return pageHeader('数据与复盘', '记录真实数据，不做自动补造',
      '<button class="icon-btn" data-add-body="1" aria-label="记录身体数据">' + icon('plus') + '</button>') +
    emptyHint +
    '<div class="card">' +
      '<div class="card-title"><h2>身体与状态</h2><span class="hint">最近记录</span></div>' +
      renderCheckinList() +
      '<button class="btn sm block mt12" data-add-body="1">记录今天（体重 / 睡眠 / 疲劳）</button>' +
    '</div>' +
    '<div class="stat-grid">' +
      statCard('本周完成率', rate + '<small>%</small>',
        (doneSets === 0 && !DB.sessions.length ? (isCurrentWeek(cur) ? '截至今天 ' : '全周 ') + plannedSets + ' 组'
          : doneSets + ' / ' + plannedSets + ' 组') + (isCurrentWeek(cur) && DB.sessions.length ? ' · 进行中' : ''),
        rate >= 80 ? 'up' : '') +
      statCard('训练次数', sessions.filter(s => s.status === 'completed').length + '<small>次</small>',
        '全周 ' + WEEK_ORDER.filter(k => PLAN[k] && PLAN[k].exercises.length).length + ' 次', '') +
      statCard('跑步', runMin + '<small>分钟</small>', runKm > 0 ? runKm.toFixed(1) + ' km · 独立统计' : '暂无距离记录', '') +
      statCard('体重', latestW != null ? latestW + '<small>kg</small>' : '—', wDelta != null ? (wDelta >= 0 ? '+' : '') + wDelta + ' kg / 近 ' + UI.statsWeeks + ' 周' : '无记录', wDelta > 0 ? 'up' : '') +
    '</div>' +

    chartCard('体重趋势', 'kg', bodyPts.length ? lineChart({
      points: bodyPts.map(b => ({ x: b.date, y: b.weight })),
      color: '#111111', avg: 3, height: 170
    }) + '<div class="legend"><span><i style="background:#111111"></i>实测体重</span>' +
      '<span><i style="background:rgba(0,0,0,.4)"></i>3 次移动平均</span>' +
      '<span>共 ' + bodyPts.length + ' 条记录</span></div>'
      : emptyBlock('还没有体重记录', 'chart') + '<button class="btn sm block mt8" data-add-body="1">记录第一条</button>', '缺失日期不补造数据') +

    chartCard('腰围', 'cm', waistPts.length >= 2 ? lineChart({
      points: waistPts.map(b => ({ x: b.date, y: b.waist })), color: '#c4c4c4', height: 150
    }) : emptyBlock('腰围记录不足 2 条', 'ruler') +
      (waistPts.length < 2 ? '<button class="btn sm block mt8" data-add-body="1">补一条腰围</button>' : ''), '每两周测一次即可') +

      barChart(showWeeks.map(w => {
        const mins = DB.runs.filter(r => r.date >= w.start && r.date <= w.end).reduce((n, r) => n + (r.minutes || 0), 0);
        return { label: fmtShort(w.start), value: mins, color: 'rgba(0,0,0,.55)' };
      }), { height: 140 }) +
      '<div class="f11 mut mt8">计划：周二 30–40 分钟 + 周六 45–60 分钟</div>' +
    '</div>' +

    renderReviewCard(cur) +

      '<span>统计仅基于你实际记录的数据。缺失日期不会被自动填充；数据不足时会明确标注。</span>' +

}

function statCard(k, v, d, cls) {

    '<div class="d ' + (cls || '') + '">' + d + '</div></div>';

function chartCard(title, unit, body, hint) {
  return '<div class="card"><div class="card-title"><h2>' + title + '</h2>' +
    '<span class="hint">' + (hint || '') + '</span></div>' + body + '</div>';
}

function liftPoints(exId) {
  const pts = [];
  DB.sessions.filter(s => s.status !== 'in_progress').sort((a, b) => (a.date < b.date ? -1 : 1)).forEach(s => {
    const ex = s.exercises.find(e => e.exId === exId);
    if (!ex) return;
    const done = ex.sets.filter(st => st.status === 'completed' && setHasData(st, exId));
    if (!done.length) return;
    // 辅助引体：辅助配重越大越省力，只按次数画趋势
    if (isAssist(exId)) {
      const best = done.reduce((a, b) => ((b.reps || 0) > (a.reps || 0) ? b : a));
      pts.push({ x: s.date, y: best.reps, reps: best.reps, assist: best.weight });
      return;
    }
    if (exMode(exId) === 'time') {
      const best = done.reduce((a, b) => ((b.seconds || 0) > (a.seconds || 0) ? b : a));
      pts.push({ x: s.date, y: best.seconds, seconds: best.seconds });
      return;
    }
    const weighted = done.filter(st => st.weight != null);
    if (weighted.length) {
      const best = weighted.reduce((a, b) => (Math.abs(b.weight) > Math.abs(a.weight) ? b : a));
      pts.push({ x: s.date, y: Math.abs(best.weight), reps: best.reps });
    } else {
      const best = done.reduce((a, b) => ((b.reps || 0) > (a.reps || 0) ? b : a));
      pts.push({ x: s.date, y: best.reps, reps: best.reps });
    }
  });
  return pts;
}

function renderLiftChart(tab) {
  const map = { bench: 'bench', squat: 'squat', latpull: 'latpull', rdl: 'rdl' };
  const exId = map[tab] || 'bench';
  const pts = liftPoints(exId);
  if (pts.length < 2) return emptyBlock('「' + LIB[exId].name + '」记录不足 2 次', 'chart');
  const best = pts.reduce((a, b) => (b.y > a.y ? b : a));
  const isBody = LIB[exId].load === 'body';
  const isSec = exMode(exId) === 'time';
  const assist = isAssist(exId);
  const bestText = assist
    ? best.y + ' 次' + (best.assist != null ? '（辅助 ' + fmtW(Math.abs(best.assist)) + '）' : '')
    : isSec ? best.y + ' 秒'
    : isBody ? best.y + ' 次'
    : fmtW(best.y);
  return lineChart({ points: pts, color: '#111111', height: 170 }) +
    '<div class="flex between aic mt12">' +
      '<div class="f12 mut">最佳 ' + bestText + ' · ' + fmtCN(best.x) + '</div>' +
      '<div class="f12 mut">共 ' + pts.length + ' 次记录</div>' +
    '</div>' +
    (assist ? '<div class="f11 mut mt8">辅助引体按最多次数统计；括号内是当天的辅助配重，配重越小越难。</div>'
      : isSec ? '<div class="f11 mut mt8">计时类动作按最长保持时间统计。</div>'
      : isBody ? '<div class="f11 mut mt8">引体按最大严格次数统计（无负重）。</div>'
      : '<div class="f11 mut mt8">按当次最重工作组统计，未换算 1RM。</div>');
}

function groupSetsInRange(start, end) {
  const map = {};
  DB.sessions.filter(s => s.date >= start && s.date <= end).forEach(s => {
    s.exercises.forEach(ex => {
      if (!countsVolume(ex)) return; // 引体技术组等服务性组不计入肌群训练量
      const n = ex.sets.filter(st => st.status === 'completed').length;
      if (!n) return;
      map[ex.group] = (map[ex.group] || 0) + n;
    });
  });
  return map;
}

function renderVolumeChart(weeks) {
  const data = weeks.map(w => {
    const m = groupSetsInRange(w.start, w.end);
    const parts = Object.keys(m).map(g => ({ group: g, value: m[g] }))
      .sort((a, b) => b.value - a.value);
    return { label: fmtShort(w.start), parts };
  });
  const total = data.reduce((n, d) => n + d.parts.reduce((a, p) => a + p.value, 0), 0);
  if (!total) return emptyBlock('这段时间还没有训练量', 'chart');
  const groups = ['背', '胸', '肩', '股四头肌', '腘绳肌', '核心'];
  return stackedChart(data) +
    '<div class="legend">' + groups.map(g => '<span><i style="background:' + GROUP_COLORS[g] + '"></i>' + g + '</span>').join('') +
    '<span><i style="background:#6e6e6e"></i>其他</span></div>';
}

function renderGroupBars(w) {
  const m = groupSetsInRange(w.start, w.end);
  const targets = VOLUME_TARGET.reduce((acc, t) => { acc[t.group] = t.value; return acc; }, {});
  const groups = VOLUME_TARGET.map(t => t.group);
  const rows = groups.map(g => {
    const val = m[g] || 0;
    const target = targets[g] || null;
    const max = 16;
    return '<div class="barline"><div class="top"><span class="g">' + g + '</span>' +
      '<span class="n">' + val + (target ? ' / ' + target : '') + ' 组</span></div>' +
      '<div class="track"><i style="width:' + Math.min(100, val / max * 100) + '%"></i>' +
      (target ? '<u style="left:' + Math.min(100, target / max * 100) + '%"></u>' : '') +
      '</div></div>';
  }).join('');
  return '<div class="bars">' + rows + '</div>';
}

  '</div>';

function buildReview(week) {
  const sessions = weekSessions(week.start, week.end).filter(s => s.status !== 'in_progress');
  const doneSets = sessions.reduce((n, s) => n + sessionDoneSets(s), 0);
  const planned = weekPlannedSets(week);
  const rate = Math.min(100, Math.round(doneSets / Math.max(1, planned) * 100));
  const doneDays = sessions.filter(s => s.status === 'completed').length;
  const partial = isCurrentWeek(week);
  const factor = planned / PLAN_TOTAL_SETS;
  const items = [];

  if (!sessions.length) {
    items.push({
      t: '本周暂无训练记录', b: '没有可分析的数据。先完成一次训练，复盘会自动更新。',
      src: '训练记录为空'
    });
  } else {
    items.push({
      t: '训练完成率 ' + rate + '%' + (partial ? '（本周进行中）' : ''),
      b: '已完成 ' + doneSets + ' 个工作组（计划 ' + planned + ' 组' + (partial ? '，按已过训练日计算' : '') + '），完成训练 ' + doneDays + ' 天。' +
        (rate >= 85 ? '执行稳定，维持当前安排即可。' : rate >= 65 ? '完成度一般，优先保证主项，辅助动作可各减 1 组。' : '完成度偏低，先降低单日组数，避免因赶进度牺牲动作质量。'),
      src: 'SetLog 中 status=completed 的组数 / 计划工作组总数'
    });
  }

  // 关键动作
  const lifts = [['bench', '卧推'], ['squat', '深蹲'], ['latpull', '高位下拉'], ['rdl', '硬拉']];
  const parts = [];
  lifts.forEach(([id, name]) => {
    const pts = liftPoints(id).filter(p => p.x >= week.start && p.x <= week.end);
    if (!pts.length) { parts.push(name + ' 无记录'); return; }
    const best = pts.reduce((a, b) => (b.y > a.y ? b : a));
    const prev = liftPoints(id).filter(p => p.x < week.start).slice(-1)[0];
    let trend = '';
    if (prev) {
      const diff = Math.round((best.y - prev.y) * 10) / 10;
      trend = diff > 0 ? '（+' + diff + '）' : diff < 0 ? '（' + diff + '）' : '（持平）';
    }
    parts.push(name + ' ' + (id === 'pullup' ? best.y + ' 次' : fmtW(best.y)) + trend);
  });
  items.push({
    t: '主项表现', b: parts.join('，') + '。双重进阶：所有工作组达到次数上限且 RIR 达标后再加重量。',
    src: '本周各组最重 / 最多次的已完成组，与上一记录日对比'
  });

  // 训练量
  const m = groupSetsInRange(week.start, week.end);
  const flags = [];
  ['背', '胸', '股四头肌', '核心'].forEach(g => {
    const v = m[g] || 0;
    const full = { '背': 13, '胸': 13, '股四头肌': 12, '核心': 8 }[g];
    const t = Math.round(full * factor * 10) / 10;
    if (v > t * 1.3) flags.push(g + ' ' + v + ' 组，高于同期起始量 ' + t + ' 组');
    else if (v > 0 && v < t * 0.6) flags.push(g + ' ' + v + ' 组，低于同期起始量 ' + t + ' 组');
  });
  items.push({
    t: '训练量分布',
    b: '背部 ' + (m['背'] || 0) + ' 组、胸 ' + (m['胸'] || 0) + ' 组、股四头肌 ' + (m['股四头肌'] || 0) + ' 组、核心 ' + (m['核心'] || 0) + ' 组。' +
      (flags.length ? flags.join('；') + '。' : '与起始量接近。'),
    src: '按动作主肌群统计已完成工作组；引体技术组不计入，后束/面拉不计入背阔肌总量' + (partial ? '；目标按已过训练日折算' : '')
  });

  // 睡眠与疲劳
  const cks = DB.checkins.filter(c => c.date >= week.start && c.date <= week.end);
  const sleeps = cks.map(c => c.sleep).filter(v => v != null);
  const avgSleep = sleeps.length ? Math.round(sleeps.reduce((a, b) => a + b, 0) / sleeps.length * 10) / 10 : null;
  const hiFatigue = cks.filter(c => c.fatigue != null && c.fatigue >= 4).length;
  items.push({
    t: '睡眠与疲劳' + (avgSleep != null ? ' · 平均 ' + avgSleep + ' 小时' : ''),
    b: cks.length
      ? (avgSleep != null ? '本周 ' + sleeps.length + ' 天有睡眠记录，平均 ' + avgSleep + ' 小时。' : '本周打卡了状态，但没有睡眠时长。') +
        (hiFatigue ? '有 ' + hiFatigue + ' 天疲劳自评 ≥4，先看睡眠与总训练量，再考虑加量。' : '疲劳自评平稳。')
      : '本周还没有体重/状态打卡。每天 10 秒记录睡眠与疲劳，复盘才能把「练不动」和「没睡好」区分开。',
    src: '每日打卡的睡眠时长与疲劳自评（1–5），只作趋势参考'
  });

  // 跑步
  const runs = DB.runs.filter(r => r.date >= week.start && r.date <= week.end);
  const mins = runs.reduce((n, r) => n + (r.minutes || 0), 0);
  const km = runs.reduce((n, r) => n + (r.distance || 0), 0);
  items.push({
    t: '跑步负荷 ' + mins + ' 分钟',
    b: runs.length ? '本周 ' + runs.length + ' 次轻松跑' + (km > 0 ? '，共 ' + km.toFixed(1) + ' km' : '') + '。' +
      (mins > 110 ? '总量偏高，若周一深蹲表现下降，先缩短周六长跑 10–15 分钟。' : '在计划范围内，保持轻松强度，不追配速。')
      : '本周没有跑步记录。计划为周二 30–40 分钟、周六 45–60 分钟轻松跑。',
    src: '跑步日志时长、距离；与力量训练分开统计'
  });

  // 下周建议
  let advice = '维持当前计划与起始量';
  if (rate < 65) advice = '先把每个训练日的主项做完整，辅助动作各减 1 组';
  else if (rate >= 85) advice = '保持安排；主项全部达到次数上限且 RIR 达标时，按最小增量加重';
  items.push({
    t: '下周建议',
    b: advice + '。每 5–7 周评估一次是否需要减量，减量周可减少 30%–50% 工作组。',
    src: '完成率与主项趋势的组合规则'
  });

  return items;
}

  let mode = cur.mode || 'reps';
  let assist = !!cur.assist;

  let secondaryMuscles = Array.isArray(cur.secondaryMuscles) ? cur.secondaryMuscles.slice() : [];
  if (!primaryMuscles.length) {
    const inferred = inferMuscleMeta({ name: cur.name || '', group: group, tags: cur.tags || [group] });

    secondaryMuscles = inferred.secondaryMuscles;

            renderCurrentTab();

            if (onSaved) onSaved(rec.id);
          }, 220);
        }
      }
    ],
    onMount: (mask, close) => {
      const paintAlts = () => {
        const box = mask.querySelector('#ex-alts');
        box.innerHTML = altHtml();
        box.querySelectorAll('[data-altpick]').forEach(b => b.onclick = () => {
          const id = b.dataset.altpick;
          if (alts.indexOf(id) >= 0) alts = alts.filter(x => x !== id);
          else if (alts.length >= 4) { toast('最多选 4 个平替'); return; }
          else alts = alts.concat(id);
          b.classList.toggle('on', alts.indexOf(id) >= 0);
        });
      };

      mask.querySelectorAll('[data-exg]').forEach(b => b.onclick = () => {
        group = b.dataset.exg;
        mask.querySelectorAll('[data-exg]').forEach(x => x.classList.toggle('on', x === b));
        alts = alts.filter(id => LIB[id] && LIB[id].group === group);
        paintAlts();
      });

      const paintMuscles = (kind) => {
        const selected = kind === 'pm' ? primaryMuscles : secondaryMuscles;
        mask.querySelectorAll('[data-' + kind + ']').forEach(x =>
          x.classList.toggle('on', selected.indexOf(x.dataset[kind]) >= 0));
      };
      mask.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => {
        const m = b.dataset.pm;
        if (primaryMuscles.indexOf(m) >= 0) primaryMuscles = primaryMuscles.filter(x => x !== m);
        else primaryMuscles = primaryMuscles.concat(m).slice(0, 8);
        secondaryMuscles = secondaryMuscles.filter(x => x !== m);
        paintMuscles('pm'); paintMuscles('sm');
      });
      mask.querySelectorAll('[data-sm]').forEach(b => b.onclick = () => {
        const m = b.dataset.sm;
        if (secondaryMuscles.indexOf(m) >= 0) secondaryMuscles = secondaryMuscles.filter(x => x !== m);
        else secondaryMuscles = secondaryMuscles.concat(m).slice(0, 8);
        primaryMuscles = primaryMuscles.filter(x => x !== m);
        paintMuscles('pm'); paintMuscles('sm');
      });

      mask.querySelectorAll('[data-exe]').forEach(b => b.onclick = () => {
        equip = b.dataset.exe;
        mask.querySelectorAll('[data-exe]').forEach(x => x.classList.toggle('on', x === b));
        const g = mask.querySelector('#ex-gear');
        if (g && !g.value.trim()) g.value = equip;
      });

      mask.querySelectorAll('[data-exm]').forEach(b => b.onclick = () => {
        mode = b.dataset.exm;
        mask.querySelectorAll('[data-exm]').forEach(x => x.classList.toggle('on', x === b));
        const ab = mask.querySelector('[data-exassist]');
        if (!ab) return;
        ab.disabled = mode !== 'reps';
        ab.style.opacity = mode === 'reps' ? '' : '.35';
        if (mode !== 'reps') { assist = false; ab.classList.remove('on'); }
      });

      const sb = mask.querySelector('[data-exside]');
      if (sb) sb.onclick = () => { perSide = !perSide; sb.classList.toggle('on', perSide); };

      const ab = mask.querySelector('[data-exassist]');
      if (ab) ab.onclick = () => {
        if (ab.disabled) return;
        assist = !assist;
        ab.classList.toggle('on', assist);
      };

      const del = mask.querySelector('[data-ex-delete]');
      if (del) del.onclick = () => {
        const usage = customExUsage(exId);
        confirmDialog({
          title: '删除「' + (cur.name || '') + '」？',
          desc: (usage.length ? '它还在「' + usage.join('、') + '」的计划里，删除后会一并移除。' : '删除后动作库和计划里都不再出现。') +
            '历史训练记录保留，仍能正常显示。',
          confirmText: '删除', danger: true
        }).then(ok => {
          if (!ok) return;
          archiveCustomExercise(exId);
          close();
          setTimeout(() => { renderCurrentTab(); toast('已删除'); }, 220);
        });
      };
    }
  });
}

function bindSettings() {
  if (typeof bindCloudSettings === 'function') bindCloudSettings();
  const t = (act, fn) => { const b = $('[data-act="' + act + '"]'); if (b) b.onclick = fn; };
  t('toggle-unit', () => {
    DB.settings.unit = DB.settings.unit === 'kg' ? 'lb' : 'kg';
    saveDB(true); renderCurrentTab(); toast('单位已切换为 ' + unitLabel());
  });
  t('toggle-sound', () => { DB.settings.sound = !DB.settings.sound; saveDB(true); renderCurrentTab(); if (DB.settings.sound) beep(880, 0.12, 0.1); });
  t('toggle-vibrate', () => { DB.settings.vibrate = !DB.settings.vibrate; saveDB(true); renderCurrentTab(); vibrate(40); });
  t('toggle-countdown', () => { DB.settings.countdownBeep = !DB.settings.countdownBeep; saveDB(true); renderCurrentTab(); });
  t('toggle-notify', () => {
    if (!('Notification' in window)) { toast('当前浏览器不支持系统通知'); return; }
    if (Notification.permission === 'granted') {
      DB.settings.notify = !DB.settings.notify; saveDB(true); renderCurrentTab();
    } else {
      Notification.requestPermission().then(p => {
        DB.settings.notify = p === 'granted';
        saveDB(true); renderCurrentTab();
        toast(p === 'granted' ? '已开启系统通知' : '通知权限被拒绝');
      });
    }
  });

  const planBtn = $('[data-plan]');
  if (planBtn) planBtn.onclick = showPlanOverview;
  const editPlanBtn = $('[data-edit-plan]');
  if (editPlanBtn) editPlanBtn.onclick = () => openPlanEditor();

  $$('[data-export]').forEach(b => b.onclick = () => b.dataset.export === 'json' ? exportJSON() : exportCSV());
  const imp = $('[data-import]');
  const file = $('#import-file');
  if (imp && file) {
    imp.onclick = () => file.click();
    file.onchange = () => {
      const f = file.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          if (typeof reader.result !== 'string' || reader.result.length > 10 * 1024 * 1024) throw new Error('文件过大或无法读取');
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.sessions)) throw new Error('格式不符');
          const normalized = importDBFromBackup(data);
          confirmDialog({
            title: '导入并覆盖当前数据？',
            desc: '将用备份文件中的 ' + normalized.sessions.length + ' 条训练记录替换现有数据。',
            confirmText: '导入', danger: true
          }).then(ok => {
            if (!ok) return;
            DB = normalized;
            if (!Array.isArray(DB.customEx)) DB.customEx = [];
            registerCustomExercises();
            ensurePlanData();
            buildPlan();
            saveDB(true);
            renderCurrentTab();
            toast('导入完成');
          });
        } catch (e) { toast('文件无法解析：' + e.message); }
      };
      reader.readAsText(f);
    };
  }
  const clr = $('[data-clear-demo]');
  if (clr) clr.onclick = () => confirmDialog({
    title: '清除示例数据？', desc: '只删除示例训练与记录，不会动你自己记录的内容。', confirmText: '清除'
  }).then(ok => { if (ok) { clearDemoData(); renderCurrentTab(); toast('示例数据已清除'); } });

  const wipe = $('[data-wipe]');
  if (wipe) wipe.onclick = () => confirmDialog({
    title: '清空全部数据？', desc: '所有训练、跑步与体重记录都会被删除，且无法恢复。建议先导出 JSON 备份。',
    confirmText: '确认清空', danger: true
  }).then(ok => {
    if (!ok) return;
    confirmDialog({ title: '再次确认', desc: '这是不可撤销的操作。', confirmText: '我确定', danger: true }).then(ok2 => {
      if (!ok2) return;
      DB = emptyDB();
      ensurePlanData();
      buildPlan();
      saveDB(true);
      renderCurrentTab();
      toast('已清空');
    });
  });
}

/* ---------------- 导入导出 ---------------- */
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

function exportJSON() {
  const payload = JSON.stringify(DB, null, 2);
  download('training-backup-' + todayKey() + '.json', payload, 'application/json');
  toast('已导出 JSON 备份');
}

function csvCell(c) {
  if (typeof c === 'number' && Number.isFinite(c)) return String(c);
  let v = c == null ? '' : String(c);
  // 防止 CSV/Excel 公式注入：以 = + - @、Tab、CR 开头的单元格加单引号前缀。
  if (/^\s*[=+\-@\t\r]/.test(v)) v = "'" + v;
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function exportCSV() {
  const lines = [];
  const push = arr => lines.push(arr.map(csvCell).join(','));

  push(['# 训练组']);
  push(['date', 'day', 'exercise', 'set', 'status', 'weight_kg', 'reps', 'rir', 'seconds', 'rpe', 'extra', 'tech', 'note', 'completed_at']);
  DB.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      ex.sets.forEach(st => {
        push([
          s.date, s.dayName, ex.name, st.idx + 1, st.status,
          st.weight != null ? Math.abs(st.weight) : '', st.reps != null ? st.reps : '',
          st.rir != null ? st.rir : '', st.seconds != null ? st.seconds : '', st.rpe != null ? st.rpe : '',
          st.extra ? 1 : 0, ex.tech ? 1 : 0, st.note || '',
          st.completedAt ? new Date(st.completedAt).toISOString() : ''
        ]);
      });
    });
  });

  lines.push('');
  push(['# 跑步']);
  push(['date', 'title', 'minutes', 'distance_km', 'rpe', 'note']);
  DB.runs.forEach(r => push([r.date, r.title || '', r.minutes || '', r.distance || '', r.rpe || '', r.note || '']));

  lines.push('');
  push(['# 身体']);
  push(['date', 'weight_kg', 'waist_cm']);
  DB.body.forEach(b => push([b.date, b.weight != null ? b.weight : '', b.waist != null ? b.waist : '']));

  lines.push('');
  push(['# 状态']);
  push(['date', 'sleep_h', 'fatigue_1_5', 'soreness', 'note']);
  DB.checkins.forEach(c => push([c.date, c.sleep != null ? c.sleep : '', c.fatigue != null ? c.fatigue : '', c.soreness || '', c.note || '']));

  download('training-log-' + todayKey() + '.csv', '\ufeff' + lines.join('\n'), 'text/csv;charset=utf-8');
  toast('已导出 CSV（训练 / 跑步 / 身体 / 状态）');
}

function openPlanEditor(startDay) {
  let mode = startDay ? 'day' : 'list';
  let dayKey = startDay || 'mon';
  let pickIndex = -1;
  let pickFilter = '全部';
  let pickQuery = '';

  const h = openSheet({

  });

  const sheet = mask.querySelector('.sheet');

  let lastMode = '';
  function paint() {
    if (lastMode !== mode) {
      const sb = sheet.querySelector('.sheet-body');
      if (sb) sb.scrollTop = 0;
      lastMode = mode;
    }
    sheet.querySelector('h3').textContent =
      mode === 'list' ? '编辑训练计划' : mode === 'day' ? (PLAN[dayKey].name + ' · 调整处方') : (pickIndex < 0 ? '添加动作' : '替换动作');

      : mode === 'day' ? '动作可增删、可调顺序；这些数值决定训练页的组数、目标次数与默认组间休息。'
      : (pickIndex < 0 ? '选一个动作加到这一天，加完还能继续调组数与次数。' : '选择替代动作，计划与后续训练都会使用它。');

    if (mode === 'list') return paintList();
    if (mode === 'day') return paintDay();
    return paintPick();
  }

  function paintList() {
    const data = ensurePlanData();
    box.innerHTML =
      '<div class="pe-list">' + WEEK_ORDER.map((k, i) => {
        const d = data[k];
        const n = d.exercises.length;
        const sets = d.exercises.reduce((a, e) => a + e.sets, 0);
        return '<div class="pe-row">' +
          '<button class="pe-main" data-open="' + k + '">' +
            '<div class="pe-d">' + WEEK_LABEL[k].replace('周', '') + '</div>' +
            '<div class="grow"><div class="nm">' + (n ? esc(d.name) : '恢复日') + '</div>' +
            '<div class="sub">' + (n ? n + ' 个动作 · ' + sets + ' 组' : '没有动作 · 可进入添加') + '</div></div>' +
            '<span class="chev">' + icon('chev') + '</span>' +
          '</button>' +
          '<div class="pe-mv">' +
            '<button data-mv="up" data-k="' + k + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="上移">↑</button>' +
            '<button data-mv="down" data-k="' + k + '" ' + (i === 6 ? 'disabled' : '') + ' aria-label="下移">↓</button>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="note mt12">' + icon('info') + '<span>上下箭头把整天的训练内容移到相邻星期。恢复日也能进入编辑：想加一个散步日或补一个动作都可以。</span></div>' +
      '<button class="btn ghost block mt12" data-reset-plan="1">恢复默认计划</button>';

    box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { dayKey = b.dataset.open; mode = 'day'; paint(); });
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      const i = WEEK_ORDER.indexOf(k);
      const j = b.dataset.mv === 'up' ? i - 1 : i + 1;
      if (j < 0 || j > 6) return;
      const a = data[k], c = data[WEEK_ORDER[j]];
      const tmp = { name: a.name, focus: a.focus, exercises: a.exercises };
      a.name = c.name; a.focus = c.focus; a.exercises = c.exercises;
      c.name = tmp.name; c.focus = tmp.focus; c.exercises = tmp.exercises;
      savePlan();
      paint();
      vibrate(15);
    });
    const rp = box.querySelector('[data-reset-plan]');
    if (rp) rp.onclick = () => confirmDialog({
      title: '恢复默认计划？', desc: '会还原三分化六练的原始组数、次数、休息与训练日安排，历史记录不受影响。', confirmText: '恢复'
    }).then(ok => { if (ok) { resetPlan(); paint(); toast('已恢复默认计划'); } });
  }

  function paintDay() {
    const d = ensurePlanData()[dayKey];
    const totalSets = d.exercises.reduce((a, e) => a + e.sets, 0);
    box.innerHTML =
      '<button class="pe-back" data-back="1">' + icon('chev') + ' 返回周计划</button>' +
      '<div class="flex between aic" style="margin-bottom:8px">' +
        '<div class="f13" style="font-weight:650">' + esc(d.name || PLAN[dayKey].name) + '</div>' +
        '<span class="f11 mut">' + d.exercises.length + ' 个动作 · ' + totalSets + ' 组</span>' +
      '</div>' +
      (d.exercises.length
        ? d.exercises.map((e, i) => {
            const lib = LIB[e.exId] || { name: e.exId, group: '' };
            return '<div class="pe-ex">' +
              '<div class="pe-exhead"><div class="grow"><div class="nm">' + esc(lib.name) + '</div>' +
                '<div class="sub">' + esc(lib.group || '') + ' · ' + (e.unit === 'sec' ? '按秒记录' : exMode(e.exId) === 'quality' ? '按 RPE 记录' : '按重量记录') + '</div></div>' +
                '<div class="pe-tools">' +
                  '<button data-mv-ex="up|' + i + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="上移">↑</button>' +
                  '<button data-mv-ex="down|' + i + '" ' + (i === d.exercises.length - 1 ? 'disabled' : '') + ' aria-label="下移">↓</button>' +
                  '<button data-swap="' + i + '">换</button>' +
                  '<button data-del-ex="' + i + '" style="color:var(--danger)" aria-label="删除">×</button>' +
                '</div>' +
              '</div>' +
              '<div class="pe-ctrls">' +
                peField('组数', 'sets', i, e.sets) +
                peField(e.unit === 'sec' ? '秒数下限' : '次数下限', 'r0', i, e.reps[0]) +
                peField(e.unit === 'sec' ? '秒数上限' : '次数上限', 'r1', i, e.reps[1]) +
                peField('组间休息', 'rest', i, e.rest) +
              '</div>' +
            '</div>';
          }).join('')
        : '<div class="empty" style="padding:22px 0">' + icon('moon') + '<div>这一天还没有动作。加一个动作，它就会变成训练日。</div></div>') +
      '<button class="btn ghost block mt12" data-add-ex="1">+ 添加动作</button>' +
      '<div class="note mt12">' + icon('info') + '<span>次数上下限、组间休息会写入之后新建的训练；正在进行中的训练不受影响。删除动作不会删掉历史记录。</span></div>';

    box.querySelector('[data-back]').onclick = () => { mode = 'list'; paint(); };
    box.querySelectorAll('[data-swap]').forEach(b => b.onclick = () => { pickIndex = Number(b.dataset.swap); pickFilter = '全部'; mode = 'pick'; paint(); });
    const addBtn = box.querySelector('[data-add-ex]');
    if (addBtn) addBtn.onclick = () => { pickIndex = -1; pickFilter = '全部'; mode = 'pick'; paint(); };

    box.querySelectorAll('[data-mv-ex]').forEach(b => b.onclick = () => {
      const [dir, idxStr] = b.dataset.mvEx.split('|');
      const i = Number(idxStr);
      const j = dir === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= d.exercises.length) return;
      const tmp = d.exercises[i];
      d.exercises[i] = d.exercises[j];
      d.exercises[j] = tmp;
      savePlan();
      paint();
      vibrate(12);
    });

    box.querySelectorAll('[data-del-ex]').forEach(b => b.onclick = () => {
      const i = Number(b.dataset.delEx);
      const ex = d.exercises[i];
      confirmDialog({
        title: '删除「' + (LIB[ex.exId] ? LIB[ex.exId].name : ex.exId) + '」？',
        desc: '只从计划里移除，历史训练记录不受影响。', confirmText: '删除', danger: true
      }).then(ok => {
        if (!ok) return;
        d.exercises.splice(i, 1);
        savePlan();
        paint();
        toast('已从计划移除');
      });
    });

    box.querySelectorAll('[data-pe]').forEach(b => b.onclick = () => {
      const [field, dir, idxStr] = b.dataset.pe.split('|');
      const idx = Number(idxStr);
      const ex = d.exercises[idx];
      const dirN = Number(dir);
      if (field === 'sets') ex.sets = Math.max(1, Math.min(6, ex.sets + dirN));
      else if (field === 'r0') { ex.reps[0] = Math.max(1, Math.min(60, ex.reps[0] + dirN)); if (ex.reps[0] > ex.reps[1]) ex.reps[1] = ex.reps[0]; }
      else if (field === 'r1') { ex.reps[1] = Math.max(1, Math.min(60, ex.reps[1] + dirN)); if (ex.reps[1] < ex.reps[0]) ex.reps[0] = ex.reps[1]; }
      else if (field === 'rest') ex.rest = Math.max(30, Math.min(300, ex.rest + dirN * 15));
      savePlan();
      const el = box.querySelector('#pev-' + field + '-' + idx);
      if (el) el.textContent = field === 'rest' ? mmss(ex.rest * 1000) : (field === 'sets' ? ex.sets : ex.reps[field === 'r0' ? 0 : 1]);
      if (field === 'r0' || field === 'r1') {
        const o = box.querySelector('#pev-' + (field === 'r0' ? 'r1' : 'r0') + '-' + idx);
        if (o) o.textContent = field === 'r0' ? ex.reps[1] : ex.reps[0];
      }
      vibrate(12);
    });
  }

  function peField(label, field, idx, val) {
    return '<div class="pe-field"><span>' + label + '</span>' +
      '<div class="pe-step">' +
        '<button data-pe="' + field + '|-1|' + idx + '">−</button>' +
        '<b id="pev-' + field + '-' + idx + '">' + (field === 'rest' ? mmss(val * 1000) : val) + '</b>' +
        '<button data-pe="' + field + '|1|' + idx + '">+</button>' +
      '</div></div>';
  }

  function paintPick() {
    const d = ensurePlanData()[dayKey];
    const adding = pickIndex < 0;
    const cur = adding ? null : d.exercises[pickIndex].exId;
    const groups = ['全部', '杠铃', '哑铃', '器械', '绳索', '自重'];
    const q = pickQuery.trim().toLowerCase();
    const items = Object.keys(LIB).filter(id => {
      const l = LIB[id];
      return id !== cur && !l.archived && (pickFilter === '全部' || l.equip === pickFilter) &&
        (!q || l.name.toLowerCase().includes(q) || (l.tags || []).join('').toLowerCase().includes(q) || (l.gear || '').toLowerCase().includes(q));
    });
    box.innerHTML =
      '<button class="pe-back" data-back="1">' + icon('chev') + ' 返回 ' + esc(d.name) + '</button>' +
      '<button class="btn ghost block" data-new-ex="1" style="margin-bottom:10px">' + icon('plus') + ' 新建动作</button>' +
      '<div class="searchbox" style="margin-bottom:10px">' + icon('search') +
        '<input class="input" id="pe-q" placeholder="搜索动作或肌群" value="' + esc(pickQuery) + '"></div>' +
      '<div class="chiprow" style="margin-bottom:8px">' + groups.map(g =>
        '<button data-pf="' + g + '" class="' + (pickFilter === g ? 'on' : '') + '">' + g + '</button>').join('') + '</div>' +
      '<div class="optlist">' + items.map(id =>
        '<button data-pick="' + id + '"><div class="grow"><div class="nm">' + esc(LIB[id].name) +
        (LIB[id].custom ? ' <span class="tag mute">自建</span>' : '') + '</div>' +
        '<div class="sub">' + esc(LIB[id].gear) + ' · ' + esc(LIB[id].group) + '</div></div>' +
        '<span class="chev">' + icon('chev') + '</span></button>').join('') + '</div>';

    const commitPick = id => {
      const lib = LIB[id];
      if (!lib) return;
      const unit = lib.mode === 'time' ? 'sec' : 'rep';
      if (adding) {
        if (!d.exercises.length && d.name === '恢复日') { d.name = '训练日'; d.focus = '自定义训练日'; }
        d.exercises.push({
          exId: id,
          sets: lib.mode === 'time' ? 2 : 3,
          reps: lib.mode === 'time' ? [20, 30] : [8, 12],
          unit: unit,
          rir: '2',
          rest: 90,
          note: lib.cues[0]
        });
      } else {
        const ex = d.exercises[pickIndex];
        ex.exId = id;
        ex.unit = unit;
        if (unit === 'sec') { ex.reps = [20, 30]; }
        ex.note = lib.cues[0];
      }
      savePlan();
      mode = 'day';
      paint();
      toast(adding ? '已添加 ' + lib.name : '已替换为 ' + lib.name);
    };

    box.querySelector('[data-back]').onclick = () => { mode = 'day'; paint(); };
    const qEl = box.querySelector('#pe-q');
    if (qEl) qEl.addEventListener('input', () => {
      pickQuery = qEl.value;
      const pos = qEl.selectionStart;
      paintPick();
      const next = box.querySelector('#pe-q');
      if (next) { next.focus(); next.setSelectionRange(pos, pos); }
    });
    box.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { pickFilter = b.dataset.pf; paint(); });
    box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => commitPick(b.dataset.pick));
    const newBtn = box.querySelector('[data-new-ex]');
    if (newBtn) newBtn.onclick = () => openExerciseEditor(null, id => commitPick(id));
  }

  paint();
}


/* 补录 / 修改某一组：字段随动作的记录模式变化，状态可切换 */
function openSetEditor(sessionId, exIdx, setIdx) {
  const s = sessionById(sessionId);
  if (!s) return;
  const ex = s.exercises[exIdx];
  if (!ex) return;
  const st = ex.sets[setIdx];
  if (!st) return;
  const mode = exMode(ex.exId);
  const assist = isAssist(ex.exId);
  const u = unitLabel();
  // planned 保持「未记录」，避免误存成「未做」
  let status = st.status === 'completed' ? 'completed' : st.status === 'skipped' ? 'skipped' : 'planned';
  const live = s.status === 'in_progress';

  let fields = '';
  if (mode === 'time') {
    fields = '<div class="log-grid two">' +
      bdField('es-sec', '保持秒数' + (LIB[ex.exId] && LIB[ex.exId].perSide ? '（每侧）' : ''), st.seconds, 'numeric') +
      bdField('es-rir', 'RIR', st.rir, 'numeric') + '</div>';
  } else if (mode === 'quality') {
    fields =
      '<div class="rpe-wrap"><div class="rpe-top"><span>动作质量 RPE</span><b id="es-rpe-out">' +
        (st.rpe != null ? st.rpe : '—') + '</b></div>' +
        '<input class="rpe-range" id="es-rpe" type="range" min="4" max="10" step="0.5" value="' + (st.rpe != null ? st.rpe : 8) + '">' +
        '<div class="rpe-scale"><span>4 轻松</span><span>7 吃力</span><span>10 极限</span></div></div>' +
      '<div class="log-grid two" style="margin-top:10px">' + bdField('es-r', '完成次数', st.reps, 'numeric') + '</div>';
  } else {
    fields = '<div class="log-grid">' +
      bdField('es-w', (assist ? '辅助 (' : '重量 (') + u + ')', st.weight != null ? toUnit(Math.abs(st.weight)) : '') +
      bdField('es-r', '次数', st.reps) +
      bdField('es-rir', 'RIR', st.rir) + '</div>' +
      (assist ? '<div class="f11 mut" style="margin-top:8px">辅助配重越小越难：PR 按「次数优先、辅助重量越低越好」算。</div>' : '');
  }

  openSheet({
    title: ex.name + ' · 第 ' + (setIdx + 1) + ' 组',
    desc: fmtCN(s.date) + ' · 修改后立即保存，不影响计划模板',
    body:
      '<div class="chiprow" id="es-status" style="margin-bottom:14px">' +
        '<button data-st="completed" class="' + (status === 'completed' ? 'on' : '') + '">已完成</button>' +
        '<button data-st="skipped" class="' + (status === 'skipped' ? 'on' : '') + '">未做 / 跳过</button>' +
        (status === 'planned' ? '<span class="f11 mut" style="align-self:center;padding-left:6px">当前未记录</span>' : '') +
      '</div>' +
      fields +
      '<div class="field wide" style="margin-top:10px"><label>备注</label><div class="ctrl">' +
        '<input id="es-n" type="text" placeholder="动作感受、器械档位…" value="' + esc(st.note || '') + '"></div></div>' +
      (live ? '<button class="btn ghost block mt12" data-jump="1">' + icon('undo') + ' 回到这组继续练</button>' : '') +
      (st.extra ? '<button class="btn ghost block mt8" data-del-set="1" style="color:var(--danger)">删除这个临时组</button>' : '') +
      '<div class="f11 mut mt12">状态改成「未做」后，这组不计入训练量与完成率，但记录仍保留在历史里。</div>',
    actions: [
      { label: '取消', cls: 'ghost' },
      {
        label: '保存', cls: 'primary', onClick: () => {
          if (mode === 'time') {
            const sec = $('#es-sec').value.trim();
            const rir = $('#es-rir').value.trim();
            st.seconds = sec === '' ? null : Math.max(0, Math.round(Number(sec) || 0));
            st.rir = rir === '' ? null : Math.max(0, Math.min(10, Number(rir) || 0));
          } else if (mode === 'quality') {
            const rpe = $('#es-rpe').value;
            const r = $('#es-r').value.trim();
            st.rpe = rpe === '' ? null : Number(rpe);
            st.reps = r === '' ? null : Math.max(0, Number(r) || 0);
          } else {
            const w = $('#es-w').value.trim();
            const r = $('#es-r').value.trim();
            const rir = $('#es-rir').value.trim();
            st.weight = w === '' ? null : fromUnit(w);
            st.reps = r === '' ? null : Math.max(0, Number(r) || 0);
            st.rir = rir === '' ? null : Math.max(0, Math.min(10, Number(rir) || 0));
          }
          const hasData = setHasData(st, ex.exId);
          if (status === 'planned' && hasData) status = 'completed'; // 补了数据就算完成
          st.status = status;
          const noteEl = $('#es-n');
          if (noteEl) st.note = noteEl.value.trim();
          st.completedAt = status === 'completed' ? (st.completedAt || Date.now()) : null;
          st.dataComplete = status === 'completed' && hasData;
          saveDB(true);
          if (typeof WK !== 'undefined' && WK.session && WK.session.id === s.id) renderWorkout();
          else renderCurrentTab();
          toast('已保存');
        }
      }
    ],
    onMount: (mask, close) => {
      mask.querySelectorAll('[data-st]').forEach(b => {
        b.onclick = () => {
          status = b.dataset.st;
          mask.querySelectorAll('[data-st]').forEach(x => x.classList.toggle('on', x === b));
        };
      });
      const rpe = mask.querySelector('#es-rpe');
      if (rpe) rpe.oninput = () => {
        const out = mask.querySelector('#es-rpe-out');
        if (out) out.textContent = rpe.value;
      };
      const jump = mask.querySelector('[data-jump]');
      if (jump) jump.onclick = () => {
        close();
        jumpToSet(s, exIdx, setIdx);
      };
      const del = mask.querySelector('[data-del-set]');
      if (del) del.onclick = () => {
        confirmDialog({
          title: '删除这个临时组？', desc: '只删除这一条临时组记录，计划模板不受影响。', confirmText: '删除', danger: true
        }).then(ok => {
          if (!ok) return;
          ex.sets = ex.sets.filter(x => x !== st).map((x, i) => Object.assign(x, { idx: i }));
          if (s.setIndex >= ex.sets.length) s.setIndex = Math.max(0, ex.sets.length - 1);
          saveDB(true);
          close();
          if (typeof WK !== 'undefined' && WK.session && WK.session.id === s.id) renderWorkout();
          else renderCurrentTab();
          toast('已删除临时组');
        });
      };
    }
  });
}

/* 回到某组继续训练：撤销该组完成状态并把指针移回去 */
function jumpToSet(s, exIdx, setIdx) {
  const ex = s.exercises[exIdx];
  if (!ex || !ex.sets[setIdx]) return;
  s.exIndex = exIdx;
  s.setIndex = setIdx;
  s.phase = 'SetActive';
  s.timer = null;
  s.restKind = 'set';
  ex.sets[setIdx].status = 'planned';
  ex.sets[setIdx].completedAt = null;
  ex.status = 'active';
  saveDB(true);
  if (typeof WK !== 'undefined') {
    if (!WK.session || WK.session.id !== s.id) openWorkout(s.id);
    else { renderWorkout(); startTick(); }
  }
  toast('已回到第 ' + (setIdx + 1) + ' 组');
}

</script>
  <script>
/* ==========================================================
   云端同步（Supabase）
   - 登录：GitHub OAuth 优先，邮箱验证码备选
   - 存储：Supabase Postgres user_data 表中的 data.trainingLogV2
     （沿用旧版已有的 user_data 表；旧版数据保留在同行的其它字段里）
   - 同步：整库 last-write-wins（最后保存的设备为准）
   - 普通用户不需要填写任何 URL/Key，部署包内置投影
   ========================================================== */

const CLOUD_DEFAULT = {
  url: 'https://oouphzofclcosugcgwhv.supabase.co',
  key: 'sb_publishable_DGytJnqh5hiYBWGurp261w_vSF-5Kdx'
};
const CLOUD_CFG_KEY = 'ft_cloud_cfg_v1'; // 仅本地开发/Mock 可覆盖；正式版不暴露
const CLOUD_AUTH_KEY = 'ft_cloud_auth_v1';
const CLOUD_META_KEY = 'ft_cloud_meta_v1';
const CLOUD_REDIRECT_PATH = () => location.origin + location.pathname;

let cloudBusy = false;
let cloudApplying = false;
let cloudTimer = null;
let cloudInitialSyncDone = false;
const cloudUi = { email: '', code: '', codeSent: false, msg: '', msgKind: '', busy: false };

function cloudCfg() {
  try {
    const raw = localStorage.getItem(CLOUD_CFG_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.url && parsed.key) {
        return { url: String(parsed.url).replace(/\/+$/, ''), key: String(parsed.key) };
      }
    }
  } catch (e) {}
  return CLOUD_DEFAULT;
}
function cloudApi(path) { return cloudCfg().url + path; }
function cloudStoreGet(key) {
  try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
}
function cloudStoreSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
function cloudStoreDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
function cloudEscape(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function cloudGetMeta() { return cloudStoreGet(CLOUD_META_KEY) || {}; }
function cloudSetMeta(patch) {
  const next = Object.assign({}, cloudGetMeta(), patch || {});
  cloudStoreSet(CLOUD_META_KEY, next);
  return next;
}
function cloudGetSession() {
  const s = cloudStoreGet(CLOUD_AUTH_KEY);
  if (!s || !s.accessToken || !s.user || !s.user.id) return null;
  return s;
}
function cloudSaveSession(session) { cloudStoreSet(CLOUD_AUTH_KEY, session); }
function cloudClearSession() { cloudStoreDel(CLOUD_AUTH_KEY); }
function cloudSessionUser(session) {
  return (session && session.user) || { id: '', email: '' };
}
function cloudDecodeJwt(token) {
  try {
    const part = String(token || '').split('.')[1] || '';
    const base = part.replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(Array.prototype.map.call(atob(base), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  } catch (e) { return null; }
}
function cloudSessionFromToken(accessToken, refreshToken, expiresIn) {
  const payload = cloudDecodeJwt(accessToken) || {};
  const meta = payload.user_metadata || {};
  return {
    accessToken: String(accessToken),
    refreshToken: refreshToken || null,
    expiresAt: Date.now() + (Number(expiresIn) || 3600) * 1000,
    user: {
      id: String(payload.sub || ''),
      email: String(payload.email || meta.email || '')
    }
  };
}

async function cloudFetch(url, options, timeoutMs) {
  const controller = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = controller ? setTimeout(() => controller.abort(), timeoutMs || 20000) : null;
  let res;
  try {
    res = await fetch(url, Object.assign({}, options, controller ? { signal: controller.signal } : {}));
  } catch (err) {
    if (timer) clearTimeout(timer);
    const msg = String(err && err.message ? err.message : err);
    throw new Error(/AbortError/i.test(msg) ? '请求超时，请检查网络' : '网络请求失败（可能是 CORS 或离线）');
  }
  if (timer) clearTimeout(timer);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) {
    const detail = (data && (data.msg || data.message || data.error_description || data.error)) || text.slice(0, 180) || res.status;
    const msg = '云端请求失败（' + res.status + '）：' + (typeof detail === 'string' ? detail : JSON.stringify(detail));
    if (res.status === 404 || res.status === 401 || res.status === 403) {
      throw new Error(msg + '。请确认 Supabase 中已执行 user_data 建表/RLS SQL（旧版云同步使用过则已存在）。');
    }
    throw new Error(msg);
  }
  return data;
}

function cloudHeaders(session, extra) {
  const cfg = cloudCfg();
  const headers = Object.assign({
    apikey: cfg.key,
    'content-type': 'application/json'
  }, extra || {});
  // 未登录的 Auth 请求只用 apikey（Supabase 官方 curl 也是这么调用）；
  // 已登录的 Auth/PostgREST 请求使用用户 access token。
  if (session && session.accessToken) headers.authorization = 'Bearer ' + session.accessToken;
  return headers;
}

function cloudParseHash(hash) {
  const raw = String(hash || '').replace(/^#/, '');
  const pos = raw.search(/(?:access_token|error)=/);
  if (pos < 0) return { kind: 'none' };
  const sep = Math.max(raw.lastIndexOf('#', pos), raw.lastIndexOf('?', pos));
  const params = new URLSearchParams(raw.slice(sep + 1));
  const error = params.get('error');
  if (error) {
    return { kind: 'error', error, code: params.get('error_code') || '', desc: params.get('error_description') || '' };
  }
  const accessToken = params.get('access_token');
  if (!accessToken) return { kind: 'none' };
  return {
    kind: 'tokens',
    accessToken,
    refreshToken: params.get('refresh_token') || null,
    expiresIn: Number(params.get('expires_in')) || 3600
  };
}
function cloudCleanUrl() {
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
async function cloudFetchUser(session) {
  const user = await cloudFetch(cloudApi('/auth/v1/user'), { headers: cloudHeaders(session) });
  if (user && user.id) {
    session.user = { id: String(user.id), email: String(user.email || '') };
    cloudSaveSession(session);
  }
  return session;
}
async function cloudEnsureSession() {
  let session = cloudGetSession();
  if (!session) return null;
  if (!session.user || !session.user.id || !session.user.email) {
    try { session = await cloudFetchUser(session); } catch (e) { /* 继续用 access token */ }
  }
  if (session.expiresAt && Date.now() > Number(session.expiresAt) - 60000) {
    try {
      const data = await cloudFetch(cloudApi('/auth/v1/token?grant_type=refresh_token'), {
        method: 'POST',
        headers: cloudHeaders(null),
        body: JSON.stringify({ refresh_token: session.refreshToken })
      });
      if (!data || !data.access_token) throw new Error('refresh failed');
      session = cloudSessionFromToken(data.access_token, data.refresh_token, data.expires_in);
      if (!session.user.email && data.user) session.user = { id: String(data.user.id), email: String(data.user.email || '') };
      cloudSaveSession(session);
    } catch (e) {
      cloudClearSession();
      return null;
    }
  }
  return session;
}

function cloudHandleRedirect() {
  const parsed = cloudParseHash(location.hash);
  if (parsed.kind === 'none') return;
  if (parsed.kind === 'error') {
    const desc = parsed.desc ? decodeURIComponent(parsed.desc.replace(/\+/g, ' ')) : parsed.code || parsed.error;
    cloudUi.msg = '登录链接无效或已过期：' + desc + '。请在设置页重新登录。';
    cloudUi.msgKind = 'err';
    cloudCleanUrl();
    return;
  }
  const session = cloudSessionFromToken(parsed.accessToken, parsed.refreshToken, parsed.expiresIn);
  cloudSaveSession(session);
  cloudUi.msg = '登录成功，正在同步云端数据…';
  cloudUi.msgKind = 'ok';
  cloudCleanUrl();
  if (!session.user.id || !session.user.email) {
    cloudFetchUser(session).then(() => cloudSync({ silent: true })).catch(() => {});
  }
}

function cloudLoginGithub() {
  if (location.protocol === 'file:') {
    toast('请把应用部署到 HTTPS 后再使用 GitHub 登录');
    return;
  }
  const cfg = cloudCfg();
  const redirect = CLOUD_REDIRECT_PATH();
  location.href = cfg.url + '/auth/v1/authorize?provider=github&redirect_to=' + encodeURIComponent(redirect);
}

async function cloudSendCode() {
  const email = String(cloudUi.email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    cloudUi.msg = '请输入有效邮箱';
    cloudUi.msgKind = 'err';
    renderCurrentTab();
    return;
  }
  cloudUi.busy = true;
  cloudUi.msg = '正在发送登录邮件…';
  cloudUi.msgKind = '';
  renderCurrentTab();
  try {
    await cloudFetch(cloudApi('/auth/v1/otp?redirect_to=' + encodeURIComponent(CLOUD_REDIRECT_PATH())), {
      method: 'POST',
      headers: cloudHeaders(null),
      body: JSON.stringify({ email, create_user: true, gotrue_meta_security: {} })
    });
    cloudUi.codeSent = true;
    cloudUi.msg = '登录邮件已发送；邮件里可能有验证码或登录链接，点链接会自动回来。';
    cloudUi.msgKind = 'ok';
  } catch (err) {
    cloudUi.msg = String(err.message || err);
    cloudUi.msgKind = 'err';
  }
  cloudUi.busy = false;
  renderCurrentTab();
}

async function cloudVerifyCode() {
  const email = String(cloudUi.email || '').trim().toLowerCase();
  const code = String(cloudUi.code || '').replace(/\s+/g, '');
  if (!/^\d{6,8}$/.test(code)) {
    cloudUi.msg = '请输入邮件中的 6–8 位验证码';
    cloudUi.msgKind = 'err';
    renderCurrentTab();
    return;
  }
  cloudUi.busy = true;
  cloudUi.msg = '正在验证并登录…';
  cloudUi.msgKind = '';
  renderCurrentTab();
  try {
    const data = await cloudFetch(cloudApi('/auth/v1/verify'), {
      method: 'POST',
      headers: cloudHeaders(null),
      body: JSON.stringify({ type: 'email', email, token: code })
    });
    if (!data || !data.access_token) throw new Error('登录响应不完整');
    const session = cloudSessionFromToken(data.access_token, data.refresh_token, data.expires_in);
    if (!session.user.email) session.user.email = email;
    if (data.user && data.user.id) session.user.id = String(data.user.id);
    cloudSaveSession(session);
    cloudUi.msg = '登录成功，正在同步…';
    cloudUi.msgKind = 'ok';
    cloudUi.codeSent = false;
    cloudUi.busy = false;
    await cloudSync({ silent: false });
    return;
  } catch (err) {
    cloudUi.msg = String(err.message || err);
    cloudUi.msgKind = 'err';
  }
  cloudUi.busy = false;
  renderCurrentTab();
}

async function cloudLogout() {
  const session = cloudGetSession();
  const cfg = cloudCfg();
  try {
    if (session && session.accessToken) {
      await cloudFetch(cfg.url + '/auth/v1/logout', {
        method: 'POST',
        headers: cloudHeaders(session)
      }, 8000);
    }
  } catch (e) {}
  cloudClearSession();
  cloudInitialSyncDone = false;
  cloudSetMeta({ lastError: null });
  cloudUi.msg = '已退出云端登录；本机数据仍在。';
  cloudUi.msgKind = '';
  if (typeof renderCurrentTab === 'function') renderCurrentTab();
}

function cloudIsEmpty(db) {
  if (!db) return true;
  const empty = arr => !Array.isArray(arr) || arr.length === 0;
  return empty(db.sessions) && empty(db.runs) && empty(db.body) && empty(db.checkins) && empty(db.customEx) && !db.planUpdated;
}

async function cloudPull(session) {
  const rows = await cloudFetch(
    cloudApi('/rest/v1/user_data?select=user_id,data,updated_at&user_id=eq.' + encodeURIComponent(session.user.id)),
    { headers: cloudHeaders(session) }
  );
  return Array.isArray(rows) && rows.length ? rows[0] : null;
}

async function cloudPush(session) {
  const row = await cloudPull(session);
  const data = row && row.data && typeof row.data === 'object' ? Object.assign({}, row.data) : {};
  const now = new Date().toISOString();
  if (!DB.updatedAt) DB.updatedAt = now;
  data.trainingLogV2 = { schema: 2, savedAt: DB.updatedAt, savedBy: 'training-log', db: DB };
  await cloudFetch(cloudApi('/rest/v1/user_data'), {
    method: 'POST',
    headers: cloudHeaders(session, { prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ user_id: session.user.id, data, updated_at: now })
  });
}

function cloudApplyRemote(remoteDb) {
  if (!remoteDb) return;
  cloudApplying = true;
  try {
    DB = normalizeDB(remoteDb);
    registerCustomExercises();
    ensurePlanData();
    buildPlan();
    saveDB(true);
  } finally {
    cloudApplying = false;
  }
}

async function cloudSync(opts) {
  opts = opts || {};
  if (cloudBusy) return;
  if (!navigator.onLine) {
    cloudSetMeta({ lastError: '当前离线' });
    if (!opts.silent) { cloudUi.msg = '当前离线，联网后再同步'; cloudUi.msgKind = 'err'; renderCurrentTab(); }
    return;
  }
  const session = await cloudEnsureSession();
  if (!session) {
    cloudUi.msg = '登录已过期，请重新登录';
    cloudUi.msgKind = 'err';
    if (typeof renderCurrentTab === 'function') renderCurrentTab();
    return;
  }
  cloudBusy = true;
  cloudUi.busy = true;
  if (!opts.silent) { cloudUi.msg = '正在同步…'; renderCurrentTab(); }
  try {
    const row = await cloudPull(session);
    const nested = row && row.data && row.data.trainingLogV2;
    const localEmpty = cloudIsEmpty(DB);
    if (!nested) {
      await cloudPush(session);
      cloudUi.msg = localEmpty ? '云端备份已创建' : '已将本机数据上传到云端';
      cloudUi.msgKind = 'ok';
    } else {
      const remoteDb = normalizeDB(nested.db || {});
      const remoteEmpty = cloudIsEmpty(remoteDb);
      if (localEmpty && !remoteEmpty) {
        cloudApplyRemote(remoteDb);
        cloudUi.msg = '已从云端恢复数据';
        cloudUi.msgKind = 'ok';
      } else if (!localEmpty && remoteEmpty) {
        await cloudPush(session);
        cloudUi.msg = '已将本机数据上传到云端';
        cloudUi.msgKind = 'ok';
      } else {
        const remoteSaved = String(nested.savedAt || (row && row.updated_at) || '');
        const localSaved = String(DB.updatedAt || '');
        if (remoteSaved && (!localSaved || remoteSaved > localSaved)) {
          cloudApplyRemote(remoteDb);
          cloudUi.msg = '已拉取云端较新的数据';
          cloudUi.msgKind = 'ok';
        } else {
          await cloudPush(session);
          cloudUi.msg = '已上传本机数据';
          cloudUi.msgKind = 'ok';
        }
      }
    }
    cloudInitialSyncDone = true;
    cloudSetMeta({ lastSyncedAt: new Date().toISOString(), lastError: null });
  } catch (err) {
    cloudUi.msg = String(err.message || err);
    cloudUi.msgKind = 'err';
    cloudSetMeta({ lastError: String(err.message || err) });
  } finally {
    cloudBusy = false;
    cloudUi.busy = false;
    if (typeof renderCurrentTab === 'function') renderCurrentTab();
  }
}

async function cloudDeleteRemote() {
  const session = await cloudEnsureSession();
  if (!session) { cloudUi.msg = '请先登录'; renderCurrentTab(); return; }
  try {
    const row = await cloudPull(session);
    if (!row) { cloudUi.msg = '云端没有数据'; renderCurrentTab(); return; }
    const data = row.data && typeof row.data === 'object' ? Object.assign({}, row.data) : {};
    delete data.trainingLogV2;
    if (Object.keys(data).length === 0) {
      await cloudFetch(cloudApi('/rest/v1/user_data?user_id=eq.' + encodeURIComponent(session.user.id)), {
        method: 'DELETE', headers: cloudHeaders(session)
      });
    } else {
      await cloudFetch(cloudApi('/rest/v1/user_data?user_id=eq.' + encodeURIComponent(session.user.id)), {
        method: 'PATCH', headers: cloudHeaders(session), body: JSON.stringify({ data: data, updated_at: new Date().toISOString() })
      });
    }
    cloudSetMeta({ lastSyncedAt: null, lastError: null });
    cloudUi.msg = '云端训练数据已删除（本机数据保留）';
    cloudUi.msgKind = 'ok';
  } catch (err) {
    cloudUi.msg = String(err.message || err);
    cloudUi.msgKind = 'err';
  }
  renderCurrentTab();
}

function cloudAfterLocalSave() {
  if (cloudApplying || !cloudInitialSyncDone) return;
  if (!cloudGetSession()) return;
  if (cloudTimer) clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    cloudTimer = null;
    cloudSync({ silent: true });
  }, 1600);
}

function cloudInit() {
  cloudHandleRedirect();
  if (navigator.onLine) {
    window.addEventListener('online', () => {
      if (cloudGetSession()) cloudSync({ silent: true });
    });
  }
  if (cloudGetSession()) {
    setTimeout(() => cloudSync({ silent: true }), 500);
  }
}

function cloudSettingsCard() {
  const session = cloudGetSession();
  const meta = cloudGetMeta();
  const msg = cloudUi.msg
    ? '<div class="cloud-msg ' + (cloudUi.msgKind === 'err' ? 'err' : 'ok') + '">' + cloudEscape(cloudUi.msg) + '</div>'
    : '';
  let body = '';
  if (!session) {
    body =
      '<div class="f12 mut" style="line-height:1.65">登录后可以把训练、跑步、身体与状态记录、计划和自建动作同步到云端；换手机或电脑登录同一账号即可恢复。</div>' +
      '<button class="btn primary block" style="margin-top:12px" data-cloud-github>使用 GitHub 登录</button>' +
      '<div class="cloud-email">' +
        '<input id="cloud-email" class="input" type="email" inputmode="email" autocomplete="email" placeholder="邮箱地址（备用登录方式）" value="' + cloudEscape(cloudUi.email) + '">' +
        '<button class="btn sm block" style="margin-top:8px" data-cloud-send ' + (cloudUi.busy ? 'disabled' : '') + '>' + (cloudUi.codeSent ? '重新发送登录邮件' : '发送邮箱登录邮件') + '</button>' +
        (cloudUi.codeSent
          ? '<input id="cloud-code" class="input" style="margin-top:8px" inputmode="numeric" placeholder="邮件中的 6–8 位验证码" value="' + cloudEscape(cloudUi.code) + '">' +
            '<button class="btn sm primary block" style="margin-top:8px" data-cloud-verify ' + (cloudUi.busy ? 'disabled' : '') + '>验证并登录</button>'
          : '') +
        '<div class="f11 mut" style="margin-top:8px;line-height:1.6">邮件可能是验证码，也可能是登录链接；点链接会自动回到应用。不需要填写 Supabase URL 或 Key。</div>' +
      '</div>' + msg;
  } else {
    const user = cloudSessionUser(session);
    const last = meta.lastSyncedAt ? new Date(meta.lastSyncedAt).toLocaleString('zh-CN') : '尚未同步';
    body =
      '<div class="setrow"><div class="grow"><div class="t">' + cloudEscape(user.email || '已登录') + '</div>' +
        '<div class="s">最近同步：' + cloudEscape(last) + '</div></div><span class="tag accent">云端已连接</span></div>' +
      msg +
      '<div class="cloud-actions">' +
        '<button class="btn primary block" data-cloud-sync ' + (cloudUi.busy ? 'disabled' : '') + '>立即同步</button>' +
        '<button class="btn ghost block" data-cloud-logout>退出登录</button>' +
        '<button class="btn ghost block" style="color:var(--danger)" data-cloud-delete>删除云端训练数据</button>' +
      '</div>' +
      '<div class="f11 mut" style="margin-top:10px;line-height:1.6">同步训练、跑步、身体、状态、计划与自建动作。AI Key/知识库不参与同步。多设备以最后保存的一方为准，避免同时在两台设备修改同一条记录。</div>';
  }
  return '<div class="card cloud-card" id="cloud-card">' +
    '<div class="card-title"><h2>云端同步 <span class="hint">GitHub / 邮箱</span></h2></div>' + body + '</div>';
}

function bindCloudSettings() {
  const card = document.getElementById('cloud-card');
  if (!card) return;
  const email = card.querySelector('#cloud-email');
  const code = card.querySelector('#cloud-code');
  if (email) email.addEventListener('input', e => { cloudUi.email = e.target.value; });
  if (code) code.addEventListener('input', e => { cloudUi.code = e.target.value; });
  const bind = (sel, fn) => { const el = card.querySelector(sel); if (el) el.addEventListener('click', fn); };
  bind('[data-cloud-github]', cloudLoginGithub);
  bind('[data-cloud-send]', cloudSendCode);
  bind('[data-cloud-verify]', cloudVerifyCode);
  bind('[data-cloud-sync]', () => cloudSync({ silent: false }));
  bind('[data-cloud-logout]', cloudLogout);
  bind('[data-cloud-delete]', () => {
    confirmDialog({
      title: '删除云端训练数据？',
      desc: '会删除云端的 trainingLogV2 数据；本机数据保留，旧版其它云端数据也不会被动。',
      confirmText: '删除云端数据', danger: true
    }).then(ok => { if (ok) cloudDeleteRemote(); });
  });
}

</script>
  <script>
/* ==========================================================
   入口：初始化、导航
   ========================================================== */

const Nav = {
  go(tab) {
    UI.tab = tab;
    if (typeof closeWorkoutLayer === 'function' && WK.session) closeWorkoutLayer();
    renderCurrentTab();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
};

function init() {
  loadDB();
  registerCustomExercises();
  ensurePlanData();
  buildPlan();
  $$('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const t = tab.dataset.tab;
      if (t === UI.tab) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      UI.tab = t;
      if (t === 'history') {
        UI.selectedDate = todayKey();
        UI.historyMonth = new Date();
      }
      renderCurrentTab();
      window.scrollTo(0, 0);
    });
  });

  renderCurrentTab();

  // 云端登录回调/启动同步（sync.js 不存在时跳过，保持纯本地可用）
  if (typeof cloudInit === 'function') cloudInit();

  // 计划改版提示（仅升级后第一次打开）
  if (DB.planUpdated) {
    DB.planUpdated = false;
    saveDB(true);
    setTimeout(() => { if (typeof toast === 'function') toast('计划已更新：Pallof 改按秒、引体技术组不计入训练量'); }, 700);
  }

  // 未完成的训练：直接恢复到中断处（状态机、组数据与计时器都会还原）
  const active = activeSession();
  if (active) setTimeout(() => openWorkout(active.id), 260);

  // 页面重新可见时刷新计时显示（后台回来时间必须准确）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && WK.session) {
      primeAudio();
      syncTimerDom();
      if (WK.session.phase === 'Resting' && WK.session.timer && timerRemaining(WK.session.timer) <= 0) {
        WK.session.timer.state = 'finished';
        WK.session.phase = 'RestFinished';
        saveDB(true);
        syncTimerDom();
        syncRestButtons();
        // 后台期间错过的提醒，回到前台时补一次声音/振动
        if (typeof restFinishedAlert === 'function') restFinishedAlert();
      }
    }
  });
}

init();
