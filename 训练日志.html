  <script>
/* ==========================================================
   轻量 SVG 图表（无外部依赖，离线可用）
   ========================================================== */

let __chartSeq = 0;

const GROUP_COLORS = {
  '背': '#000000',
  '胸': '#3b3b3b',
  '肩': '#656565',
  '股四头肌': '#1f1f1f',
  '腘绳肌': '#878787',
  '臀': '#2b2b2b',
  '核心': '#737373',
  '肱二头肌': '#4f4f4f',
  '肱三头肌': '#959595',
  '小腿': '#575757'
};

function niceTicks(min, max, count, int) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step0 = span / (count || 3);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  let step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
  if (int) step = Math.max(1, Math.round(step));

  let lo, hi, ticks;
  let guard = 0;
  do {
    lo = Math.floor(min / step) * step;
    hi = Math.ceil(max / step) * step;
    ticks = [];
    for (let v = lo; v <= hi + step * 0.001; v += step) {
      ticks.push(Math.round(v * 1000) / 1000);
    }
    if (ticks.length > 5 && guard++ < 8) step = step * 2;
    else break;
  } while (true);

  return { lo: lo, hi: hi, ticks: ticks };
}

/* 折线图：points = [{x:'2026-11-01', y: 62.5}] */
function lineChart(opts) {
  const pts = (opts.points || []).filter(p => p.y != null && !isNaN(p.y));
  const w = 360, h = opts.height || 168;
  const pad = { l: 38, r: 12, t: 16, b: 24 };
  if (pts.length < 2) {
    return '<div class="empty" style="padding:26px 0">' + icon('chart') + '<div>' + (opts.emptyText || '数据不足，至少需要 2 条记录') + '</div></div>';
  }
  const xs = pts.map(p => parseKey(p.x).getTime());
  const ys = pts.map(p => p.y);
  const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  const t = niceTicks(Math.min.apply(null, ys), Math.max.apply(null, ys), opts.ticks || 3, opts.int);
  const spanX = maxX - minX || 1;
  const sx = v => pad.l + ((v - minX) / spanX) * (w - pad.l - pad.r);
  const sy = v => pad.t + (1 - (v - t.lo) / (t.hi - t.lo)) * (h - pad.t - pad.b);

  const gid = 'g' + (++__chartSeq);

  let d = '', area = '';
  pts.forEach((p, i) => {
    const X = sx(xs[i]), Y = sy(p.y);
    d += (i === 0 ? 'M' : 'L') + X.toFixed(1) + ' ' + Y.toFixed(1) + ' ';
  });
  area = d + 'L' + sx(xs[xs.length - 1]).toFixed(1) + ' ' + (h - pad.b) + ' L' + sx(xs[0]).toFixed(1) + ' ' + (h - pad.b) + ' Z';

  let avgPath = '';
  if (opts.avg && pts.length >= 3) {
    const win = opts.avg;
    const avgs = pts.map((p, i) => {
      const from = Math.max(0, i - win + 1);
      const slice = ys.slice(from, i + 1);
      return slice.reduce((a, b) => a + b, 0) / slice.length;
    });
    avgPath = avgs.map((v, i) => (i === 0 ? 'M' : 'L') + sx(xs[i]).toFixed(1) + ' ' + sy(v).toFixed(1)).join(' ');
  }

  const grid = t.ticks.map(v =>
    '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + sy(v).toFixed(1) + '" y2="' + sy(v).toFixed(1) + '" stroke="rgba(0,0,0,.055)" stroke-width="1"/>' +
    '<text x="' + (pad.l - 8) + '" y="' + (sy(v) + 3.5).toFixed(1) + '" text-anchor="end" fill="#6e6e6e" font-size="9.5" font-family="' + 'ui-monospace, monospace' + '">' + v + '</text>'
  ).join('');

  const dots = pts.length <= 26 ? pts.map((p, i) =>
    '<circle cx="' + sx(xs[i]).toFixed(1) + '" cy="' + sy(p.y).toFixed(1) + '" r="2.6" fill="#ffffff" stroke="' + (opts.color || '#000000') + '" stroke-width="1.8"/>'
  ).join('') : '';

  const xLabels = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => {
    const d2 = parseKey(pts[i].x);
    const anchor = i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle';
    return '<text x="' + sx(xs[i]).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="' + anchor + '" fill="#6e6e6e" font-size="9.5">' + (d2.getMonth() + 1) + '/' + d2.getDate() + '</text>';
  }).join('');

  return '<div class="chart-box"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + (opts.color || '#000000') + '" stop-opacity=".26"/>' +
      '<stop offset="100%" stop-color="' + (opts.color || '#000000') + '" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    (avgPath ? '<path d="' + avgPath + '" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1.4" stroke-dasharray="4 3"/>' : '') +
    '<path d="' + d + '" fill="none" stroke="' + (opts.color || '#000000') + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + xLabels +
  '</svg></div>';
}

/* 柱状图：items = [{label, value, max}] */
function barChart(items, opts) {
  opts = opts || {};
  const w = 360, h = opts.height || 150;
  const pad = { l: 30, r: 8, t: 14, b: 24 };
  if (!items.length) return emptyBlock('暂无数据', 'chart');
  const max = opts.max || Math.max.apply(null, items.map(i => i.value)) || 1;
  const innerW = w - pad.l - pad.r;
  const bw = innerW / items.length;
  const barW = Math.min(30, bw * 0.52);
  const sy = v => pad.t + (1 - v / max) * (h - pad.t - pad.b);

  const bars = items.map((it, i) => {
    const x = pad.l + i * bw + (bw - barW) / 2;
    const y = sy(it.value);
    const hh = Math.max(2, h - pad.b - y);
    const color = it.color || 'rgba(0,0,0,.82)';
    return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="5" fill="' + color + '"/>' +
      (it.value > 0 ? '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" fill="#6e6e6e" font-size="9.5" font-family="ui-monospace, monospace">' + it.value + '</text>' : '') +
      '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (h - 7) + '" text-anchor="middle" fill="#6e6e6e" font-size="9.5">' + esc(it.label) + '</text>';
  }).join('');

  const gridVals = [0, max / 2, max];
  const grid = gridVals.map(v =>
    '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + sy(v).toFixed(1) + '" y2="' + sy(v).toFixed(1) + '" stroke="rgba(0,0,0,.05)"/>' +
    '<text x="' + (pad.l - 6) + '" y="' + (sy(v) + 3).toFixed(1) + '" text-anchor="end" fill="#6e6e6e" font-size="9">' + Math.round(v) + '</text>'
  ).join('');

  return '<div class="chart-box"><svg viewBox="0 0 ' + w + ' ' + h + '">' + grid + bars + '</svg></div>';
}

/* 堆叠柱：weeks = [{label, parts:[{group,value}]}] */
function stackedChart(weeks, opts) {
  opts = opts || {};
  const w = 360, h = opts.height || 168;
  const pad = { l: 26, r: 8, t: 12, b: 24 };
  if (!weeks.length) return emptyBlock('暂无训练量数据', 'chart');
  const totals = weeks.map(wk => wk.parts.reduce((a, b) => a + b.value, 0));
  const max = Math.max.apply(null, totals.concat([1]));
  const innerW = w - pad.l - pad.r;
  const bw = innerW / weeks.length;
  const barW = Math.min(26, bw * 0.5);
  const sy = v => pad.t + (1 - v / max) * (h - pad.t - pad.b);

  const body = weeks.map((wk, i) => {
    let acc = 0;
    const x = pad.l + i * bw + (bw - barW) / 2;
    const segs = wk.parts.map(p => {
      if (p.value <= 0) return '';
      const y0 = sy(acc + p.value), y1 = sy(acc);
      acc += p.value;
      return '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + barW.toFixed(1) +
        '" height="' + Math.max(0, y1 - y0).toFixed(1) + '" fill="' + (GROUP_COLORS[p.group] || '#8a8a8a') + '" opacity=".9"/>';
    }).join('');
    return segs +
      '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (sy(totals[i]) - 5).toFixed(1) + '" text-anchor="middle" fill="#6e6e6e" font-size="9.5" font-family="ui-monospace, monospace">' + totals[i] + '</text>' +
      '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (h - 7) + '" text-anchor="middle" fill="#6e6e6e" font-size="9.5">' + esc(wk.label) + '</text>';
  }).join('');

  return '<div class="chart-box"><svg viewBox="0 0 ' + w + ' ' + h + '">' +
    '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + (h - pad.b) + '" y2="' + (h - pad.b) + '" stroke="rgba(0,0,0,.08)"/>' +
    body + '</svg></div>';
}

/* 环形进度 */
function ringProgress(pct, size, stroke, color) {
  size = size || 64; stroke = stroke || 6;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" style="transform:rotate(-90deg)">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="rgba(0,0,0,.09)" stroke-width="' + stroke + '"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (color || '#000000') +
      '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
  '</svg>';
}

/* ==========================================================
   训练执行引擎 —— 严格按 V1.2 的 10.4.1 状态机实现

   WorkoutReady → SetActive → Resting → RestFinished
                → ExerciseComplete → WorkoutComplete
   ========================================================== */

const RING_C = 2 * Math.PI * 118;

const WK = {
  session: null,
  tick: null,
  lastBeepSec: -1,
  wakeLock: null
};

/* ---------------- 创建训练 ---------------- */
/* dateKey 可选：用于「补记」某一天的训练，缺省为今天 */
function buildSession(dayKey, dateK) {
  const plan = PLAN[dayKey];
  const date = dateK || todayKey();
  const exercises = plan.exercises.map(makeExerciseFromPlan).filter(Boolean);
  const startedAt = date === todayKey()
    ? new Date().toISOString()
    : new Date(parseKey(date).getTime() + 19 * 3600e3).toISOString();
  return {
    id: uid('s'),
    date: date,
    dayKey,
    dayName: plan.name,
    focus: plan.focus,
    warmup: plan.warmup || '',
    stretch: plan.stretch || '',
    status: 'in_progress',
    startedAt,
    realStart: Date.now(),
    endedAt: null,
    exIndex: 0,
    setIndex: 0,
    phase: exercises.length ? 'Warmup' : 'WorkoutComplete',
    exercises,
    timer: null,
    backfill: date !== todayKey()
  };
}

/* 由计划条目生成运行时动作（含空的组记录） */
function makeExerciseFromPlan(pe) {
  const lib = LIB[pe.exId];
  if (!lib) return null;
  return {
    exId: pe.exId,
    name: lib.name,
    gear: lib.gear,
    group: lib.group,
    targetSets: pe.sets,
    reps: pe.reps.slice(),
    unit: pe.unit || 'rep',
    rir: pe.rir,
    rest: pe.rest,
    note: pe.note,
    planNote: pe.note,
    originalPlan: lib.name,
    swappedFrom: null,
    tech: !!pe.tech,
    status: 'pending',
    sets: Array.from({ length: pe.sets }, (_, i) => ({
      idx: i, status: 'planned', weight: null, reps: null, rir: null,
      seconds: null, rpe: null,
      note: '', completedAt: null, extra: false, dataComplete: false
    }))
  };
}

/* 临时加动作时的默认处方：不加进计划模板 */
function defaultPlanEntry(exId) {
  const lib = LIB[exId];
  const time = lib.mode === 'time';
  return {
    exId: exId,
    sets: time ? 2 : 3,
    reps: time ? [20, 30] : [8, 12],
    unit: time ? 'sec' : 'rep',
    rir: '2',
    rest: 90,
    note: lib.cues[0]
  };
}

function startWorkout(dayKey, opts) {
  opts = opts || {};
  primeAudio();
  const existing = activeSession();
  if (existing) {
    confirmDialog({
      title: '有一次未完成的训练',
      desc: fmtCN(existing.date) + ' · ' + existing.dayName + '，已完成 ' + sessionDoneSets(existing) + ' 组。要先完成它吗？',
      confirmText: '继续那次训练',
      cancelText: '放弃并开始新的'
    }).then(ok => {
      if (ok) { openWorkout(existing.id); return; }
      existing.status = 'aborted';
      existing.endedAt = new Date().toISOString();
      existing.timer = null;
      saveDB(true);
      startWorkout(dayKey, opts);
    });
    return;
  }
  if (!PLAN[dayKey] || !PLAN[dayKey].exercises.length) {
    toast('这一天没有训练内容，可在计划里添加动作');
    return;
  }
  const s = buildSession(dayKey, opts.date);
  DB.sessions.push(s);
  saveDB(true);
  openWorkout(s.id);
  askNotifyPermission();
}

function openWorkout(id) {
  const s = sessionById(id);
  if (!s) return;
  WK.session = s;
  document.body.classList.add('workout-mode');
  // 恢复：休息中且已超时 → 进入 RestFinished，不自动进入下一组
  if (s.phase === 'ExerciseComplete') {
    s.phase = 'RestFinished';
    s.restKind = 'exercise';
    s.timer = null;
    saveDB(true);
  }
  if (!s.restKind) s.restKind = 'set';
  if (s.phase === 'Resting' && s.timer) {
    if (s.timer.state === 'running' && timerRemaining(s.timer) <= 0) {
      s.timer.state = 'finished';
      s.phase = 'RestFinished';
      saveDB(true);
    }
  }
  if (s.phase === 'WorkoutComplete' || s.status !== 'in_progress') {
    // 已完成训练再次打开时展示总结
  }
  renderWorkout();
  startTick();
  requestWakeLock();
}

function closeWorkoutLayer() {
  const layer = $('#workout-layer');
  layer.classList.add('hidden');
  layer.innerHTML = '';
  document.body.classList.remove('workout-mode');
  stopTick();
  releaseWakeLock();
  WK.session = null;
  if (typeof renderCurrentTab === 'function') renderCurrentTab();
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible') {
      WK.wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* 忽略 */ }
}
function releaseWakeLock() {
  try { if (WK.wakeLock) { WK.wakeLock.release(); WK.wakeLock = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && WK.session && !$('#workout-layer').classList.contains('hidden')) {
    requestWakeLock();
  }
});

/* ---------------- 计时器 ---------------- */
function timerRemaining(t) {
  if (!t) return 0;
  if (t.state === 'paused') return Math.max(0, t.pausedRemaining || 0);
  if (t.state === 'finished') return 0;
  return Math.max(0, t.endAt - Date.now());
}

function startRestTimer(seconds) {
  const s = WK.session;
  s.timer = {
    total: seconds * 1000,
    endAt: Date.now() + seconds * 1000,
    pausedRemaining: null,
    state: 'running'
  };
  WK.lastBeepSec = -1;
  saveDB(true);
}

function startTick() {
  stopTick();
  WK.tick = setInterval(() => {
    const s = WK.session;
    if (!s) return;
    const t = s.timer;
    if (!t || t.state !== 'running') return;
    const remain = timerRemaining(t);

    // 最后 3 秒提示
    const sec = Math.ceil(remain / 1000);
    if (remain > 0 && remain <= 3000 && sec !== WK.lastBeepSec) {
      WK.lastBeepSec = sec;
      if (DB.settings.countdownBeep) beep(660, 0.07, 0.07);
    }
    if (remain <= 0) {
      t.state = 'finished';
      s.phase = s.phase === 'Resting' ? 'RestFinished' : s.phase;
      saveDB(true);
      restFinishedAlert();
      // 只更新，不整页重绘，避免打断正在输入的数据
      syncTimerDom();
      syncRestButtons();
      return;
    }
    syncTimerDom();
  }, 250);
}
function stopTick() {
  if (WK.tick) { clearInterval(WK.tick); WK.tick = null; }
}

function syncTimerDom() {
  const s = WK.session;
  if (!s || !s.timer) return;
  const t = s.timer;
  const remain = timerRemaining(t);
  const total = t.total || 1;
  const p = Math.max(0, Math.min(1, remain / total));
  const done = t.state === 'finished';
  const prog = $('#ring-prog');
  if (prog) prog.style.strokeDashoffset = done ? '0' : (RING_C * (1 - p)).toFixed(1);
  const timeEl = $('#ring-time');
  if (timeEl) timeEl.textContent = mmss(remain);
  const cap = $('#ring-cap');
  if (cap) {
    if (t.state === 'paused') cap.textContent = '已暂停';
    else if (t.state === 'finished') cap.textContent = '休息结束';
    else cap.textContent = (WK.session && WK.session.restKind === 'exercise') ? '换动作休息' : '组间休息';
  }
  const center = $('#ring-center');
  if (center) {
    center.classList.toggle('paused', t.state === 'paused');
    center.classList.toggle('finished', done);
  }
  const pauseBtn = $('#pause-btn');
  if (pauseBtn) pauseBtn.innerHTML = t.state === 'paused' ? icon('play') + ' 继续' : icon('pause') + ' 暂停';
  if (prog) prog.classList.toggle('finished', t.state === 'finished');
}

function syncRestButtons() {
  const s = WK.session;
  if (!s) return;
  const primary = $('#rest-primary');
  const kicker = $('#rest-kicker-text');
  const extra = $('#rest-extra');
  const finished = s.phase === 'RestFinished';
  const between = s.restKind === 'exercise';
  const isLast = s.exIndex >= s.exercises.length - 1;
  const nextName = !isLast && s.exercises[s.exIndex + 1] ? s.exercises[s.exIndex + 1].name : '';
  if (primary) {
    if (between) {
      primary.innerHTML = isLast ? '完成训练' : '结束休息，开始：' + esc(nextName);
    } else {
      primary.innerHTML = finished
        ? '休息结束，开始第 ' + (s.setIndex + 2) + ' 组' + icon('arrowRight')
        : '结束休息，开始第 ' + (s.setIndex + 2) + ' 组';
    }
    primary.classList.toggle('primary', true);
  }
  if (kicker) {
    kicker.textContent = between
      ? (finished ? '休息结束 · 可以开始下一动作' : '动作间休息' + (nextName ? ' · 接下来 ' + nextName : ''))
      : (finished ? '休息结束 · 等待确认' : '休息中 · 第 ' + (s.setIndex + 1) + ' 组已完成');
  }
  const ctrl = $('#timer-controls');
  if (ctrl) ctrl.classList.toggle('is-finished', finished);
  if (extra) {
    extra.innerHTML = finished
      ? '<button data-act="add-time" data-v="30">继续休息 +30 秒</button><button data-act="undo-set">撤销完成本组</button>'
      : '<button data-act="undo-set">撤销完成本组</button><button data-act="menu">更多</button>';
  }
}

/* ---------------- 渲染 ---------------- */
function currentEx(s) { return s.exercises[s.exIndex]; }
function renderGuide(title, text, sub) {
  const lines = String(text || '').split('\n').map(x => x.trim()).filter(Boolean);
  return '<div class="guide-page fade-in">' +
    '<div class="guide-eyebrow">' + esc(title) + '</div>' +
    (sub ? '<div class="guide-sub">' + esc(sub) + '</div>' : '') +
    '<div class="guide-copy">' + (lines.length
      ? lines.map((line, i) => '<p' + (i === 0 ? ' class="lead"' : '') + '>' + esc(line) + '</p>').join('')
      : '<p>按自己的节奏完成热身/拉伸，出现疼痛立即停止。</p>') + '</div>' +
  '</div>';
}
function sessionSetCount(s) {
  return s.exercises.reduce((n, e) => n + e.sets.length, 0);
}
function sessionDoneSets(s) {
  return s.exercises.reduce((n, e) => n + e.sets.filter(st => st.status === 'completed').length, 0);
}

function renderWorkout() {
  const s = WK.session;
  if (!s) return;
  const layer = $('#workout-layer');
  layer.classList.remove('hidden');

  const ex = currentEx(s);
  const totalEx = s.exercises.length;
  const doneSets = sessionDoneSets(s);
  const totalSets = sessionSetCount(s);

  const atEnd = s.phase === 'WorkoutComplete' || s.status !== 'in_progress';
  let head =
    '<div class="wk-head">' +
      '<button class="icon-btn" data-act="close" aria-label="收起">' + icon('chevDown') + '</button>' +
      '<div class="grow">' +
        '<div class="k">' + esc(s.dayName) + (s.backfill ? ' · 补记 ' + fmtShort(s.date) : '') + (ex && !atEnd ? ' · 第 ' + (s.exIndex + 1) + '/' + totalEx + ' 个动作' : '') + '</div>' +
        '<div class="v tnum">' + (atEnd ? doneSets + ' 组完成' : doneSets + ' / ' + totalSets + ' 组') + '</div>' +
      '</div>' +
      '<button class="icon-btn" data-act="menu" aria-label="更多">' + icon('sliders') + '</button>' +
    '</div>';

  let body = '', foot = '';

  if (s.phase === 'Warmup') {
    body = renderGuide('热身建议', s.warmup);
    foot = '<div class="wk-foot"><button class="btn primary" data-act="warmup-done">热身完成 · 进入正式动作</button></div>';
  } else if (s.phase === 'Stretch') {
    body = renderGuide('拉伸建议', s.stretch);
    foot = '<div class="wk-foot"><button class="btn primary" data-act="stretch-done">拉伸完成 · 训练结束</button></div>';
  } else if (s.phase === 'WorkoutComplete' || s.status !== 'in_progress') {
    body = renderSummary(s);
    foot = '<div class="wk-foot"><button class="btn primary" data-act="back-home">完成并返回</button></div>';
  } else if (s.phase === 'SetActive' && ex) {
    body = renderSetActive(s, ex);
    foot =
      '<div class="wk-foot">' +
        '<button class="btn primary" data-act="complete-set">完成本组</button>' +
        '<div class="wk-sub">' +
          '<button data-act="add-set">+ 临时组</button>' +
          '<button data-act="swap-ex">平替动作</button>' +
          '<button data-act="skip-ex">跳过动作</button>' +
        '</div>' +
      '</div>';
  } else if (s.phase === 'Resting' || s.phase === 'RestFinished') {
    const between = s.restKind === 'exercise';
    body = between ? renderExerciseRest(s, ex) : renderRest(s, ex);
    const isLast = s.exIndex >= totalEx - 1;
    const nextName = !isLast && s.exercises[s.exIndex + 1] ? s.exercises[s.exIndex + 1].name : '';
    const label = between
      ? (isLast ? '完成训练' : '结束休息，开始：' + esc(nextName))
      : '结束休息，开始第 ' + (s.setIndex + 2) + ' 组';
    foot =
      '<div class="wk-foot">' +
        '<button class="btn primary" id="rest-primary" data-act="end-rest">' + label + '</button>' +
        '<div class="wk-sub" id="rest-extra">' +
          (s.phase === 'RestFinished'
            ? '<button data-act="add-time" data-v="30">继续休息 +30 秒</button><button data-act="undo-set">撤销完成本组</button>'
            : '<button data-act="undo-set">撤销完成本组</button><button data-act="menu">更多</button>') +
        '</div>' +
      '</div>';
  } else if (s.phase === 'ExerciseComplete' && ex) {
    // 旧版本中断会话的兜底：统一走动作间休息界面
    s.restKind = 'exercise';
    body = renderExerciseRest(s, ex);
    const isLast2 = s.exIndex >= totalEx - 1;
    foot =
      '<div class="wk-foot">' +
        '<button class="btn primary" id="rest-primary" data-act="end-rest">' + (isLast2 ? '完成训练' : '结束休息，开始：' + esc(s.exercises[s.exIndex + 1].name)) + '</button>' +
        '<div class="wk-sub"><button data-act="add-set">+ 临时组</button><button data-act="menu">更多</button></div>' +
      '</div>';
  }

  const centerCls = s.phase === 'ExerciseComplete' ? ' center-content' : '';
  const guideCls = (s.phase === 'Warmup' || s.phase === 'Stretch') ? ' guide-mode' : '';
  layer.innerHTML = (guideCls ? '' : head) + '<div class="wk-scroll' + centerCls + guideCls + '">' + body + '</div>' + foot;
  if (s.timer) syncTimerDom();
  if (s.phase === 'Resting' || s.phase === 'RestFinished') syncRestButtons();
  bindLogInputs();
}

function renderSetActive(s, ex) {
  const dots = ex.sets.map((st, i) => {
    const cls = st.status === 'completed' ? 'done' : (i === s.setIndex ? 'cur' : '');
    return '<i class="' + cls + (st.extra ? ' extra' : '') + '"></i>';
  }).join('');

  const doneInEx = ex.sets.filter(st => st.status === 'completed').length;
  const prevDone = ex.sets.slice(0, s.setIndex).filter(st => st.status === 'completed');
  const curSet = ex.sets[s.setIndex];
  const last = lastRecord(ex.exId, s.date);
  const lastText = last
    ? '<b>上次 ' + fmtCN(last.date) + '</b> ' + fmtLastSets(last.sets, ex.exId)
    : '暂无历史记录，第一次做这个动作';
  const hint = ex.tech ? null : progressionHint(ex);

  return '' +
    '<div class="setdots">' + dots + '</div>' +
    '<div class="ex-card fade-in">' +
      '<div class="flex between aic">' +
        '<span class="tag">' + esc(ex.gear) + '</span>' +
        (ex.swappedFrom ? '<span class="tag warn">已替换 · 原计划 ' + esc(ex.swappedFrom) + '</span>'
                        : '<span class="tag mute">' + esc(ex.group) + '</span>') +
      '</div>' +
      '<div class="exname">' + esc(ex.name) + '</div>' +
      '<div class="gear">' + icon('target') + ' 计划 ' + ex.targetSets + ' 组 · 已完成 ' + doneInEx + ' 组' +
        (ex.tech ? ' · 技术组不计入训练量' : '') + '</div>' +
      '<div class="ex-specs">' +
        '<div><div class="k">' + (ex.unit === 'sec' ? '保持' : '次数') + '</div><div class="v">' + repsLabel(ex) + '</div></div>' +
        '<div><div class="k">目标 RIR</div><div class="v">' + esc(ex.rir) + '</div></div>' +
        '<div><div class="k">组间休息</div><div class="v">' + mmss(ex.rest * 1000) + '</div></div>' +
      '</div>' +
      (String(ex.rir).indexOf('≥') === 0
        ? '<div class="f11 mut" style="margin-top:-4px">目标「≥' + String(ex.rir).replace('≥', '') + '」= 至少留 ' + String(ex.rir).replace('≥', '') + ' 次余力，记录填 1–3 都算达标。</div>'
        : '') +
      '<div class="ex-cue">' + esc(ex.note) + '</div>' +
      '<div class="lastrec">' + icon('clock') + '<span>' + lastText + '</span></div>' +
      (hint ? '<div class="coach">' + icon('target') + '<span>' + hint + '</span></div>' : '') +
    '</div>' +
    '<div class="setbig fade-in">' +
      '<div class="n">' + (s.setIndex + 1) + '<small>/ ' + ex.sets.length + '</small></div>' +
      '<div class="label">' + (curSet && curSet.extra ? '临时组' : '当前组') + '</div>' +
      (prevDone.length
        ? '<div class="prev-sets">' + prevDone.map(st =>
            '<button class="tag mute" data-edit-set="' + st.idx + '">第 ' + (st.idx + 1) + ' 组 ' +
            fmtSetValue(st, ex.exId) + '</button>').join('') + '</div>'
        : '<div class="f12 mut" style="margin-top:12px">第一组 · 保留 2–3 RIR，动作质量优先</div>') +
    '</div>' +
    (() => {
      const up = s.exercises.slice(s.exIndex + 1);
      if (up.length) return '';
      if (!s._lastTip) {
        s._lastTip = true;
        return '<div class="note" style="margin-bottom:0">' + icon('info') +
          '<span>最后一组：完成后是换动作休息，点击「完成训练」结束本次训练。</span></div>';
      }
      return '';
    })();
}

function renderRest(s, ex) {
  const st = ex.sets[s.setIndex];
  const finished = s.phase === 'RestFinished';
  const remain = timerRemaining(s.timer);
  const total = (s.timer && s.timer.total) || 1;
  const p = Math.max(0, Math.min(1, remain / total));
  const offset = finished ? 0 : RING_C * (1 - p);
  const nextNo = s.setIndex + 2;

  return '' +
    '<div class="rest-wrap fade-in">' +
      '<div class="rest-kicker"><span class="live"></span><span id="rest-kicker-text">' +
        (finished ? '休息结束 · 等待确认' : '休息中 · 第 ' + (s.setIndex + 1) + ' 组已完成') +
      '</span></div>' +
      '<div class="f12 mut" style="margin:-2px 0 2px">' + esc(ex.name) + ' · 目标 ' + repsLabel(ex) +
        (exMode(ex.exId) === 'quality' ? ' · 看 RPE' : ' · RIR ' + esc(ex.rir)) + '</div>' +
      '<div class="ring-wrap">' +
        '<svg viewBox="0 0 252 252">' +
          '<circle class="ring-track" cx="126" cy="126" r="118"/>' +
          '<circle class="ring-prog' + (finished ? ' finished' : '') + '" id="ring-prog" cx="126" cy="126" r="118" ' +
            'stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="ring-center' + (finished ? ' finished' : '') + '" id="ring-center">' +
          '<div class="time" id="ring-time">' + mmss(remain) + '</div>' +
          '<div class="cap" id="ring-cap">' + (s.timer && s.timer.state === 'paused' ? '已暂停' : finished ? '休息结束' : '组间休息') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="timer-controls' + (finished ? ' is-finished' : '') + '" id="timer-controls">' +
        '<button data-act="add-time" data-v="-15">−15 秒</button>' +
        '<button id="pause-btn" data-act="toggle-pause">' + (s.timer && s.timer.state === 'paused' ? icon('play') + ' 继续' : icon('pause') + ' 暂停') + '</button>' +
        '<button data-act="add-time" data-v="15">+15 秒</button>' +
        '<button data-act="add-time" data-v="30">+30 秒</button>' +
      '</div>' +
    '</div>' +
    renderLogCard(s, ex, st);
}

/* 记录区：按动作的记录模式切换字段
   reps    重量 + 次数 + RIR
   time    保持秒数 + RIR
   quality RPE 滑块 + 完成次数 */
function renderLogCard(s, ex, st) {
  const mode = exMode(ex.exId);
  const lib = LIB[ex.exId] || {};
  const side = lib.perSide ? '（每侧）' : '';

  if (mode === 'time') {
    return '<div class="log-card">' + logHead(s) +
      '<div class="log-grid two">' +
        fieldStepper('seconds', '保持秒数' + side, st.seconds != null ? st.seconds : '', '5', 'numeric') +
        fieldStepper('rir', 'RIR', st.rir != null ? st.rir : '', '1', 'numeric') +
      '</div>' +
      rirChips(st) +
      '<div class="f11 mut" style="margin-top:8px">这一组按「保持时长」记录：保持标准姿势到接近极限就停表，动作变形不算数。目标 ' + repsLabel(ex) + '。</div>' +
    '</div>';
  }

  if (mode === 'quality') {
    const rpe = st.rpe != null ? st.rpe : 8;
    return '<div class="log-card">' + logHead(s) +
      '<div class="rpe-wrap">' +
        '<div class="rpe-top"><span>动作质量 RPE（拖动即记录）</span><b id="rpe-out">' + (st.rpe != null ? st.rpe : '—') + '</b></div>' +
        '<input class="rpe-range" id="rpe-range" data-log-field="rpe" type="range" min="4" max="10" step="0.5" value="' + rpe + '">' +
        '<div class="rpe-scale"><span>4 轻松</span><span>7 吃力</span><span>10 极限</span></div>' +
      '</div>' +
      '<div class="log-grid two" style="margin-top:10px">' +
        fieldStepper('reps', '完成次数' + side, st.reps != null ? st.reps : '', '1', 'numeric') +
        '<div class="field"><label>说明</label><div class="ctrl" style="padding:0 12px">' +
          '<span class="f11 mut">腰椎不塌、骨盆不晃</span></div></div>' +
      '</div>' +
      '<div class="f11 mut" style="margin-top:8px">看质量不看重量：RPE 是主要指标，动作变形就停。</div>' +
    '</div>';
  }

  const u = unitLabel();
  return '<div class="log-card">' + logHead(s) +
    '<div class="log-grid">' +
      fieldStepper('weight', (isAssist(ex.exId) ? '辅助 (' : '重量 (') + u + ')', st.weight != null ? toUnit(Math.abs(st.weight)) : '', '2.5', 'decimal') +
      fieldStepper('reps', '次数', st.reps != null ? st.reps : '', '1', 'numeric') +
      fieldStepper('rir', 'RIR', st.rir != null ? st.rir : '', '1', 'numeric') +
    '</div>' +
    rirChips(st) +
    (isAssist(ex.exId) ? '<div class="f11 mut" style="margin-top:8px">辅助配重越小越难：PR 按「次数优先、辅助重量越低越好」统计。</div>' : '') +
  '</div>';
}

function logHead(s) {
  return '<div class="log-head">' +
    '<div class="t">记录本组 <span class="tag accent">第 ' + (s.setIndex + 1) + ' 组</span></div>' +
    '<div class="saved" id="saved-flash">' + icon('check') + '已自动保存</div>' +
  '</div>';
}
function rirChips(st) {
  return '<div class="rir-chips">' +
    [0, 1, 2, 3, 4, 5].map(v => '<button data-rir="' + v + '" class="' + (st.rir === v ? 'on' : '') + '">RIR ' + v + '</button>').join('') +
  '</div>';
}

function fieldStepper(key, label, val, step, mode) {
  return '<div class="field"><label>' + label + '</label>' +
    '<div class="ctrl">' +
      '<button data-step="' + key + '" data-dir="-1">−</button>' +
      '<input data-log-field="' + key + '" type="text" inputmode="' + mode + '" value="' + (val === '' ? '' : val) + '" placeholder="—">' +
      '<button data-step="' + key + '" data-dir="1">+</button>' +
    '</div></div>';
}

/* 动作间休息：有倒计时，也能补录本动作（含最后一组） */
function renderExerciseRest(s, ex) {
  const finished = s.phase === 'RestFinished';
  const remain = timerRemaining(s.timer);
  const total = (s.timer && s.timer.total) || 1;
  const p = Math.max(0, Math.min(1, remain / total));
  const offset = finished ? 0 : RING_C * (1 - p);
  const done = ex.sets.filter(st => st.status === 'completed');
  const vol = done.reduce((n, st) => n + ((st.weight || 0) * (st.reps || 0)), 0);
  const isLast = s.exIndex >= s.exercises.length - 1;
  const nextName = isLast ? '' : s.exercises[s.exIndex + 1].name;
  // 最后一组刚完成时还没有任何输入位置，直接在这里补记，避免「末组记不了」
  const lastIdx = ex.sets.length - 1;
  const lastSet = ex.sets[lastIdx];
  const needLog = s.setIndex === lastIdx && lastSet && lastSet.status === 'completed' && !setHasData(lastSet, ex.exId);

  return '' +
    '<div class="rest-wrap fade-in">' +
      '<div class="rest-kicker"><span class="live"></span><span id="rest-kicker-text">' +
        (finished ? '休息结束 · 可以开始下一动作' : '动作间休息' + (nextName ? ' · 接下来 ' + esc(nextName) : '')) +
      '</span></div>' +
      '<div class="f12 mut" style="margin:-2px 0 2px">' + esc(ex.name) + ' 已完成 ' + done.length + ' 组' +
        (vol > 0 ? ' · ' + Math.round(toUnit(vol)) + ' ' + unitLabel() + ' 总容量' : '') + '</div>' +
      '<div class="ring-wrap">' +
        '<svg viewBox="0 0 252 252">' +
          '<circle class="ring-track" cx="126" cy="126" r="118"/>' +
          '<circle class="ring-prog' + (finished ? ' finished' : '') + '" id="ring-prog" cx="126" cy="126" r="118" ' +
            'stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="ring-center' + (finished ? ' finished' : '') + '" id="ring-center">' +
          '<div class="time" id="ring-time">' + mmss(remain) + '</div>' +
          '<div class="cap" id="ring-cap">' + (s.timer && s.timer.state === 'paused' ? '已暂停' : finished ? '休息结束' : '换动作休息') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="timer-controls' + (finished ? ' is-finished' : '') + '" id="timer-controls">' +
        '<button data-act="add-time" data-v="-15">−15 秒</button>' +
        '<button id="pause-btn" data-act="toggle-pause">' + (s.timer && s.timer.state === 'paused' ? icon('play') + ' 继续' : icon('pause') + ' 暂停') + '</button>' +
        '<button data-act="add-time" data-v="15">+15 秒</button>' +
        '<button data-act="add-time" data-v="30">+30 秒</button>' +
      '</div>' +
    '</div>' +
    (needLog ? '<div class="f11 mut" style="margin:2px 0 6px;text-align:left">最后一组还没填数据，补上再走：</div>' +
      renderLogCard(s, ex, lastSet) : '') +
    '<div class="card flat rec-card"><div class="card-title"><h2>本动作记录</h2><span class="hint">点一组补录 / 修改</span></div>' +
      '<div class="rec-pills">' +
        ex.sets.map((st, i) => {
          const extraRir = exMode(ex.exId) === 'reps' && st.rir != null && st.rir !== '';
          return '<button class="rec-pill' + (st.status === 'completed' ? ' done' : '') + '" data-edit-set="' + i + '">' +
            '<i>' + (i + 1) + '</i>' +
            '<b>' + fmtSetValue(st, ex.exId) + '</b>' +
            (extraRir ? '<em>RIR ' + st.rir + '</em>' : '') +
          '</button>';
        }).join('') +
      '</div></div>';
}

function renderSummary(s) {
  const done = sessionDoneSets(s);
  const total = sessionSetCount(s);
  const start = s.realStart || new Date(s.startedAt).getTime();
  const end = s.endedAt ? new Date(s.endedAt).getTime() : Date.now();
  const mins = Math.max(1, Math.round((end - start) / 60000));
  const vol = sessionVolumeKg(s);
  const doneEx = s.exercises.filter(e => e.status === 'done').length;
  const skipped = s.exercises.filter(e => e.status === 'skipped').length;
  const prs = sessionPRs(s);
  const prev = prevSameDaySession(s);
  const nextDay = nextTrainingDay(s.date);

  return '' +
    '<div class="finish fade-in">' +
      '<div class="badge">' + icon('check') + '</div>' +
      '<h2>' + (s.status === 'aborted' ? '训练已结束' : '训练完成') + '</h2>' +
      '<p>' + fmtCN(s.date) + ' · ' + esc(s.dayName) + (s.status === 'aborted' ? ' · 未完成' : '') + '</p>' +
    '</div>' +
    '<div class="summary-grid">' +
      '<div><div class="v">' + mins + '</div><div class="k">分钟</div></div>' +
      '<div><div class="v">' + done + '<span class="f12 mut"> / ' + total + '</span></div><div class="k">完成组数</div></div>' +
      '<div><div class="v">' + (vol > 0 ? fmtVol(vol) : '—') + '</div><div class="k">总容量</div></div>' +
    '</div>' +
    (prs.length
      ? '<div class="pr-card fade-in"><div class="pr-head">' + icon('flame') + ' 新纪录</div>' +
        prs.map(pr => '<div class="pr-line"><span class="nm">' + esc(pr.name) + '</span>' +
          '<span class="v">' + esc(pr.text) + '<span class="old">上次最佳 ' + esc(pr.old) + '</span></span></div>').join('') +
        '</div>'
      : '') +
    (prev
      ? '<div class="cmp-note">' + icon('chart') + '<span>' + compareText(s, prev) + '</span></div>'
      : '') +
    '<div class="card flat"><div class="card-title"><h2>动作执行情况</h2>' +
      '<span class="hint">' + doneEx + ' 完成' + (skipped ? ' · ' + skipped + ' 跳过' : '') + '</span></div>' +
      '<div class="set-list">' +
        s.exercises.map((ex, i) =>
          '<div class="set-item">' +
            '<div class="no">' + (i + 1) + '</div>' +
            '<div class="w" style="font-weight:550">' + esc(ex.name) + '</div>' +
            '<div class="sp"></div>' +
            '<div class="r">' + ex.sets.filter(st => st.status === 'completed').length + '/' + ex.sets.length + ' 组</div>' +
            (ex.status === 'skipped' ? '<span class="tag danger">跳过</span>' : '') +
          '</div>'
        ).join('') +
      '</div>' +
    '</div>' +
    (s.status === 'aborted'
      ? '<div class="note warn">' + icon('info') + '<span>本次训练被提前结束，已完成的组已保存，未完成部分不会生成记录。</span></div>'
      : '<div class="note">' + icon('check') + '<span>已保存到本地。未填写的重量、次数可在「历史」中随时补录。' +
        (nextDay ? '下一次是' + nextDay.label + '的「' + esc(nextDay.name) + '」，今晚优先保证睡眠。' : '') +
        '</span></div>');
}

/* 与上一次同名训练日对比：优先比容量，其次比完成组数 */
function compareText(s, prev) {
  const v = sessionVolumeKg(s), pv = sessionVolumeKg(prev);
  const sets = sessionDoneSets(s), psets = sessionDoneSets(prev);
  const head = '上次' + esc(prev.dayName) + '（' + fmtShort(prev.date) + '）';
  if (v > 0 && pv > 0) {
    const diff = (v - pv) / pv * 100;
    if (Math.abs(diff) < 1) return head + '容量基本持平。想进步的话，下次主项先尝试多 1 次或加 2.5 kg。';
    return head + '相比，本次容量<b>' + (diff > 0 ? '多 ' : '少 ') + Math.abs(diff).toFixed(0) + '%</b>。' +
      (diff > 0 ? '稳步上升就好，下周不必再大幅加重量。' : '掉得多通常和睡眠、疲劳有关，先看恢复，不急着减重。');
  }
  if (sets !== psets) {
    return head + '相比，本次完成 <b>' + sets + ' 组</b>（上次 ' + psets + ' 组）。' +
      (sets > psets ? '完成度更高，保持这个节奏。' : '少了几组没关系，记录真实完成度比凑满表格重要。');
  }
  return head + '完成组数相同。填上重量和次数后，这里会直接告诉你容量差了多少。';
}

/* 下一个有训练内容的日期（用于完成页提示） */
function nextTrainingDay(fromDate) {
  const d = parseKey(fromDate);
  for (let i = 1; i <= 7; i++) {
    const nd = addDays(d, i);
    const dk = dayKeyOf(nd);
    const p = PLAN[dk];
    if (p && p.exercises.length) {
      return { date: dateKey(nd), name: p.name, label: i === 1 ? '明天' : WEEK_LABEL[dk] };
    }
  }
  return null;
}

/* ---------------- 状态迁移 ---------------- */
/* 动作间休息：换器械、调重量、走到下一台器械的时间，不短于 90 秒 */
function betweenExRest(ex) {
  return Math.max(90, ex.rest || 90);
}

function finishWarmup() {
  const s = WK.session;
  if (!s || s.phase !== 'Warmup') return;
  s.phase = 'SetActive';
  s.exIndex = 0;
  s.setIndex = 0;
  s.timer = null;
  saveDB(true);
  renderWorkout();
}

function finishStretch() {
  const s = WK.session;
  if (!s || s.phase !== 'Stretch') return;
  s.phase = 'WorkoutComplete';
  s.status = s.status === 'aborted' ? 'aborted' : 'completed';
  s.endedAt = new Date().toISOString();
  s.timer = null;
  stopTick();
  saveDB(true);
  renderWorkout();
}

function completeSet() {  const s = WK.session;
  if (!s || s.phase !== 'SetActive') return;
  primeAudio();
  const ex = currentEx(s);
  const st = ex.sets[s.setIndex];
  if (!st || st.status === 'completed') return;

  // ① 先持久化「组完成事件」，重量/次数/RIR 允许为空
  st.status = 'completed';
  st.completedAt = Date.now();
  st.dataComplete = setHasData(st, ex.exId);
  ex.status = 'active';

  const isLastSet = s.setIndex >= ex.sets.length - 1;
  // ② 任何一组完成后都启动倒计时：组内是组间休息，最后一组是动作间休息
  s.phase = 'Resting';
  if (isLastSet) {
    ex.status = 'done';
    s.restKind = 'exercise';
    startRestTimer(betweenExRest(ex));
  } else {
    s.restKind = 'set';
    startRestTimer(ex.rest);
  }
  saveDB(true);
  vibrate(35);
  renderWorkout();
  startTick();
}

function endRest() {
  const s = WK.session;
  if (!s || (s.phase !== 'Resting' && s.phase !== 'RestFinished')) return;
  stopTick();
  if (s.restKind === 'exercise') {
    // 动作间休息结束：进入下一动作，最后一个动作则完成训练
    s.timer = null;
    s.restKind = 'set';
    nextExercise();
    return;
  }
  s.timer = null;
  s.setIndex += 1;
  s.phase = 'SetActive';
  saveDB(true);
  vibrate(25);
  renderWorkout();
}

function togglePause() {
  const s = WK.session;
  if (!s || !s.timer) return;
  const t = s.timer;
  if (t.state === 'running') {
    t.pausedRemaining = timerRemaining(t);
    t.state = 'paused';
  } else if (t.state === 'paused') {
    t.endAt = Date.now() + (t.pausedRemaining || 0);
    t.state = 'running';
    WK.lastBeepSec = -1;
  }
  saveDB(true);
  syncTimerDom();
  syncRestButtons();
}

function addTime(sec) {
  const s = WK.session;
  if (!s || !s.timer) return;
  const t = s.timer;
  if (t.state === 'finished') {
    t.total = Math.max(t.total, 0) + sec * 1000;
    t.endAt = Date.now() + sec * 1000;
    t.state = 'running';
    s.phase = 'Resting';
    WK.lastBeepSec = -1;
    syncTimerDom();
    syncRestButtons();
    startTick();
  } else if (t.state === 'paused') {
    t.pausedRemaining = Math.max(0, (t.pausedRemaining || 0) + sec * 1000);
    t.total += sec * 1000;
    syncTimerDom();
  } else {
    t.endAt += sec * 1000;
    t.total = Math.max(t.total, timerRemaining(t));
    syncTimerDom();
  }
  saveDB(true);
}

function undoCompleteSet() {
  const s = WK.session;
  if (!s) return;
  const inRest = s.phase === 'Resting' || s.phase === 'RestFinished';
  const inDone = s.phase === 'ExerciseComplete';
  if (!inRest && !inDone) { toast('当前状态不可撤销'); return; }
  const ex = currentEx(s);
  const st = ex.sets[s.setIndex];
  if (!st || st.status !== 'completed') return;

  st.status = 'planned';
  st.completedAt = null;
  st.dataComplete = false;
  s.timer = null;
  s.phase = 'SetActive';
  s.restKind = 'set';
  if (ex.status === 'done') ex.status = 'active';
  stopTick();
  saveDB(true);
  vibrate(20);
  renderWorkout();
  toast('已撤销，回到第 ' + (s.setIndex + 1) + ' 组');
}

function nextExercise() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  if (ex && ex.status !== 'skipped') ex.status = 'done';
  if (s.exIndex >= s.exercises.length - 1) {
    s.phase = 'Stretch';
    s.timer = null;
    stopTick();
    saveDB(true);
    renderWorkout();
    return;
  }
  s.exIndex += 1;
  s.setIndex = 0;
  s.phase = 'SetActive';
  s.timer = null;
  s.restKind = 'set';
  stopTick();
  saveDB(true);
  renderWorkout();
}

function skipExercise() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  confirmDialog({
    title: '跳过「' + ex.name + '」？',
    desc: '未完成的组会记录为跳过状态，原计划仍保留在模板中。',
    confirmText: '跳过动作'
  }).then(ok => {
    if (!ok) return;
    ex.sets.forEach(st => { if (st.status !== 'completed') st.status = 'skipped'; });
    ex.status = 'skipped';
    s.timer = null;
    stopTick();
    if (s.exIndex >= s.exercises.length - 1) {
      s.phase = 'Stretch';
      s.timer = null;
      stopTick();
      saveDB(true);
      renderWorkout();
    } else {
      s.exIndex += 1;
      s.setIndex = 0;
      s.phase = 'SetActive';
      saveDB(true);
      renderWorkout();
    }
    toast('已跳过，可随时回到计划');
  });
}

function addExtraSet() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  const idx = ex.sets.length;
  ex.sets.push({
    idx, status: 'planned', weight: null, reps: null, rir: null,
    seconds: null, rpe: null,
    note: '', completedAt: null, extra: true, dataComplete: false
  });
  if (s.phase === 'ExerciseComplete' || s.restKind === 'exercise') {
    s.phase = 'SetActive';
    s.setIndex = idx;
    s.timer = null;
    s.restKind = 'set';
    ex.status = 'active';
    stopTick();
  }
  saveDB(true);
  renderWorkout();
  toast('已添加临时组（标记为额外组）');
}

/* 平替：只改本次训练的实际动作，计划模板不动 */
function applySwap(id) {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  const l = LIB[id];
  if (!l) return;
  ex.swappedFrom = ex.swappedFrom || ex.originalPlan;
  ex.exId = id;
  ex.name = l.name;
  ex.gear = l.gear;
  ex.group = l.group;
  if (l.mode === 'time' && ex.unit !== 'sec') { ex.unit = 'sec'; ex.reps = [20, 30]; }
  else if (l.mode !== 'time' && ex.unit === 'sec') { ex.unit = 'rep'; ex.reps = [8, 12]; }
  ex.note = ex.planNote ? ex.planNote + '｜平替后按新动作要领执行' : l.cues[0];
  saveDB(true);
}

/* 器械被占时的平替：先给同模式首选，再给出针对性建议 */
function openSwapSheet() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  const l = LIB[ex.exId] || {};
  const alts = (l.alt || []).filter(id => LIB[id] && id !== ex.exId);
  const rows = alts.map(id => {
    const a = LIB[id];
    return '<button data-swap="' + id + '"><div class="grow"><div class="nm">' + esc(a.name) + '</div>' +
      '<div class="sub">' + esc(a.gear) + ' · ' + esc(a.group) + '</div></div>' +
      '<span class="chev">' + icon('chev') + '</span></button>';
  }).join('');

  openSheet({
    title: '器械被占？换个平替',
    desc: '当前：' + ex.name + ' · 只改本次训练，计划模板不变',
    body:
      (l.swap ? '<div class="note" style="margin-bottom:12px">' + icon('info') + '<span>' + esc(l.swap) + '</span></div>' : '') +
      '<div class="section-label" style="margin-top:0">首选平替</div>' +
      '<div class="optlist">' + (rows || '<div class="empty">没有同模式平替，可以减重继续做，或跳过这个动作。</div>') + '</div>' +
      '<div class="f12 mut mt12">换器械后重量要重新找：同模式平替先从原重量的 70–80% 试一组，次数区间不变。</div>',
    actions: [{ label: '从全部动作里选', cls: 'ghost', onClick: () => { setTimeout(replaceExercise, 200); } }],
    onMount: (mask, close) => {
      mask.querySelectorAll('[data-swap]').forEach(b => {
        b.onclick = () => {
          const id = b.dataset.swap;
          applySwap(id);
          close();
          renderWorkout();
          toast('已平替为 ' + LIB[id].name);
        };
      });
    }
  });
}

/* 临时加一个动作到本次训练（不进计划模板） */
function addExerciseSheet() {
  const s = WK.session;
  if (!s) return;
  const groups = ['全部', '杠铃', '哑铃', '器械', '绳索', '自重'];
  let filter = '全部';
  let query = '';

  const listHtml = () => Object.keys(LIB).filter(id => {
    const l = LIB[id];
    if (l.archived) return false;
    if (filter !== '全部' && l.equip !== filter) return false;
    if (query && !(l.name + l.group + (l.gear || '')).toLowerCase().includes(query)) return false;
    return true;
  }).map(id => {
    const l = LIB[id];
    return '<button data-pick="' + id + '"><div class="grow"><div class="nm">' + esc(l.name) +
      (l.custom ? ' <span class="tag mute">自建</span>' : '') + '</div>' +
      '<div class="sub">' + esc(l.gear) + ' · ' + esc(l.group) + '</div></div>' +
      '<span class="chev">' + icon('plus') + '</span></button>';
  }).join('') || '<div class="empty">没有匹配的动作</div>';

  openSheet({
    title: '加一个动作到本次',
    desc: '只影响这次训练，计划模板不变。默认 3 组 × 8–12 次（计时类 2 组），加完可在计划里再调。',
    body:
      '<div class="searchbox" style="margin-bottom:10px">' + icon('search') +
        '<input class="input" id="add-q" placeholder="搜索动作"></div>' +
      '<div class="chiprow" style="margin-bottom:8px">' + groups.map(g =>
        '<button data-f="' + g + '" class="' + (filter === g ? 'on' : '') + '">' + g + '</button>').join('') + '</div>' +
      '<div class="optlist" id="add-list">' + listHtml() + '</div>',
    onMount: (mask, close) => {
      const list = mask.querySelector('#add-list');
      const repaint = () => {
        list.innerHTML = listHtml();
        list.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
          const id = b.dataset.pick;
          close();
          setTimeout(() => applyAddExercise(id), 120);
        });
      };
      mask.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
        filter = b.dataset.f;
        mask.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
        repaint();
      });
      const q = mask.querySelector('#add-q');
      q.oninput = () => { query = q.value.trim().toLowerCase(); repaint(); };
      repaint();
    }
  });
}

function applyAddExercise(id) {
  const s = WK.session;
  if (!s || !LIB[id]) return;
  s.exercises.push(makeExerciseFromPlan(defaultPlanEntry(id)));
  saveDB(true);
  renderWorkout();
  toast('已加入：' + LIB[id].name);
}

function replaceExercise() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  const groups = ['全部', '杠铃', '哑铃', '器械', '绳索', '自重'];
  let filter = '全部';

  const listHtml = () => Object.keys(LIB).filter(id => {
    const l = LIB[id];
    const matchG = filter === '全部' || l.equip === filter;
    return matchG && id !== ex.exId && !l.archived;
  }).map(id => {
    const l = LIB[id];
    return '<button data-pick="' + id + '"><div class="grow"><div class="nm">' + esc(l.name) +
      (l.custom ? ' <span class="tag mute">自建</span>' : '') + '</div>' +
      '<div class="sub">' + esc(l.gear) + ' · ' + esc(l.group) + '</div></div>' +
      '<span class="chev">' + icon('chev') + '</span></button>';
  }).join('') || '<div class="empty">没有可选动作</div>';

  openSheet({
    title: '替换动作',
    desc: '本次训练将记录替换后的实际动作，原计划模板不会改变。',
    body: '<div class="chiprow" id="rep-filters">' + groups.map(g =>
        '<button data-f="' + g + '" class="' + (filter === g ? 'on' : '') + '">' + g + '</button>').join('') +
      '</div><div class="optlist" id="rep-list" style="margin-top:10px">' + listHtml() + '</div>',
    onMount: (mask, close) => {
      const list = mask.querySelector('#rep-list');
      mask.querySelectorAll('[data-f]').forEach(btn => {
        btn.onclick = () => {
          filter = btn.dataset.f;
          mask.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b === btn));
          list.innerHTML = listHtml();
          bind();
        };
      });
      function bind() {
        list.querySelectorAll('[data-pick]').forEach(b => {
          b.onclick = () => {
            const id = b.dataset.pick;
            const l = LIB[id];
            applySwap(id);
            close();
            renderWorkout();
            toast('已替换为 ' + l.name);
          };
        });
      }
      bind();
    }
  });
}

function adjustRest() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  const opts = [60, 75, 90, 105, 120, 150, 180];
  openSheet({
    title: '本次组间休息',
    desc: '只影响本次训练，不改变计划模板。当前：' + mmss(ex.rest * 1000),
    body: '<div class="optlist">' + opts.map(v =>
      '<button data-rest="' + v + '"><div class="grow"><div class="nm">' + mmss(v * 1000) + '</div>' +
      '<div class="sub">' + (v === ex.rest ? '当前使用' : '设为该时长') + '</div></div>' +
      (v === ex.rest ? '<span class="tag accent">当前</span>' : '') + '</button>').join('') + '</div>',
    onMount: (mask, close) => {
      mask.querySelectorAll('[data-rest]').forEach(b => {
        b.onclick = () => {
          ex.rest = Number(b.dataset.rest);
          const t = s.timer;
          if (t && (s.phase === 'Resting' || s.phase === 'RestFinished')) {
            // 改动总时长时按「已过去的时间」重算剩余，避免倒计时突然跳到新总长
            const newTotal = ex.rest * 1000;
            if (t.state === 'running') {
              const elapsed = Math.max(0, (t.total || 0) - timerRemaining(t));
              t.total = newTotal;
              t.endAt = Date.now() + Math.max(1000, newTotal - elapsed);
              WK.lastBeepSec = -1;
            } else if (t.state === 'paused') {
              const elapsed = Math.max(0, (t.total || 0) - (t.pausedRemaining || 0));
              t.total = newTotal;
              t.pausedRemaining = Math.max(1000, newTotal - elapsed);
            } else {
              t.total = newTotal;
            }
          }
          saveDB(true);
          close();
          renderWorkout();
          toast('组间休息已设为 ' + mmss(ex.rest * 1000));
        };
      });
    }
  });
}

/* 训练中改任意一组：休息页只有当前组输入框，改旧组从这里进 */
function openSetList() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  if (!ex) return;
  const rows = ex.sets.map((st, i) =>
    '<button data-set="' + i + '"><div class="grow"><div class="nm">第 ' + (i + 1) + ' 组' +
      (st.status === 'completed' ? '' : st.status === 'skipped' ? ' · 未做' : ' · 未记录') + '</div>' +
      '<div class="sub">' + fmtSetValue(st, ex.exId) + '</div></div>' +
      '<span class="chev">' + icon('chev') + '</span></button>').join('');
  openSheet({
    title: '修改本动作的记录',
    desc: ex.name + ' · 共 ' + ex.sets.length + ' 组',
    body: '<div class="optlist">' + rows + '</div>',
    onMount: (mask, close) => {
      mask.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
        const i = Number(b.dataset.set);
        close();
        setTimeout(() => openSetEditor(s.id, s.exIndex, i), 200);
      });
    }
  });
}

function endWorkoutEarly() {
  const s = WK.session;
  if (!s) return;
  confirmDialog({
    title: '结束本次训练？',
    desc: '已完成的组会保存，本次训练标记为「未完成」。未记录的组不会生成虚假数据。',
    confirmText: '结束训练',
    danger: true
  }).then(ok => {
    if (!ok) return;
    s.status = 'aborted';
    s.endedAt = new Date().toISOString();
    s.timer = null;
    s.phase = s.phase === 'WorkoutComplete' ? s.phase : 'WorkoutComplete';
    stopTick();
    saveDB(true);
    renderWorkout();
  });
}

function openMenu() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  const items = [
    { label: '修改本动作的任意一组', sub: ex ? '改重量 / 次数 / 状态，或回到某一组' : '', act: () => openSetList() },
    { label: '调整本次组间休息', sub: '当前 ' + (ex ? mmss(ex.rest * 1000) : '—'), act: () => adjustRest() },
    { label: '查看动作说明', sub: ex ? ex.gear : '', act: () => showExerciseDetail(ex.exId, true) },
    { label: '加一个临时组', sub: '标记为额外组，不影响计划', act: () => addExtraSet() },
    { label: '加一个动作到本次', sub: '临时加练，不写进计划模板', act: () => addExerciseSheet() },
    { label: '平替当前动作', sub: '器械被占时换同模式动作，保留原模板', act: () => openSwapSheet() },
    { label: '从全部动作里替换', sub: '记录实际动作，保留原模板', act: () => replaceExercise() }
  ];
  if (s.phase === 'Resting' || s.phase === 'RestFinished' || s.phase === 'ExerciseComplete') {
    items.unshift({ label: '撤销完成本组', sub: '回到上一组训练状态', act: () => undoCompleteSet() });
  }
  openSheet({
    title: '训练选项',
    body: '<div class="optlist">' + items.map((it, i) =>
      '<button data-m="' + i + '"><div class="grow"><div class="nm">' + it.label + '</div>' +
      '<div class="sub">' + esc(it.sub) + '</div></div><span class="chev">' + icon('chev') + '</span></button>').join('') +
      '</div><div class="optlist" style="margin-top:6px"><button data-end="1"><div class="grow"><div class="nm" style="color:var(--danger)">结束本次训练</div>' +
      '<div class="sub">保存已完成组，标记为未完成</div></div></button></div>',
    onMount: (mask, close) => {
      mask.querySelectorAll('[data-m]').forEach(b => {
        b.onclick = () => { close(); setTimeout(() => items[Number(b.dataset.m)].act(), 180); };
      });
      mask.querySelector('[data-end]').onclick = () => { close(); setTimeout(endWorkoutEarly, 180); };
    }
  });
}

/* ---------------- 数据录入（自动保存，不影响计时） ---------------- */
function bindLogInputs() {
  const s = WK.session;
  if (!s) return;
  const ex = currentEx(s);
  if (!ex) return;
  const st = ex.sets[s.setIndex];
  if (!st) return;
  const mark = () => { st.dataComplete = setHasData(st, ex.exId); };

  $$('#workout-layer [data-log-field]').forEach(input => {
    const sync = () => {
      const f = input.dataset.logField;
      const v = input.value.trim();
      if (f === 'note') st.note = v;
      else if (f === 'weight') st.weight = v === '' ? null : fromUnit(v);
      else if (f === 'seconds') st.seconds = v === '' ? null : Math.max(0, Math.min(600, Math.round(Number(v) || 0)));
      else if (f === 'rpe') st.rpe = v === '' ? null : Math.max(0, Math.min(10, Number(v)));
      else if (f === 'rir') st.rir = v === '' ? null : Math.max(0, Math.min(10, Number(v) || 0));
      else st[f] = v === '' ? null : Math.max(0, Math.min(200, Number(v) || 0));
      mark();
      saveDB();
      flashSaved();
      if (f === 'rir') refreshRirChips();
      if (f === 'rpe') {
        const out = $('#rpe-out');
        if (out) out.textContent = st.rpe != null ? st.rpe : '—';
      }
    };
    input.addEventListener('input', sync);
    input.addEventListener('blur', () => {
      if (input.dataset.logField === 'weight' && st.weight != null) input.value = toUnit(Math.abs(st.weight));
    });
  });

  $$('#workout-layer [data-step]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.step;
      const dir = Number(btn.dataset.dir);
      const step = key === 'weight' ? (DB.settings.unit === 'lb' ? 5 : 2.5) : key === 'seconds' ? 5 : key === 'rpe' ? 0.5 : 1;
      let cur;
      if (key === 'weight') cur = st.weight != null ? toUnit(Math.abs(st.weight)) : 0;
      else cur = st[key] != null ? Number(st[key]) : (key === 'rir' ? 2 : key === 'rpe' ? 8 : 0);
      let next = Math.round((cur + dir * step) * 10) / 10;
      if (next < 0) next = 0;
      if (key === 'weight') st.weight = fromUnit(next);
      else if (key === 'reps') st.reps = Math.min(200, Math.round(next));
      else if (key === 'seconds') st.seconds = Math.min(600, Math.round(next));
      else if (key === 'rpe') st.rpe = Math.max(0, Math.min(10, next));
      else st.rir = Math.max(0, Math.min(10, Math.round(next)));
      mark();
      const input = $('#workout-layer [data-log-field="' + key + '"]');
      if (input) input.value = key === 'weight' ? next : st[key];
      const out = $('#rpe-out');
      if (out && key === 'rpe') out.textContent = st.rpe;
      saveDB();
      flashSaved();
      refreshRirChips();
      vibrate(12);
    });
  });

  $$('#workout-layer [data-rir]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = Number(btn.dataset.rir);
      st.rir = st.rir === v ? null : v;
      const input = $('#workout-layer [data-log-field="rir"]');
      if (input) input.value = st.rir == null ? '' : st.rir;
      mark();
      saveDB();
      flashSaved();
      refreshRirChips();
    });
  });
}

function refreshRirChips() {
  const s = WK.session; if (!s) return;
  const ex = currentEx(s); if (!ex) return;
  const st = ex.sets[s.setIndex]; if (!st) return;
  $$('#workout-layer [data-rir]').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.rir) === st.rir);
  });
}

let savedTimer = null;
function flashSaved() {
  const el = $('#saved-flash');
  if (!el) return;
  el.classList.add('on');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => el.classList.remove('on'), 1200);
}

/* ---------------- 事件委托 ---------------- */
(function bindWorkoutLayer() {
  const layer = $('#workout-layer');
  layer.addEventListener('click', e => {
    const editSet = e.target.closest('[data-edit-set]');
    if (editSet && WK.session) {
      openSetEditor(WK.session.id, WK.session.exIndex, Number(editSet.dataset.editSet));
      return;
    }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'close') closeWorkoutLayer();
    else if (act === 'warmup-done') finishWarmup();
    else if (act === 'stretch-done') finishStretch();
    else if (act === 'complete-set') completeSet();
    else if (act === 'end-rest') endRest();
    else if (act === 'toggle-pause') togglePause();
    else if (act === 'add-time') addTime(Number(btn.dataset.v));
    else if (act === 'undo-set') undoCompleteSet();
    else if (act === 'next-ex') nextExercise();
    else if (act === 'skip-ex') skipExercise();
    else if (act === 'add-set') addExtraSet();
    else if (act === 'replace-ex') replaceExercise();
    else if (act === 'swap-ex') openSwapSheet();
    else if (act === 'menu') openMenu();
    else if (act === 'back-home') {
      closeWorkoutLayer();
      if (typeof Nav !== 'undefined') Nav.go('home');
    }
  });
})();

/* 键盘快捷键（桌面端） */
document.addEventListener('keydown', e => {
  if (!WK.session || $('#workout-layer').classList.contains('hidden')) return;
  // 弹层/确认框打开时不响应，避免空格同时触发弹窗按钮和「完成本组」
  if (document.getElementById('sheet-root').children.length) return;
  const tg = e.target;
  if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) return;
  if (tg && tg.closest && tg.closest('button')) return;
  if (e.repeat) return;
  const s = WK.session;
  if (e.code === 'Space' || e.key === 'Enter') {
    e.preventDefault();
    if (s.phase === 'SetActive') completeSet();
    else if (s.phase === 'Resting' || s.phase === 'RestFinished') endRest();
    else if (s.phase === 'ExerciseComplete') nextExercise();
  }
  if (e.key === 'Escape') closeWorkoutLayer();
});

</script>
  <script>
/* ==========================================================
   页面渲染：今日 / 历史 / 数据 / 动作库 / 设置
   ========================================================== */

const UI = {
  tab: 'home',
  historyMonth: new Date(),
  selectedDate: todayKey(),
  statsWeeks: 8,
  liftTab: 'bench',
  libQuery: '',
  libEquip: '全部',
  libGroup: '全部'
};

/* ---------------- 通用 ---------------- */
function renderCurrentTab() {
  const view = $('#view');
  if (!view) return;
  const map = { home: renderHome, history: renderHistory, stats: renderStats, library: renderLibrary, settings: renderSettings };
  view.innerHTML = (map[UI.tab] || renderHome)();
  view.classList.remove('fade-in');
  void view.offsetWidth;
  view.classList.add('fade-in');
  afterRender();
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === UI.tab));
}

function afterRender() {
  if (UI.tab === 'home') bindHome();
  if (UI.tab === 'history') bindHistory();
  if (UI.tab === 'stats') bindStats();
  if (UI.tab === 'library') bindLibrary();
  if (UI.tab === 'settings') bindSettings();
}

function pageHeader(title, sub, rightHtml) {
  return '<div class="topbar"><div><div class="eyebrow">Training Log</div>' +
    '<h1>' + title + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') +
    '</div>' + (rightHtml || '') + '</div>';
}

/* ==========================================================
   今日
   ========================================================== */
function renderHome() {
  const today = todayKey();
  const dk = dayKeyOf(parseKey(today));
  const plan = PLAN[dk];
  const active = activeSession();
  const todayDone = sessionsOn(today).filter(s => s.status === 'completed');
  const isRest = plan.exercises.length === 0;
  const inProgressToday = todayDone.length === 0 && active && active.date === today;

  let hero = '';

  if (active && active.date === today) {
    const ex = currentEx(active);
    const doneSets = sessionDoneSets(active);
    const totalSets = sessionSetCount(active);
    let phaseText = '训练进行中';
    if (active.phase === 'Warmup') phaseText = '热身中 · 准备开始';
    if (active.phase === 'Resting') phaseText = '休息中 · 已完成第 ' + (active.setIndex + 1) + ' 组';
    if (active.phase === 'RestFinished') phaseText = '休息结束，等待开始下一组';
    if (active.phase === 'ExerciseComplete') phaseText = '动作完成，等待进入下一动作';
    if (active.phase === 'Stretch') phaseText = '正式动作完成 · 拉伸收尾';
    hero =
      '<div class="hero">' +
        '<div class="hero-top">' + icon('bolt') + ' ' + phaseText + '</div>' +
        '<h2>' + esc(active.dayName) + '<small>' + esc(active.focus) + '</small></h2>' +
        '<div class="focus">' + (ex ? '当前：' + esc(ex.name) + ' · 第 ' + (active.setIndex + 1) + ' / ' + ex.sets.length + ' 组' : '') + '</div>' +
        '<div class="hero-meta">' +
          '<span class="m"><b>' + doneSets + '</b> / ' + totalSets + ' 组</span>' +
          '<span class="m">已完成 <b>' + Math.round(doneSets / Math.max(1, totalSets) * 100) + '%</b></span>' +
        '</div>' +
        '<div style="margin-bottom:14px">' + '<div class="bar"><i style="width:' + (doneSets / Math.max(1, totalSets) * 100) + '%"></i></div>' + '</div>' +
        '<button class="btn primary block" data-go="resume">继续训练' + icon('play') + '</button>' +
      '</div>';
  } else if (todayDone.length) {
    const s = todayDone[0];
    const doneSets = sessionDoneSets(s);
    hero =
      '<div class="hero">' +
        '<div class="hero-top">' + icon('check') + ' 今日已完成</div>' +
        '<h2>' + esc(s.dayName) + '<small>' + esc(s.focus) + '</small></h2>' +
        '<div class="focus">' + doneSets + ' 组已记录 · 保持恢复，明天继续</div>' +
        '<div class="hero-meta">' +
          '<span class="m"><b>' + doneSets + '</b> 组</span>' +
          '<span class="m">时长 <b>' + sessionDurationMin(s) + '</b> 分钟</span>' +
        '</div>' +
        '<div style="display:flex;gap:10px">' +
          '<button class="btn" style="flex:1" data-go="history">查看记录</button>' +
          '<button class="btn ghost" style="flex:1" data-go="choose">再练一次</button>' +
        '</div>' +
      '</div>';
  } else if (isRest) {
    hero =
      '<div class="hero">' +
        '<div class="hero-top">' + icon('moon') + ' 恢复日</div>' +
        '<h2>休息<small>恢复日</small></h2>' +
        '<div class="focus">' + (DB.sessions.length
          ? '不安排力量训练与跑步。散步、轻柔活动度可选，为下一次训练留出恢复。'
          : '还没有任何训练记录。选一个训练日开始第一次，之后这里会显示你的完成情况。') + '</div>' +
        '<div class="rest-tips">' +
          '<div class="tip">' + icon('activity') + '散步 20–30 分钟，或轻松骑行，不出汗也行</div>' +
          '<div class="tip">' + icon('target') + '髋部、胸椎活动度各 5 分钟，不做负重拉伸</div>' +
          '<div class="tip">' + icon('moon') + '今晚睡够 7.5 小时，正常吃蛋白质</div>' +
        '</div>' +
        '<button class="btn block" data-go="choose">想加练？选其他训练日' + icon('chev') + '</button>' +
      '</div>';
  } else {
    const t = planTotals(plan);
    const hint = progressionHint(plan.exercises[0]);
    hero =
      '<div class="hero">' +
        '<div class="hero-top">' + icon('bolt') + ' 今日训练 · ' + WEEK_LABEL[dk] + '</div>' +
        '<h2>' + esc(plan.name) + '<small>' + esc(plan.focus) + '</small></h2>' +
        '<div class="focus">' + plan.exercises.length + ' 个动作，先从主项开始，动作质量优先于完成表格。</div>' +
        '<div class="hero-meta">' +
          '<span class="m"><b>' + plan.exercises.length + '</b> 个动作</span>' +
          '<span class="m"><b>' + t.sets + '</b> 工作组</span>' +
          '<span class="m">约 <b>' + t.minutes + '</b> 分钟</span>' +
        '</div>' +
        (hint ? '<div class="coach">' + icon('target') + '<span>' + hint + '</span></div>' : '') +
        '<button class="btn primary block" data-go="start" style="margin-top:16px">开始训练' + icon('play') + '</button>' +
      '</div>';
  }

  const strip = renderWeekStrip(today);
  const list = isRest ? '' : renderPlanPreview(plan, active);
  const runCard = plan.run ? '<div class="card"><div class="card-title"><h2>' + icon('activity') +
    ' 今日跑步</h2><span class="hint">独立于力量训练</span></div>' +
    '<div class="f13" style="font-weight:550">' + esc(plan.run.title) + '</div>' +
    '<div class="f12 mut mt8" style="line-height:1.6">' + esc(plan.run.detail) + '</div></div>' : '';

  const staleBanner = (active && active.date !== today)
    ? '<div class="card" style="border-color:rgba(0,0,0,.16);background:rgba(0,0,0,.04);padding:14px 16px">' +
        '<div class="flex between aic gap12">' +
          '<div class="grow"><div class="f13" style="font-weight:600">有一次未完成的训练</div>' +
            '<div class="f12 mut" style="margin-top:3px">' + fmtCN(active.date) + ' · ' + esc(active.dayName) +
            ' · 已完成 ' + sessionDoneSets(active) + ' 组</div></div>' +
          '<button class="btn sm" data-go="resume">继续</button>' +
          '<button class="btn sm ghost" data-discard="1">放弃</button>' +
        '</div>' +
      '</div>'
    : '';

  const quick =
    '<div class="quick-row">' +
      '<button data-quick="backfill">' + icon('calendar') + '补记训练</button>' +
      '<button data-quick="run">' + icon('activity') + '记录跑步</button>' +
      '<button data-quick="plan">' + icon('sliders') + '编辑计划</button>' +
    '</div>';

  return pageHeader('今天', fmtCN(today, true) + ' · ' + WEEK_LABEL[dk],
      '<button class="icon-btn" data-go="plan">' + icon('note') + '</button>') +
    staleBanner +
    hero +
    quick +
    renderBodyCard(today) +
    '<div class="card" style="padding:14px 14px 12px">' +
      '<div class="flex between aic" style="margin-bottom:4px">' +
        '<span class="f12 mut">本周安排</span>' +
        '<span class="f12 mut">已完成 ' + weekDoneSessions() + ' / 6</span>' +
      '</div>' + strip +
    '</div>' +
    list +
    runCard +
    renderRecent();
}

function weekDoneSessions() {
  const monday = startOfWeek(new Date());
  let n = 0;
  for (let i = 0; i < 7; i++) {
    const k = dateKey(addDays(monday, i));
    n += DB.sessions.filter(s => s.date === k && s.status === 'completed').length;
  }
  return n;
}

function renderWeekStrip(today) {
  const monday = startOfWeek(parseKey(today));
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const k = dateKey(d);
    const dk = WEEK_ORDER[i];
    const plan = PLAN[dk];
    const done = DB.sessions.some(s => s.date === k && s.status === 'completed');
    const isToday = k === today;
    let cls = 'wd';
    if (done) cls += ' done';
    if (isToday) cls += ' today';
    if (!plan.exercises.length) cls += ' rest';
    else if (!done && k < today && DB.sessions.length) cls += ' missed';
    html += '<button class="' + cls + '" data-week-day="' + k + '" aria-label="' + fmtCN(k) + '">' +
      '<div class="d">' + WEEK_LABEL[dk].replace('周', '') + '</div>' +
      '<div class="dot"></div>' +
      '<div class="t">' + d.getDate() + '</div>' +
    '</button>';
  }
  return '<div class="weekstrip">' + html + '</div>';
}

function renderPlanPreview(plan, active) {
  const rows = plan.exercises.map((ex, i) => {
    const lib = LIB[ex.exId];
    const inst = active && active.date === todayKey() ? active.exercises[i] : null;
    const done = inst ? inst.sets.filter(s => s.status === 'completed').length : 0;
    return '<div class="row ' + (inst && inst.status === 'done' ? 'done' : '') + '" data-ex-detail="' + ex.exId + '">' +
      '<div class="idx">' + (i + 1) + '</div>' +
      '<div class="grow"><div class="nm">' + esc(lib.name) + '</div>' +
        '<div class="meta">' + ex.sets + ' 组 × ' + repsLabel(ex) + ' · RIR ' + ex.rir + ' · 休息 ' + mmss(ex.rest * 1000) + '</div></div>' +
      '<div class="val">' + (done ? done + '/' + ex.sets : esc(lib.group)) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="card">' +
    '<div class="card-title"><h2>动作清单</h2><span class="hint">' + (plan.run ? '含跑步安排' : '力量训练') + '</span></div>' +
    rows + '</div>';
}

function renderRecent() {
  const list = DB.sessions
    .filter(s => s.status !== 'in_progress')
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 3);
  if (!list.length) return '';
  const rows = list.map(s => {
    const sets = sessionDoneSets(s);
    return '<div class="row" data-open-session="' + s.id + '">' +
      '<div class="idx">' + icon('check') + '</div>' +
      '<div class="grow"><div class="nm">' + esc(s.dayName) + ' · ' + sets + ' 组</div>' +
        '<div class="meta">' + fmtCN(s.date) + ' · ' + sessionDurationMin(s) + ' 分钟' + (s.status === 'aborted' ? ' · 未完成' : '') + '</div></div>' +
      '<div class="val">' + icon('chev') + '</div>' +
    '</div>';
  }).join('');
  return '<div class="section-label">最近训练</div><div class="card">' + rows + '</div>';
}

function sessionDurationMin(s) {
  // 补记的训练 startedAt 是当天 19:00，用真实开始时间算时长
  const start = s.realStart || new Date(s.startedAt).getTime();
  const end = s.endedAt ? new Date(s.endedAt).getTime() : Date.now();
  return Math.max(1, Math.round((end - start) / 60000));
}

/* ==========================================================
   体重 / 状态打卡（DB.body 与 DB.checkins 的录入入口）
   ========================================================== */
function bodyStatus(k) {
  const b = bodyOn(k) || {};
  const c = checkinOn(k) || {};
  const parts = [];
  if (b.weight != null) parts.push(b.weight + ' kg');
  if (b.waist != null) parts.push('腰围 ' + b.waist + ' cm');
  if (c.sleep != null) parts.push('睡眠 ' + c.sleep + ' h');
  if (c.fatigue != null) parts.push('疲劳 ' + c.fatigue + '/5');
  if (c.soreness) parts.push(c.soreness);
  return { has: parts.length > 0, text: parts.join(' · ') };
}

function renderBodyCard(k) {
  const st = bodyStatus(k);
  return '<div class="card" style="padding:13px 16px">' +
    '<div class="flex between aic gap12">' +
      '<div class="grow"><div class="f13" style="font-weight:600">' + (st.has ? '今天已打卡' : '体重 & 状态') + '</div>' +
        '<div class="f12 mut" style="margin-top:3px;line-height:1.5">' +
          (st.has ? esc(st.text) : '体重、腰围、睡眠与疲劳') + '</div></div>' +
      '<button class="btn sm" data-go="body">' + (st.has ? '修改' : '记录') + '</button>' +
    '</div>' +
  '</div>';
}

function bdField(id, label, val, mode, ph) {
  return '<div class="field"><label>' + label + '</label><div class="ctrl">' +
    '<input id="' + id + '" type="text" inputmode="' + (mode || 'decimal') + '" placeholder="' + (ph || '—') + '" value="' +
    (val == null ? '' : val) + '"></div></div>';
}

function openBodySheet(k) {
  const d = k || todayKey();
  const b = bodyOn(d) || {};
  const c = checkinOn(d) || {};
  let fatigue = c.fatigue != null ? c.fatigue : null;

  openSheet({
    title: '记录身体与状态',
    desc: fmtCN(d, true) + ' · 只记真实测量，没测就留空',
    body:
      '<div class="log-grid two">' +
        bdField('bd-w', '体重 (kg)', b.weight) +
        bdField('bd-waist', '腰围 (cm)', b.waist) +
        bdField('bd-sleep', '睡眠 (小时)', c.sleep) +
        bdField('bd-sore', '酸痛部位', c.soreness, 'text', '无 / 腿部轻微…') +
      '</div>' +
      '<div class="f11 mut" style="margin:12px 0 6px">疲劳程度（1 = 很轻松，5 = 很疲劳）</div>' +
      '<div class="chiprow" id="bd-fatigue">' +
        [1, 2, 3, 4, 5].map(v => '<button data-fatigue="' + v + '" class="' + (fatigue === v ? 'on' : '') + '">' + v + '</button>').join('') +
        '<button data-fatigue="0" class="' + (fatigue === null ? 'on' : '') + '">不记</button>' +
      '</div>' +
      '<div class="field wide" style="margin-top:10px"><label>备注</label><div class="ctrl">' +
        '<input id="bd-note" type="text" placeholder="睡眠质量、关节感受…" value="' + esc(c.note || '') + '"></div></div>' +
      '<div class="f11 mut mt12">体重建议固定在晨起、排空后测；腰围每两周一次即可。这些数据只用于趋势与复盘，不做评判。</div>',
    actions: [{
      label: '保存', cls: 'primary', onClick: () => {
        const w = $('#bd-w').value.trim();
        const waist = $('#bd-waist').value.trim();
        const sleep = $('#bd-sleep').value.trim();
        if (w === '' && waist === '' && sleep === '' && fatigue == null) {
          toast('至少填一项再保存');
          return false;
        }
        saveBody(d, {
          weight: w === '' ? null : Number(w),
          waist: waist === '' ? null : Number(waist)
        });
        saveCheckin(d, {
          sleep: sleep === '' ? null : Number(sleep),
          fatigue: fatigue,
          soreness: $('#bd-sore').value.trim(),
          note: $('#bd-note').value.trim()
        });
        setTimeout(() => { renderCurrentTab(); toast('已记录 ' + fmtCN(d)); }, 200);
      }
    }],
    onMount: (mask) => {
      mask.querySelectorAll('[data-fatigue]').forEach(btn => {
        btn.onclick = () => {
          const v = Number(btn.dataset.fatigue);
          fatigue = v === 0 ? null : v;
          mask.querySelectorAll('[data-fatigue]').forEach(x => x.classList.toggle('on', x === btn));
        };
      });
    }
  });
}

/* ---------------- 今日交互 ---------------- */
function bindHome() {
  $$('[data-go]').forEach(btn => {
    btn.addEventListener('click', () => {
      const go = btn.dataset.go;
      if (go === 'start') startWorkout(dayKeyOf(parseKey(todayKey())));
      else if (go === 'resume') { const a = activeSession(); if (a) openWorkout(a.id); }
      else if (go === 'choose') chooseDaySheet();
      else if (go === 'plan') showPlanOverview();
      else if (go === 'body') openBodySheet(todayKey());
      else if (go === 'history') { UI.tab = 'history'; UI.selectedDate = todayKey(); UI.historyMonth = new Date(); renderCurrentTab(); }
    });
  });
  const discard = $('[data-discard]');
  if (discard) discard.addEventListener('click', () => {
    confirmDialog({
      title: '放弃这次训练？', desc: '已完成的组会保留在历史中，训练标记为未完成。', confirmText: '放弃', danger: true
    }).then(ok => {
      if (!ok) return;
      const a = activeSession();
      if (a) { a.status = 'aborted'; a.endedAt = new Date().toISOString(); a.timer = null; saveDB(true); }
      renderCurrentTab();
      toast('已结束未完成的训练');
    });
  });

  $$('[data-open-session]').forEach(row => {
    row.addEventListener('click', () => { openSessionDetail(row.dataset.openSession); });
  });

  $$('[data-week-day]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.weekDay;
    UI.tab = 'history';
    UI.selectedDate = k;
    UI.historyMonth = parseKey(k);
    renderCurrentTab();
    window.scrollTo(0, 0);
  }));

  $$('[data-quick]').forEach(b => b.addEventListener('click', () => {
    const q = b.dataset.quick;
    if (q === 'backfill') openBackfillSheet(todayKey());
    else if (q === 'run') addRunSheet(todayKey());
    else if (q === 'plan') openPlanEditor();
  }));

  $$('[data-ex-detail]').forEach(row => row.addEventListener('click', () => {
    showExerciseDetail(row.dataset.exDetail);
  }));

}

function chooseDaySheet() {
  const rows = WEEK_ORDER.filter(k => PLAN[k].exercises.length).map(k => {
    const p = PLAN[k];
    const t = planTotals(p);
    return '<button data-day="' + k + '"><div class="grow">' +

  openSheet({
    title: '选择训练日',

    body: '<div class="optlist">' + rows + '</div>',

      mask.querySelectorAll('[data-day]').forEach(b => {
        b.onclick = () => {
          close();

function showPlanOverview() {
  const rows = WEEK_ORDER.map(k => {
    const p = PLAN[k];
    if (!p.exercises.length) {
      return '<div class="row"><div class="idx">' + icon('moon') + '</div><div class="grow"><div class="nm">' + WEEK_LABEL[k] + ' · 恢复日</div>' +

    return '<div class="row"><div class="idx">' + p.exercises.length + '</div><div class="grow"><div class="nm">' + WEEK_LABEL[k] + ' · ' + esc(p.name) + '</div>' +
      '<div class="meta">' + sets + ' 组 · ' + esc(p.focus) + (p.run ? ' · ' + esc(p.run.title) : '') + '</div></div></div>';

  const vol = VOLUME_TARGET.map(v =>
    '<div class="barline"><div class="top"><span class="g">' + v.group + '</span><span class="n">' + v.value + ' 组</span></div>' +
    '<div class="track"><i style="width:' + Math.min(100, v.value / 16 * 100) + '%"></i></div></div>').join('');

  openSheet({
