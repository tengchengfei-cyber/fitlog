/* ==========================================================
   训练日志 · 三分化六练  |  视觉系统
   ========================================================== */

:root {
  --bg: #f5f5f6;
  --bg-soft: #efeff0;
  --surface: #ffffff;
  --surface-2: #f3f3f4;
  --surface-3: #e8e8e9;
  --line: rgba(0, 0, 0, .075);
  --line-strong: rgba(0, 0, 0, .18);
  --text: #111111;
  --text-2: #5d5d5d;
  --muted: #8a8a8a;
  --accent: #111111;
  --accent-dim: rgba(0, 0, 0, .06);
  --accent-ink: #ffffff;
  --blue: #555555;
  --warn: #3f3f3f;
  --danger: #111111;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.025), 0 10px 26px -22px rgba(0,0,0,.22);
  --shadow-pop: 0 18px 44px -22px rgba(0,0,0,.32);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Noto Sans SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

svg { flex-shrink: 0; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

button, input, textarea, select {
  font: inherit; color: inherit;
}
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
input, textarea { border-radius: 0; }

::selection { background: var(--accent); color: var(--accent-ink); }

/* 背景光晕 */
.bg-orbs { display: none; }

/* ---------- 启动占位 / 加载失败提示 ---------- */
.boot {
  min-height: 70vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  text-align: center; padding: 40px 24px;
}
.boot-logo {
  width: 46px; height: 46px; border-radius: 15px;
  background: rgba(0,0,0,0.09);
  border: 1px solid rgba(0,0,0,0.165);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.boot-logo svg { width: 23px; height: 23px; }
.boot-txt { font-size: 13.5px; color: var(--text-2); }
.boot-hint {
  display: none;
  font-size: 12px; line-height: 1.7; color: var(--muted);
  max-width: 320px;
}
.boot-hint.on { display: block; }
.boot.err .boot-logo { background: rgba(0,0,0,0.066); border-color: rgba(0,0,0,0.138); color: var(--warn); }
.boot.err .boot-hint { color: var(--warn); }

@keyframes bootPulse {
  0%, 100% { opacity: .45; transform: scale(.96); }
  50% { opacity: 1; transform: scale(1); }
}
.boot:not(.err) .boot-logo { animation: bootPulse 1.6s ease-in-out infinite; }

/* ---------- 应用外壳 ---------- */
.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 18px calc(96px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

@media (min-width: 760px) {
  .app {
    max-width: 560px;
    padding-left: 24px;
    padding-right: 24px;
  }
  body::before {
    content: "";
    position: fixed; left: 50%; top: 0; bottom: 0;
    width: 560px; transform: translateX(-50%);
    border-left: 1px solid rgba(0, 0, 0, .04);
    border-right: 1px solid rgba(0, 0, 0, .04);
    pointer-events: none;
  }
}

/* ---------- 顶部 ---------- */
.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  padding: 26px 0 18px;
}
.topbar .eyebrow {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.topbar h1 {
  margin: 6px 0 0;
  font-size: 27px;
  letter-spacing: -.035em;
  font-weight: 680;
}
.topbar .sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}
.icon-btn {
  width: 42px; height: 42px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-2);
  transition: .18s;
}
.icon-btn:active { transform: scale(.94); background: var(--surface-2); }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 17px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.card.flat { background: var(--surface); }
.card-title {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  margin: 0 0 14px;
}
.card-title h2 {
  margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em;
}
.card-title .hint { font-size: 12px; color: var(--muted); }
.section-label {
  font-size: 12px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
  margin: 24px 2px 10px;
}

/* ---------- 首页 Hero ---------- */
.hero {
  position: relative;
  border-radius: 24px;
  padding: 22px;
  overflow: hidden;
  margin-bottom: 14px;
  background: linear-gradient(160deg, #1c1c1e, #0b0b0c 70%);
  border: 1px solid rgba(0,0,0,.6);
  box-shadow: 0 20px 40px -26px rgba(0,0,0,.65);
  --text: #ffffff;
  --text-2: rgba(255,255,255,.74);
  --muted: rgba(255,255,255,.52);
  --accent: #ffffff;
  --accent-dim: rgba(255,255,255,.16);
  --line: rgba(255,255,255,.16);
  color: var(--text);
}
.hero .hero-top { color: var(--muted); }
.hero .hero-meta .m {
  background: rgba(255,255,255,.09);
  border-color: rgba(255,255,255,.12);
  color: var(--text-2);
}
.hero .bar { background: rgba(255,255,255,.16); }
.hero .bar > i { background: #ffffff; }
.hero .btn {
  background: rgba(255,255,255,.10);
  border-color: rgba(255,255,255,.18);
  color: #ffffff;
}
.hero .btn.primary {
  background: #ffffff; color: #111111;
  border-color: transparent;
  box-shadow: none;
}
.hero .btn.ghost { background: transparent; }
.hero-top {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-2); font-weight: 600;
}
.hero-top svg { width: 14px; height: 14px; }
.card-title h2 svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; }
.row .idx svg { width: 13px; height: 13px; }
.hero h2 small { white-space: nowrap; }
.hero h2 {
  margin: 12px 0 2px;
  font-size: 32px; font-weight: 680; letter-spacing: -.04em;
  display: flex; align-items: baseline; gap: 10px;
}
.hero h2 small {
  font-size: 14px; font-weight: 500; letter-spacing: 0;
  color: var(--text-2);
}
.hero .focus { color: var(--text-2); font-size: 14px; margin-bottom: 16px; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
}
.hero-meta .m {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--text-2);
  background: rgba(0,0,0,.05);
  border: 1px solid rgba(0,0,0,.06);
  padding: 6px 11px; border-radius: 999px;
}
.hero-meta .m b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; padding: 0 20px;
  border-radius: 14px;
  font-weight: 600; font-size: 15px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line);
  transition: transform .15s, background .15s, opacity .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:active { transform: scale(.975); }
.btn.primary {
  background: var(--text); color: #fff;
  border-color: transparent;
  font-weight: 600;
  box-shadow: 0 8px 18px -10px rgba(0,0,0,.55);
}
.btn.primary:active { box-shadow: 0 3px 8px -6px rgba(0,0,0,.5); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 13px; border-radius: 12px; }
.btn:disabled { opacity: .45; }
.btn svg { width: 17px; height: 17px; }

/* 本周条 */
.weekstrip {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px; margin-top: 16px;
}
.wd {
  border-radius: 14px;
  padding: 9px 4px 8px;
  text-align: center;
  background: rgba(0,0,0,.03);
  border: 1px solid transparent;
  transition: .2s;
}
.wd .d { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
.wd .dot {
  width: 7px; height: 7px; border-radius: 50%;
  margin: 6px auto 0;
  background: rgba(0,0,0,.16);
}
.wd .t { font-size: 12px; font-weight: 600; margin-top: 3px; }
.wd.done { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.165); }
.wd.done .dot { background: var(--accent); box-shadow: 0 0 10px rgba(0,0,0,0.22); }
.wd.today { border-color: rgba(0,0,0,.22); background: rgba(0,0,0,.07); }
.wd.today .d { color: var(--text); }
.wd.rest .dot { background: rgba(0,0,0,.1); }
.wd.missed .dot { background: rgba(0,0,0,0.14); }

/* 列表行 */
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; padding-bottom: 2px; }
.row:first-of-type { padding-top: 2px; }
.row .idx {
  width: 26px; height: 26px; flex: 0 0 26px;
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11.5px; font-weight: 650;
  display: flex; align-items: center; justify-content: center;
  font-variant-numeric: tabular-nums;
}
.row .grow { flex: 1; min-width: 0; }
.row .nm { font-size: 14px; font-weight: 550; letter-spacing: -.01em; }
.row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .val {
  font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums;
  text-align: right; white-space: nowrap;
}
.row.done .nm { color: var(--text-2); }
.row.done .idx { background: var(--accent-dim); color: var(--accent); }

/* 徽标 */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 3px 8px; border-radius: 7px;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.tag.accent { background: var(--accent-dim); color: var(--accent); border-color: rgba(0,0,0,0.15); }
.tag.warn { background: rgba(0,0,0,0.066); color: var(--warn); border-color: rgba(0,0,0,0.11); }
.tag.danger { background: rgba(0,0,0,0.066); color: var(--danger); border-color: rgba(0,0,0,0.121); }
.tag.mute { color: var(--muted); }

/* 提示条 */
.note {
  display: flex; gap: 10px;
  font-size: 12.5px; color: var(--text-2);
  background: rgba(0,0,0,.03);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  line-height: 1.55;
}
.note svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 1px; color: var(--muted); }
.note.warn { background: rgba(0,0,0,0.039); border-color: rgba(0,0,0,0.099); color: #3a3a3a; }
.note.warn svg { color: var(--warn); }

/* 进度条 */
.bar { height: 6px; border-radius: 99px; background: rgba(0,0,0,.08); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }

/* 空状态 */
.empty {
  text-align: center; padding: 30px 18px; color: var(--muted); font-size: 13px;
}
.empty svg { width: 28px; height: 28px; margin-bottom: 8px; opacity: .4; }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  width: 100%; max-width: 540px;
  z-index: 30;
  padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .88);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  gap: 4px;
}
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 2px 6px;
  border-radius: 14px;
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: .02em;
  transition: .18s;
}
.tab svg { width: 21px; height: 21px; stroke-width: 1.7; }
.tab.active { color: var(--accent); background: rgba(0,0,0,.045); }
.tab.active svg { stroke-width: 2.1; }
.tab:active { background: rgba(0,0,0,.04); }

/* ---------- 训练执行层 ---------- */
.workout-layer {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.workout-layer.hidden { display: none; }
.wk-scroll {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px 10px;
  max-width: 540px; margin: 0 auto; width: 100%;
}
.wk-scroll > * { flex-shrink: 0; }
.wk-scroll > .note { margin-top: auto; }
.wk-scroll.center-content { justify-content: center; }
.wk-scroll.center-content > .note { margin-top: 18px; }
.wk-head {
  max-width: 540px; margin: 0 auto; width: 100%;
  padding: calc(14px + env(safe-area-inset-top)) 20px 12px;
  display: flex; align-items: center; gap: 12px;
}
.wk-head .grow { flex: 1; text-align: center; }
.wk-head .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.wk-head .v { font-size: 14px; font-weight: 600; margin-top: 2px; }
.wk-head .icon-btn { background: rgba(0,0,0,.05); border-color: transparent; }

.setdots { display: flex; gap: 6px; margin: 4px 0 18px; }
.setdots i {
  flex: 1; height: 4px; border-radius: 99px;
  background: rgba(0,0,0,.1);
  transition: .3s;
}
.setdots i.done { background: var(--accent); }
.setdots i.cur { background: rgba(0,0,0,0.22); }
.setdots i.extra { background: var(--blue); }

/* 当前动作卡 */
.ex-card {
  border-radius: 26px;
  padding: 20px;
  background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.015)), var(--surface);
  border: 1px solid var(--line);
  margin-bottom: 16px;
}
.ex-card .exname {
  font-size: 26px; font-weight: 720; letter-spacing: -.03em; line-height: 1.2;
  margin: 6px 0 8px;
}
.ex-card .gear { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ex-specs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin-top: 18px;
  background: var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.ex-specs > div {
  background: var(--surface);
  padding: 11px 10px;
  text-align: center;
}
.ex-specs .k { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }
.ex-specs .v {
  font-size: 16px; font-weight: 650; margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.ex-cue {
  margin-top: 16px; font-size: 12.5px; color: var(--text-2);
  line-height: 1.6;
  padding-left: 11px; border-left: 2px solid rgba(0,0,0,0.22);
}
.lastrec {
  margin-top: 14px; font-size: 12px; color: var(--muted);
  display: flex; gap: 6px; align-items: flex-start;
}
.lastrec b { color: var(--text-2); font-weight: 600; }

/* 大组号 */
.setbig {
  text-align: center;
  padding: 6px 0 14px;
  flex: 1;
  display: flex; flex-direction: column; justify-content: center;
}
.setbig .n {
  font-size: 66px; font-weight: 750; line-height: 1;
  letter-spacing: -.05em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; justify-content: center; gap: 4px;
}
.setbig .n small { font-size: 18px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.prev-sets {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  margin-top: 14px; padding: 0 8px;
}
.queue { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 15px; }
.qhead {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px; font-weight: 600;
}
.qrow {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; font-size: 13px; color: var(--text-2);
}
.qrow .n {
  width: 18px; height: 18px; flex: 0 0 18px; border-radius: 6px;
  background: rgba(0,0,0,.05); color: var(--muted);
  font-size: 9.5px; display: flex; align-items: center; justify-content: center;
}
.qrow em { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.setbig .label {
  margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: .16em; text-transform: uppercase;
}

.wk-foot {
  position: relative;
  padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(245,245,246,0), var(--bg) 34%);
  max-width: 540px; margin: 0 auto; width: 100%;
  flex-shrink: 0;
}
.wk-foot .btn { width: 100%; height: 58px; font-size: 16px; border-radius: 18px; }
.wk-sub {
  display: flex; justify-content: center; gap: 8px; margin-top: 10px;
}
.wk-sub button {
  font-size: 12.5px; color: var(--muted);
  padding: 8px 12px; border-radius: 10px;
  border: 1px solid transparent;
}
.wk-sub button:active { background: rgba(0,0,0,.05); }

/* 休息 */
.rest-wrap { text-align: center; padding-top: 4px; }
.rest-kicker {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.rest-kicker .live {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 0 rgba(0,0,0,0.22);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.22); }
  70% { box-shadow: 0 0 0 9px rgba(0,0,0,0.0); }
  100% { box-shadow: 0 0 0 0 rgba(0,0,0,0.0); }
}
.ring-wrap {
  position: relative;
  width: 176px; height: 176px;
  margin: 2px auto 0;
}
.ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring-track { fill: none; stroke: rgba(0,0,0,.06); stroke-width: 4; }
.ring-prog {
  fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round;
  transition: stroke-dashoffset .3s linear;
}
.ring-prog.finished { stroke: #ffffff; }
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-center .time {
  font-family: var(--mono);
  font-size: 40px; font-weight: 550; letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
}
.ring-center .cap {
  font-size: 11.5px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
  margin-top: 2px;
}
.ring-center.paused .time { color: var(--warn); }
.ring-center.finished .time { color: var(--text); animation: restDone 1.6s ease-in-out infinite; }
@keyframes restDone {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}
.timer-controls.is-finished [data-act="toggle-pause"],
.timer-controls.is-finished [data-v="-15"] { display: none; }

.timer-controls {
  display: flex; justify-content: center; gap: 6px; margin: 2px 0 10px;
  flex-wrap: nowrap;
}
.timer-controls button {
  height: 36px; padding: 0 11px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 550; color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  white-space: nowrap;
  transition: .15s;
}
.timer-controls button:active { transform: scale(.96); }
.timer-controls button svg { width: 15px; height: 15px; }

/* 记录上一组 */
.log-card {
  border-radius: 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 14px 16px;
  text-align: left;
  margin-bottom: 14px;
}
.log-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.log-head .t { font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.log-head .saved {
  font-size: 11px; color: var(--accent); opacity: 0;
  transition: opacity .3s;
  display: inline-flex; align-items: center; gap: 4px;
}
.log-head .saved.on { opacity: 1; }
.log-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px;
}
.field label {
  display: block; font-size: 10.5px; color: var(--muted);
  letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px;
}
.field .ctrl {
  display: flex; align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  height: 44px;
}
.field .ctrl input {
  flex: 1; min-width: 0; width: 100%;
  background: transparent; border: 0; outline: none;
  text-align: center;
  font-size: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 0;
}
.field .ctrl button {
  width: 28px; height: 100%;
  color: var(--muted); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 28px;
}
.field .ctrl button:active { background: rgba(0,0,0,.06); color: var(--text); }
.field .ctrl input::placeholder { color: rgba(0,0,0,.22); font-weight: 500; }
.field.wide { grid-column: span 3; margin-top: 9px; }
.field.wide .ctrl { height: 40px; }
.field.wide input { text-align: left; padding: 0 12px; font-size: 16px; font-weight: 500; }
.rir-chips { display: flex; gap: 5px; margin-top: 8px; }
.rir-chips button {
  flex: 1; height: 26px; border-radius: 7px;
  font-size: 10.5px; color: var(--muted); white-space: nowrap; padding: 0 2px;
  background: rgba(0,0,0,.04); border: 1px solid transparent;
}
.rir-chips button.on { background: var(--accent-dim); color: var(--accent); border-color: rgba(0,0,0,0.188); }

/* 两种字段布局 / RPE 滑杆 */
.log-grid.two { grid-template-columns: 1fr 1fr; }
.rpe-wrap { padding: 2px 2px 0; }
.rpe-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.rpe-top span { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.rpe-top b { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rpe-range {
  width: 100%; height: 30px; margin: 0;
  accent-color: var(--accent);
  background: transparent;
}
.rpe-scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: -2px; }
.field .ctrl input[type="date"] { text-align: left; padding: 0 10px; font-size: 15px; font-weight: 500; }

/* 打卡记录行 */
.ck-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 2px; text-align: left;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--text-2);
}
.ck-row:last-child { border-bottom: 0; }
.ck-row .d { width: 44px; flex: 0 0 44px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ck-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ck-row .chev { color: var(--muted); display: inline-flex; }
.ck-row .chev svg { width: 14px; height: 14px; }

/* 完成动作 / 完成训练 */
.finish { text-align: center; padding: 30px 0 10px; }
.finish .badge {
  width: 74px; height: 74px; border-radius: 24px;
  background: var(--accent-dim);
  border: 1px solid rgba(0,0,0,0.21);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px;
  color: var(--accent);
}
.finish .badge svg { width: 34px; height: 34px; }
.finish h2 { font-size: 27px; margin: 0 0 6px; letter-spacing: -.03em; }
.finish p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
.summary-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-bottom: 22px;
}
.summary-grid > div {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 8px;
}
.summary-grid .v { font-size: 24px; font-weight: 720; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.summary-grid .k { font-size: 11px; color: var(--muted); margin-top: 3px; }

.setpills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.setpills .pill {
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  background: rgba(0,0,0,.04);
  border: 1px solid var(--line);
  border-radius: 9px; padding: 4px 8px;
  font-size: 11.5px; color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.setpills .pill i {
  width: 14px; height: 14px; border-radius: 4px;
  background: rgba(0,0,0,.07); color: var(--muted);
  font-size: 9px; font-style: normal;
  display: flex; align-items: center; justify-content: center;
}
.setpills .pill em { color: var(--muted); font-style: normal; }
.setpills .pill:active { background: rgba(0,0,0,0.075); border-color: rgba(0,0,0,0.188); }
.set-list { text-align: left; }
.set-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.set-item:last-child { border-bottom: 0; }
.set-item .no {
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--surface-2); color: var(--muted);
  font-size: 11px; display: flex; align-items: center; justify-content: center;
  font-variant-numeric: tabular-nums;
}
.set-item .w { font-weight: 600; font-variant-numeric: tabular-nums; }
.set-item .r { color: var(--text-2); font-variant-numeric: tabular-nums; }
.set-item .sp { flex: 1; }
.set-item .miss { font-size: 11px; color: var(--warn); }
button.set-item.editable {
  width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line);
  color: var(--text); font: inherit; text-align: left; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button.set-item.editable:last-child { border-bottom: 0; }
button.set-item.editable:active { background: rgba(0,0,0,0.05); }
button.set-item.editable .miss { color: var(--text-2); }

/* 休息页的紧凑记录胶囊 */
.rec-card { padding: 14px 16px 15px; }
.rec-card .card-title { margin-bottom: 10px; }
.rec-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.rec-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px 6px 6px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: none; color: var(--text); font: inherit; font-size: 12.5px;
  font-variant-numeric: tabular-nums; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.rec-pill i {
  width: 20px; height: 20px; border-radius: 999px; background: rgba(0,0,0,.08);
  color: var(--muted); font-style: normal; font-size: 10.5px;
  display: flex; align-items: center; justify-content: center;
}
.rec-pill b { font-weight: 600; }
.rec-pill span { color: var(--text-2); }
.rec-pill em { font-style: normal; font-size: 10.5px; color: var(--muted); }
.rec-pill.done i { background: var(--text); color: #fff; }
.rec-pill:active { background: rgba(0,0,0,.06); }

/* ---------- 弹层 ---------- */
.sheet-mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0, 0, 0, .42);
  backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .22s;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-mask.on { opacity: 1; }
.sheet {
  width: 100%; max-width: 540px;
  background: #ffffff;
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--line-strong);
  box-shadow: 0 -18px 44px -20px rgba(0,0,0,.35);
  padding: 10px 20px 0;
  max-height: 86vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  transform: translateY(24px);
  transition: transform .26s cubic-bezier(.2,.8,.3,1);
}
.sheet-mask.on .sheet { transform: translateY(0); }
.sheet-grab {
  width: 38px; height: 4px; border-radius: 99px;
  background: rgba(0,0,0,.16);
  margin: 4px auto 14px;
}
.sheet h3 {
  margin: 0 0 4px; font-size: 19px; letter-spacing: -.02em;
}
.sheet .desc { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
               padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
.sheet.has-actions .sheet-body { padding-bottom: 14px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 10px; flex: none;
                 border-top: 1px solid var(--line);
                 padding: 10px 0 calc(22px + env(safe-area-inset-bottom)); }
.sheet-actions .btn { flex: 1; height: 48px; }
.sheet-actions .btn.danger { background: rgba(0,0,0,0.066); color: var(--danger); border-color: rgba(0,0,0,0.138); }

/* 选项列表 */
.optlist { display: flex; flex-direction: column; gap: 2px; }
.optlist button {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 12px; border-radius: 13px;
  text-align: left; width: 100%;
  transition: .15s;
}
.optlist button:active { background: rgba(0,0,0,.05); }
.optlist .nm { font-size: 14px; font-weight: 550; }
.optlist .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.optlist .chev { margin-left: auto; color: var(--muted); }
.optlist button.on { background: var(--accent-dim); }
.optlist button.on .nm { color: var(--accent); }

/* 确认框 */
.dialog {
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 22px; padding: 22px;
  width: calc(100% - 48px); max-width: 360px;
  margin: auto;
  transform: scale(.96); opacity: 0;
  transition: .2s;
}
.sheet-mask.on .dialog { transform: scale(1); opacity: 1; }
.dialog h3 { font-size: 17px; margin: 0 0 6px; }
.dialog p { font-size: 13px; color: var(--muted); margin: 0 0 20px; line-height: 1.6; }
.dialog .sheet-actions { margin-top: 0; }

/* Toast */
#toast-root {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 90; pointer-events: none;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  width: 100%; max-width: 400px;
}
.toast {
  background: rgba(255,255,255,.98);
  border: 1px solid rgba(0,0,0,.14);
  color: var(--text);
  padding: 11px 18px; border-radius: 13px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 12px 32px -12px rgba(0,0,0,.28);
  animation: toastIn .25s ease;
  max-width: 90%;
}
.toast.dark { border-color: var(--line-strong); background: rgba(250,250,250,.98); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px) scale(.97); }
  to { opacity: 1; transform: none; }
}

/* ---------- 分段控件 ---------- */
.segmented {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 3px;
  gap: 2px;
}
.segmented button {
  padding: 6px 13px; border-radius: 9px;
  font-size: 12.5px; color: var(--muted); font-weight: 550;
  transition: .18s;
}
.segmented button.on { background: var(--surface-3); color: var(--text); }
.segmented.block { display: flex; width: 100%; }
.segmented.block button { flex: 1; text-align: center; padding: 7px 2px; font-size: 12px; }

/* ---------- 输入 ---------- */
.input {
  width: 100%; height: 46px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 0 14px;
  outline: none;
  font-size: 16px;
  transition: border-color .2s;
}
.input:focus { border-color: rgba(0,0,0,0.22); }
.input::placeholder { color: rgba(0,0,0,.2); }
textarea.input { height: auto; padding: 12px 14px; resize: vertical; min-height: 74px; }
.searchbox { position: relative; }
.searchbox svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 17px; height: 17px; color: var(--muted);
}
.searchbox .input { padding-left: 42px; }

.chiprow {
  display: flex; gap: 7px; overflow-x: auto;
  padding: 2px 0 4px;
  scrollbar-width: none;
}
.chiprow::-webkit-scrollbar { display: none; }
.chiprow {
  -webkit-mask-image: linear-gradient(90deg, #000 90%, rgba(0,0,0,.15) 100%);
  mask-image: linear-gradient(90deg, #000 90%, rgba(0,0,0,.15) 100%);
}
.chiprow button {
  flex: 0 0 auto;
  height: 32px; padding: 0 13px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--text-2);
  transition: .15s;
}
.chiprow button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }

/* ---------- 历史 / 日历 ---------- */
.cal-head .icon-btn.prev svg { transform: rotate(180deg); }
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.cal-head .m { font-size: 15px; font-weight: 650; }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
}
.cal-grid .wd-name {
  text-align: center; font-size: 10.5px; color: var(--muted);
  padding: 4px 0 8px; letter-spacing: .04em;
}
.cal-d {
  aspect-ratio: 1 / 1.06;
  border-radius: 11px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  font-size: 12.5px;
  color: var(--text-2);
  position: relative;
  transition: .15s;
  font-variant-numeric: tabular-nums;
}
.cal-d.out { opacity: .22; }
.cal-d .mk {
  width: 4px; height: 4px; border-radius: 50%; background: transparent;
}
.cal-d.done { background: rgba(0,0,0,0.075); color: var(--accent); font-weight: 600; }
.cal-d.done .mk { background: var(--accent); }
.cal-d.run { color: var(--blue); }
.cal-d.run .mk { background: var(--blue); }
.cal-d.today { box-shadow: inset 0 0 0 1px rgba(0,0,0,.28); }
.cal-d.sel { background: rgba(0,0,0,.1); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
.cal-d.miss .mk { background: rgba(0,0,0,0.14); }

/* ---------- 动作库 ---------- */
.lib-item {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
  width: 100%; text-align: left;
}
.lib-item:last-child { border-bottom: 0; }
.lib-thumb {
  width: 44px; height: 44px; flex: 0 0 44px;
  border-radius: 13px;
  background: linear-gradient(150deg, rgba(0,0,0,0.105), rgba(0,0,0,.03));
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: rgba(0,0,0,0.22);
}
.lib-thumb svg { width: 20px; height: 20px; }
.lib-item .nm { font-size: 14px; font-weight: 550; }
.lib-item .mt { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.lib-item .chev { color: rgba(0,0,0,.2); }

/* 动作详情 */
.detail-hero {
  background: linear-gradient(150deg, rgba(0,0,0,0.09), rgba(0,0,0,.02));
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 20px; padding: 18px;
  margin-bottom: 16px;
}
.detail-hero h3 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
.cue-list { margin: 0; padding: 0; list-style: none; }
.cue-list li {
  display: flex; gap: 10px; font-size: 13px; color: var(--text-2);
  line-height: 1.65; padding: 8px 0;
}
.cue-list li .n {
  width: 18px; height: 18px; flex: 0 0 18px; border-radius: 6px;
  background: var(--surface-2); color: var(--muted);
  font-size: 10px; display: flex; align-items: center; justify-content: center;
  margin-top: 2px;
}
.alt-chips { display: flex; flex-wrap: wrap; gap: 7px; }

/* 自建动作表单 */
.chiprow.wrap {
  flex-wrap: wrap; overflow: visible;
  -webkit-mask-image: none; mask-image: none;
  row-gap: 6px;
}
.ex-field { margin-bottom: 14px; }
.ex-field > label {
  display: block; font-size: 11.5px; color: var(--muted);
  letter-spacing: .02em; margin-bottom: 7px;
}
.ex-field .input { height: 44px; font-size: 15px; }
.ex-field textarea.input { min-height: 92px; font-size: 14px; line-height: 1.65; }
.ex-field .chiprow { padding-bottom: 0; }
.ex-field .chiprow button { height: 31px; font-size: 12px; }
.ex-field .chiprow button:disabled { opacity: .35; }
.lib-item .nm .tag { font-size: 10px; padding: 1px 6px; font-weight: 500; }

/* ---------- 统计 ---------- */
.stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin-bottom: 14px;
}
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 15px 16px;
}
.stat .k { font-size: 11.5px; color: var(--muted); letter-spacing: .03em; }
.stat .v {
  font-size: 25px; font-weight: 700; letter-spacing: -.03em; margin-top: 5px;
  font-variant-numeric: tabular-nums;
}
.stat .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.stat .d { font-size: 11.5px; margin-top: 4px; color: var(--muted); }
.stat .d.up { color: var(--accent); }
.stat .d.down { color: var(--warn); }

.chart-box { margin-top: 4px; }
.chart-box svg { width: 100%; height: auto; display: block; overflow: visible; }
.legend {
  display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px;
}
.legend span {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--muted);
}
.legend i { width: 8px; height: 8px; border-radius: 3px; }

.review-item {
  display: flex; gap: 11px; padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.review-item:last-child { border-bottom: 0; }
.review-item .no {
  width: 20px; height: 20px; flex: 0 0 20px; border-radius: 7px;
  background: var(--accent-dim); color: var(--accent);
  font-size: 10.5px; font-weight: 650;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px;
}

/* ---------------- 细分肌群与主练/辅助肌群 ----------------
   训练量统计仍使用 group（粗分类，保证历史数据可比较）；
   primaryMuscles / secondaryMuscles 用于动作详情、筛选和训练复盘。 */
const MUSCLE_GROUPS = [
  { region: '胸', items: ['胸大肌上束', '胸大肌中束', '胸大肌下束'] },
  { region: '背', items: ['背阔肌', '大圆肌', '斜方肌上束', '斜方肌中束', '斜方肌下束', '菱形肌', '竖脊肌'] },
  { region: '肩', items: ['三角肌前束', '三角肌中束', '三角肌后束'] },
  { region: '手臂', items: ['肱二头肌长头', '肱二头肌短头', '肱肌', '肱桡肌', '肱三头肌长头', '肱三头肌外侧头', '肱三头肌内侧头', '前臂'] },
  { region: '下肢', items: ['臀大肌', '臀中肌', '臀小肌', '股四头肌', '腘绳肌', '内收肌', '腓肠肌', '比目鱼肌'] },
  { region: '核心', items: ['腹直肌', '腹斜肌', '腹横肌', '髂腰肌'] }
];
const MUSCLE_FLAT = MUSCLE_GROUPS.reduce((a, g) => a.concat(g.items), []);
const MAIN_LIFT_LABELS = { bench: '卧推', squat: '深蹲', rdl: '硬拉', latpull: '高位下拉' };
const TAG_TO_MUSCLE = {
  '胸': '胸大肌中束', '上胸': '胸大肌上束', '背': '背阔肌', '背阔肌': '背阔肌', '背厚度': '菱形肌',
  '菱形肌': '菱形肌', '上背': '斜方肌中束', '斜方肌': '斜方肌上束', '竖脊肌': '竖脊肌',
  '肩': '三角肌前束', '肩前束': '三角肌前束', '肩中束': '三角肌中束', '后束': '三角肌后束', '三角肌后束': '三角肌后束',
  '肱二头肌': '肱二头肌长头', '长头': '肱三头肌长头', '肱三头肌': '肱三头肌外侧头',
  '臀': '臀大肌', '臀中肌': '臀中肌', '股四头肌': '股四头肌', '腘绳肌': '腘绳肌', '小腿': '腓肠肌', '比目鱼肌': '比目鱼肌',
  '核心': '腹直肌', '抗伸展': '腹横肌', '抗旋转': '腹斜肌', '动态屈曲': '腹直肌', '前臂': '前臂', '平衡': ''
};
function inferMuscleMeta(ex) {
  const name = ex.name || '';
  const tags = Array.isArray(ex.tags) ? ex.tags : [];
  let primary = [];
  if (tagged('上胸') || /上斜|上胸/.test(name)) primary = ['胸大肌上束'];
  else if (/下斜/.test(name)) primary = ['胸大肌下束'];
  else if (ex.group === '胸') primary = ['胸大肌中束'];
  else if (ex.group === '背') {
    primary = ['背阔肌'];
    if (/划船|T 杠|T杠/.test(name)) primary.push('菱形肌');
  } else if (ex.group === '肩') {
    if (/侧平举/.test(name)) primary = ['三角肌中束'];
    else if (/反向飞鸟|面拉|后束/.test(name)) primary = ['三角肌后束'];
    else if (/推举|推肩/.test(name)) primary = ['三角肌前束', '三角肌中束'];
    else primary = ['三角肌前束'];
  } else if (ex.group === '肱二头肌') primary = ['肱二头肌长头', '肱二头肌短头'];
  else if (ex.group === '肱三头肌') {
    primary = ['肱三头肌外侧头'];
    if (/过顶|长头/.test(name)) primary = ['肱三头肌长头'];
  } else if (ex.group === '股四头肌') primary = ['股四头肌'];
  else if (ex.group === '腘绳肌') primary = ['腘绳肌'];
  else if (ex.group === '臀') primary = tagged('臀中肌') ? ['臀中肌'] : ['臀大肌'];
  else if (ex.group === '核心') {
    primary = [(/抗旋转/.test(tags.join(' ')) ? '腹斜肌' : '腹直肌')];
    if (/抗伸展|死虫/.test(name + tags.join(' '))) primary.push('腹横肌');
    if (/山羊|竖脊/.test(name + tags.join(' '))) primary = ['竖脊肌'];
  } else if (ex.group === '小腿') {
    primary = /坐姿/.test(name) ? ['比目鱼肌'] : ['腓肠肌', '比目鱼肌'];
  } else if (ex.group === '其他') {
    primary = [];
  } else {
    primary = [ex.group];
  }
  const secondary = [];
  tags.forEach(t => {
    const m = TAG_TO_MUSCLE[t];
    if (m && primary.indexOf(m) < 0 && secondary.indexOf(m) < 0) secondary.push(m);
  });
  if (!primary.length) primary = ['腹直肌'];
  return { primaryMuscles: primary, secondaryMuscles: secondary };

  function tagged(t) { return tags.indexOf(t) >= 0; }
}

  <script>
/* ==========================================================

const DB_KEY = 'ft_v12_db';

const pad2 = n => String(n).padStart(2, '0');

function dateKey(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parseKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) {
  const x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  return x;
}
function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const wd = (x.getDay() + 6) % 7; // 周一 = 0
  return addDays(x, -wd);
}
function dayKeyOf(d) {

}
function todayKey() {
  return dateKey(new Date());
}
function fmtCN(k, withYear) {

}

function uid(prefix) {

/* ---------------- 导入/旧数据清洗 ----------------
   本地备份或导入文件都来自用户可编辑的文件，不能直接 Object.assign 到 DB：
   1) 去掉 __proto__/constructor/prototype 等原型污染键；
   2) 只接受已知的数组/对象结构，避免畸形数据把页面打崩；
   3) 字段长度/数值做上限，防止超长字符串或 NaN 影响渲染。 */
const UNSAFE_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
const SAFE_ID_RE = /^[A-Za-z0-9_-]{1,80}$/;
function safeId(v, prefix) {
  const s = String(v == null ? '' : v);
  return SAFE_ID_RE.test(s) ? s : uid(prefix || 'id');
}
function validDateKey(v) {
  const s = String(v == null ? '' : v);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : todayKey();
}
function safeClone(value, depth) {
  const level = depth || 0;
  if (level > 20) return null;
  if (value === null || typeof value !== 'object') {
    return (typeof value === 'string' && value.length > 20000) ? value.slice(0, 20000) : value;
  }
  if (Array.isArray(value)) return value.slice(0, 5000).map(v => safeClone(v, level + 1));
  const out = {};
  Object.keys(value).forEach(k => {
    if (UNSAFE_KEYS.has(k)) return;
    out[k] = safeClone(value[k], level + 1);
  });
  return out;
}
function safeString(v, max) {
  return typeof v === 'string' ? v.slice(0, max || 200) : '';
}
function clampNumber(v, min, max, fallback) {
  const n = Number(v);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}
function sanitizeSettings(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};
  return {
    unit: s.unit === 'lb' ? 'lb' : 'kg',
    sound: s.sound !== false,
    vibrate: s.vibrate !== false,
    countdownBeep: s.countdownBeep !== false,
    notify: s.notify === true,
    notifyAsked: s.notifyAsked === true,
    firstName: safeString(s.firstName, 20)

}
function sanitizePlanExercise(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const exId = safeString(raw.exId, 80);
  if (!SAFE_ID_RE.test(exId)) return null;
  const reps = Array.isArray(raw.reps) && raw.reps.length >= 2
    ? [clampNumber(raw.reps[0], 0, 600, 8), clampNumber(raw.reps[1], 0, 600, 12)]
    : [8, 12];
  return Object.assign({}, raw, {
    exId,
    sets: Math.round(clampNumber(raw.sets, 0, 20, 3)),
    reps,
    rest: Math.round(clampNumber(raw.rest, 0, 600, 120)),
    unit: raw.unit === 'sec' ? 'sec' : 'rep'

}
function sanitizePlanDay(raw, fallback) {
  const base = fallback || { name: '恢复日', focus: '恢复', exercises: [] };
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.exercises)) {
    return { name: base.name, focus: base.focus, warmup: base.warmup || '', stretch: base.stretch || '', exercises: base.exercises.map(e => Object.assign({}, e, { reps: e.reps.slice() })) };
  }
  return {
    name: safeString(raw.name, 40) || base.name,
    focus: safeString(raw.focus, 40) || base.focus,
    warmup: safeString(raw.warmup, 2000) || base.warmup || '',
    stretch: safeString(raw.stretch, 2000) || base.stretch || '',
    exercises: raw.exercises.map(sanitizePlanExercise).filter(Boolean).slice(0, 50)

}
function normalizeSession(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const exercises = Array.isArray(raw.exercises)
    ? raw.exercises.filter(e => e && typeof e === 'object' && Array.isArray(e.sets)).map(e => Object.assign({}, e, {
        exId: SAFE_ID_RE.test(safeString(e.exId, 80)) ? safeString(e.exId, 80) : '',
        name: safeString(e.name, 60),
        sets: e.sets.filter(st => st && typeof st === 'object').slice(0, 50).map((st, i) => Object.assign({}, st, {
          idx: Math.round(clampNumber(st.idx, 0, 100, i))
        }))
      })).filter(e => e.exId).slice(0, 80)
    : [];
  return Object.assign({}, raw, {
    id: safeId(raw.id, 's'),
    date: validDateKey(raw.date),
    dayName: safeString(raw.dayName, 40),
    focus: safeString(raw.focus, 40),

}
function normalizeDB(raw) {
  const clean = safeClone(raw) || {};
  const out = emptyDB();
  out.version = 1;
  out.sessions = Array.isArray(clean.sessions) ? clean.sessions.map(normalizeSession).filter(Boolean).slice(0, 5000) : [];
  out.runs = Array.isArray(clean.runs) ? clean.runs.filter(x => x && typeof x === 'object').map(x => Object.assign({}, x, {

    date: validDateKey(x.date)
  })).slice(0, 5000) : [];
  out.customEx = Array.isArray(clean.customEx) ? clean.customEx.filter(x => x && SAFE_ID_RE.test(safeString(x.id, 80)) && x.name).slice(0, 500) : [];
  out.settings = sanitizeSettings(clean.settings);
  out.updatedAt = typeof clean.updatedAt === 'string' ? clean.updatedAt : null;
  out.planVer = Number.isFinite(Number(clean.planVer)) ? Number(clean.planVer) : PLAN_VERSION;
  out.planUpdated = clean.planUpdated !== false;
  if (clean.plan && typeof clean.plan === 'object') {
    const plan = {};
    WEEK_ORDER.forEach(k => { plan[k] = sanitizePlanDay(clean.plan[k], PLAN_DEFAULT[k]); });
    out.plan = plan;
  }
  return out;
}
function importDBFromBackup(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.sessions)) throw new Error('格式不符');
  return normalizeDB(raw);
}

/* ---------------- 自定义动作 ----------------
   存放在 DB.customEx，启动时合并进 LIB。
   页面、计划编辑器、平替与训练都只读 LIB，所以自建动作与内置动作行为一致。

const EX_GROUPS = ['背', '胸', '肩', '股四头肌', '腘绳肌', '臀', '核心', '肱二头肌', '肱三头肌', '小腿', '其他'];
const EX_EQUIPS = ['杠铃', '哑铃', '器械', '绳索', '自重'];

const EQUIP_LOAD = { '杠铃': 'barbell', '哑铃': 'dumbbell', '器械': 'machine', '绳索': 'cable', '自重': 'body' };

function customExList() {

/* 把 DB.customEx 写进运行时 LIB；重复调用是幂等的 */
function registerCustomExercises() {
  customExList().forEach(ex => {
    if (!ex || !ex.id || !ex.name) return;
    const id = safeString(ex.id, 80);
    const name = safeString(ex.name, 40);
    if (!SAFE_ID_RE.test(id) || !name) return;
    const equip = EX_EQUIPS.indexOf(ex.equip) >= 0 ? ex.equip : '器械';

      .map(c => safeString(c, 300))
      .slice(0, 20);
    const alt = (Array.isArray(ex.alt) ? ex.alt : [])
      .filter(a => typeof a === 'string' && SAFE_ID_RE.test(a))
      .slice(0, 20);
    const cleanMuscles = arr => (Array.isArray(arr) ? arr : [])
      .filter(m => typeof m === 'string' && MUSCLE_FLAT.indexOf(m) >= 0)
      .slice(0, 12);
    const primaryMuscles = cleanMuscles(ex.primaryMuscles);
    const secondaryMuscles = cleanMuscles(ex.secondaryMuscles).filter(m => primaryMuscles.indexOf(m) < 0);
    LIB[id] = {
      name,
      group: safeString(ex.group, 20) || '其他',
      tags: [safeString(ex.group, 20) || '其他'],

function saveCustomExercise(data) {

/* 同一天只保留一条 body 记录：避免体重和腰围分成两条，图表出现重复日期 */
function saveBody(date, vals) {
  vals = vals || {};
  const list = DB.body.filter(b => b.date === date);
  let rec = list[0];
  if (!rec) {
    rec = { id: uid('bw'), date: date, weight: null, waist: null };
    DB.body.push(rec);
  }
  if ('weight' in vals) rec.weight = vals.weight == null || vals.weight === '' ? null : Number(vals.weight);
  if ('waist' in vals) rec.waist = vals.waist == null || vals.waist === '' ? null : Number(vals.waist);
  // 清掉同一天的重复条目
  DB.body = DB.body.filter(b => b === rec || b.date !== date);
  if (rec.weight == null && rec.waist == null) DB.body = DB.body.filter(b => b !== rec);
  DB.body.sort((a, b) => (a.date < b.date ? -1 : 1));
  saveDB(true);
  return rec;
}
function bodyOn(date) {
  return DB.body.find(b => b.date === date) || null;
}
function saveCheckin(date, vals) {
  vals = vals || {};
  const empty = vals.sleep == null && vals.fatigue == null && !vals.soreness && !vals.note;
  let rec = checkinOn(date);
  if (empty) {
    if (rec) DB.checkins = DB.checkins.filter(c => c !== rec);
    saveDB(true);
    return null;
  }
  if (!rec) {
    rec = { id: uid('ck'), date: date, sleep: null, fatigue: null, soreness: '', note: '' };
    DB.checkins.push(rec);
  }
  Object.keys(vals).forEach(k => { rec[k] = vals[k]; });
  DB.checkins.sort((a, b) => (a.date < b.date ? -1 : 1));
  saveDB(true);
  return rec;
}

function recentCheckins(n) {
  const dates = {};
  DB.checkins.forEach(c => { dates[c.date] = true; });
  DB.body.forEach(b => { dates[b.date] = true; });
  return Object.keys(dates).sort((a, b) => (a < b ? 1 : -1)).slice(0, n || 7)
    .map(date => Object.assign({ date: date }, checkinOn(date) || {}));
}

/* 改训练记录日期：周统计、日历、复盘都按日期归档 */
function moveSessionDate(id, newDate) {

  if (!s || !newDate) return false;
  const clash = DB.sessions.some(x => x !== s && x.date === newDate && x.status === 'in_progress');
  if (clash) return false;
  s.date = newDate;
  saveDB(true);
  return true;
}

function lastRecord(exId, beforeDate) {

    .filter(s => s.date < beforeDate && (s.status === 'completed' || s.status === 'aborted'))
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  for (const s of list) {
    for (const ex of s.exercises) {
      if (ex.exId === exId && ex.sets.some(st => st.status === 'completed')) {
        const sets = ex.sets.filter(st => st.status === 'completed');
        return { date: s.date, sets };
      }
    }
  }
  return null;
}

/* 某动作的历史最好工作组
   普通负重：重量优先；自重：次数优先；辅助器械：次数优先、辅助重量越低越好；
   计时类：保持时长优先；质量类：RPE 优先 */
function exMode(exId) {
  const l = LIB[exId];
  return (l && l.mode) || 'reps';
}
function isAssist(exId) {
  return !!(LIB[exId] && LIB[exId].assist);
}
function setHasData(st, exId) {
  if (!st) return false;
  const m = exMode(exId);
  if (m === 'time') return st.seconds != null && st.seconds !== '';
  if (m === 'quality') return (st.rpe != null && st.rpe !== '') || (st.reps != null && st.reps !== '');
  return st.reps != null && st.reps !== '';
}
/* PR 比较用的负荷分：杠铃类按 Epley 估算 1RM（重量 × (1 + 次数/30)），
   避免「102.5 kg × 5」压过「100 kg × 6」这种实际强度更低的一组。
   辅助引体按次数优先、辅助越低越好；计时看秒数；质量看 RPE。 */
function prScore(st, exId) {
  if (isAssist(exId)) return (Number(st.reps) || 0) * 1000 - (Number(st.weight) || 0);
  const m = exMode(exId);
  if (m === 'time') return (Number(st.seconds) || 0) * 100;
  if (m === 'quality') return (Number(st.rpe) || 0) * 100 + (Number(st.reps) || 0);
  const w = Number(st.weight) || 0;
  const r = Number(st.reps) || 0;
  if (w <= 0) return r;
  return w * (1 + r / 30);
}
function setScoreNum(st, exId) {
  const m = exMode(exId);
  if (isAssist(exId)) return (Number(st.reps) || 0) * 1000 - (Number(st.weight) || 0);
  if (m === 'time') return (Number(st.seconds) || 0) * 100 + (Number(st.rir) || 0);
  if (m === 'quality') return (Number(st.rpe) || 0) * 100 + (Number(st.reps) || 0);
  const w = Number(st.weight) || 0;
  const r = Number(st.reps) || 0;
  return w > 0 ? w * 1000 + r : r;
}
/* 一组的可读写法：105 kg × 5 / 辅助 25 kg × 8 / 24 秒 / RPE 8 · 10 次 */
function fmtSetValue(st, exId) {
  if (!st) return '—';
  const m = exMode(exId);
  if (isAssist(exId)) {
    const r = st.reps != null ? st.reps + ' 次' : '—';
    return (st.weight != null && Number(st.weight) !== 0 ? '辅助 ' + fmtW(Math.abs(st.weight)) + ' × ' : '') + r;
  }
  if (m === 'time') {
    return (st.seconds != null ? st.seconds + ' 秒' : '—') + (st.rir != null ? ' @RIR ' + st.rir : '');
  }
  if (m === 'quality') {
    return (st.rpe != null ? 'RPE ' + st.rpe : '—') + (st.reps != null ? ' · ' + st.reps + ' 次' : '');
  }
  if (st.weight != null && st.weight !== '') return fmtW(st.weight) + ' × ' + (st.reps != null ? st.reps : '—');
  if (st.reps != null) return st.reps + ' 次';
  return '—';
}
/* 计划里的目标写法：8–10 次 / 20–30 秒 */
function repsLabel(ex) {
  if (!ex || !ex.reps) return '—';
  return repRange(ex.reps) + (ex.unit === 'sec' ? ' 秒' : ' 次');
}
/* 引体技术组等服务性组不计入肌群训练量 */
function countsVolume(ex) {
  return !!ex && !ex.tech;
}

function exercisePR(exId) {
  let best = null;
  for (const s of DB.sessions) {
    if (s.status === 'in_progress') continue;
    for (const ex of s.exercises) {
      if (ex.exId !== exId) continue;
      for (const st of ex.sets) {
        if (st.status !== 'completed' || !setHasData(st, exId)) continue;
        const score = prScore(st, exId);
        if (!best || score > best.score) {
          best = {
            score: score, weight: st.weight, reps: st.reps, rir: st.rir,
            seconds: st.seconds, rpe: st.rpe, date: s.date,
            text: fmtSetValue(st, exId)
          };
        }
      }
    }
  }
  return best;
}

/* ---------------- 渐进超负荷建议 ----------------
   只依据上一次同动作的真实记录，规则保守：
   次数到上限且有余力 → 加重量；没到上限 → 先加次数；计时类加秒数。 */
function progressionHint(ex) {
  if (!ex || !ex.exId || !ex.reps) return null;
  const last = lastRecord(ex.exId, '9999-12-31');
  if (!last) return null;
  const sets = last.sets.filter(st => st.status === 'completed' && setHasData(st, ex.exId));
  if (!sets.length) return null;
  const top = sets.reduce((a, b) => setScoreNum(b, ex.exId) > setScoreNum(a, ex.exId) ? b : a);
  const hi = ex.reps[1], lo = ex.reps[0];
  const reps = Number(top.reps) || 0;
  const rir = top.rir != null ? Number(top.rir) : null;
  const w = top.weight != null ? Math.abs(Number(top.weight)) : 0;
  const mode = exMode(ex.exId);

  if (mode === 'time') {
    const sec = Number(top.seconds) || 0;
    if (!sec) return null;
    const next = sec >= hi ? sec + 5 : Math.min(hi, sec + 5);
    return '上次 ' + sec + ' 秒，这次目标 <b>' + next + ' 秒</b>；先保证躯干不晃，再延长时间。';
  }
  if (mode === 'quality') {
    return '上次 RPE ' + (top.rpe != null ? top.rpe : '—') + (reps ? ' · ' + reps + ' 次' : '') +
      '。这类动作看质量：动作一变形就停，不用凑次数。';
  }
  if (isAssist(ex.exId)) {
    if (reps >= hi) {
      const nw = Math.max(0, w - 2.5);
      return '上次辅助 ' + fmtW(w) + ' 做满 ' + reps + ' 次，这次把辅助降到 <b>' + fmtW(nw) + '</b>，次数回到 ' + lo + '–' + hi + ' 也正常。';
    }
    return '上次辅助 ' + fmtW(w) + ' × ' + reps + ' 次，这次辅助不变，目标 <b>' + Math.min(hi, reps + 1) + ' 次</b>；到上限再降辅助。';
  }
  if (w > 0) {
    if (reps >= hi && (rir == null || rir >= 1)) {
      return '上次 ' + fmtW(w) + ' × ' + reps + ' 已到上限，这次加到 <b>' + fmtW(w + 2.5) + '</b>，从 ' + lo + ' 次开始；做不到就退回原重量。';
    }
    return '上次 ' + fmtW(w) + ' × ' + reps + ' 次，这次重量不变，目标 <b>' + Math.min(hi, reps + 1) + ' 次</b>；做满 ' + hi + ' 次再加 2.5 kg。';
  }
  if (reps >= hi) return '上次自重已做满 ' + reps + ' 次，可以换更难的变式或加负重；今天先把幅度做满。';
  return '上次自重 ' + reps + ' 次，这次目标 <b>' + Math.min(hi, reps + 1) + ' 次</b>，不借力。';
}

/* ---------------- 训练容量 / 新纪录 / 与上次对比 ---------------- */
function sessionVolumeKg(s) {
  let v = 0;
  s.exercises.forEach(ex => ex.sets.forEach(st => {
    if (st.status === 'completed' && st.weight && st.reps) v += Math.abs(st.weight) * st.reps;
  }));
  return v;
}
function fmtVol(kg) {
  const v = Number(toUnit(kg)) || 0;
  if (DB.settings.unit === 'kg' && v >= 1000) return (v / 1000).toFixed(1) + ' t';
  return Math.round(v) + ' ' + unitLabel();
}

/* 本次训练中刷新历史最佳的动作（不含「第一次做」） */
function sessionPRs(s) {
  const out = [];
  s.exercises.forEach(ex => {
    const done = ex.sets.filter(st => st.status === 'completed' && setHasData(st, ex.exId));
    if (!done.length) return;
    const best = done.reduce((a, b) => prScore(b, ex.exId) > prScore(a, ex.exId) ? b : a);
    const score = prScore(best, ex.exId);
    let prev = null;
    DB.sessions.forEach(o => {
      if (o.id === s.id || o.status === 'in_progress') return;
      o.exercises.forEach(e2 => {
        if (e2.exId !== ex.exId) return;
        e2.sets.forEach(st => {
          if (st.status !== 'completed' || !setHasData(st, ex.exId)) return;
          const sc = prScore(st, ex.exId);
          if (!prev || sc > prev.score) prev = { score: sc, text: fmtSetValue(st, ex.exId) };
        });
      });
    });
    if (prev && score > prev.score) {
      out.push({ name: ex.name, text: fmtSetValue(best, ex.exId), old: prev.text });
    }
  });
  return out;
}

function prevSameDaySession(s) {
  return DB.sessions
    .filter(o => o.id !== s.id && o.dayKey === s.dayKey && o.status !== 'in_progress' && o.date < s.date)
    .sort((a, b) => (a.date < b.date ? 1 : -1))[0] || null;
}

/* 单位换算（内部统一 kg） */
function toUnit(kg) {
  if (kg == null || kg === '') return '';
  const v = DB.settings.unit === 'lb' ? kg * 2.20462 : kg;
  return Math.round(v * 10) / 10;
}
function fromUnit(v) {
  if (v === '' || v == null) return null;
  const n = Number(v);
  if (isNaN(n)) return null;
  return DB.settings.unit === 'lb' ? Math.round((n / 2.20462) * 10) / 10 : n;
}
function unitLabel() { return DB.settings.unit === 'lb' ? 'lb' : 'kg'; }

function fmtW(kg) {
  if (kg == null || kg === '') return '—';
  const v = toUnit(kg);
  return v + ' ' + unitLabel();
}

/* ---------------- 计划工具 ---------------- */
function planFor(key) { return PLAN[key]; }

/* ---------------- 可编辑计划 ---------------- */
function defaultPlanData() {
  const o = {};
  WEEK_ORDER.forEach(k => {
    o[k] = {
      name: PLAN_DEFAULT[k].name,
      focus: PLAN_DEFAULT[k].focus,
      warmup: PLAN_DEFAULT[k].warmup || '',
      stretch: PLAN_DEFAULT[k].stretch || '',
      exercises: PLAN_DEFAULT[k].exercises.map(e => Object.assign({}, e, { reps: e.reps.slice() }))
    };
  });
  return o;
}

function ensurePlanData() {
  if (!DB.plan) DB.plan = defaultPlanData();
  if (DB.planVer !== PLAN_VERSION) DB.planVer = PLAN_VERSION;
  return DB.plan;
}

/* 用 DB.plan 重建运行时 PLAN（不影响已保存的历史训练） */
function buildPlan() {
  const data = DB.plan;
  if (!data) return;
  WEEK_ORDER.forEach(k => {
    const d = data[k];
    if (!d) return;
    PLAN[k].name = d.name;
    PLAN[k].focus = d.focus;
    PLAN[k].warmup = d.warmup || '';
    PLAN[k].stretch = d.stretch || '';
    PLAN[k].exercises = d.exercises.map(e => Object.assign({}, e, { reps: e.reps.slice() }));
  });
}

function savePlan() {
  buildPlan();
  saveDB(true);
}

function resetPlan() {
  DB.plan = defaultPlanData();
  DB.planVer = PLAN_VERSION;
  buildPlan();
  saveDB(true);
}

function planTotals(day) {
  let sets = 0, seconds = 0;
  day.exercises.forEach(ex => {
    sets += ex.sets;
    seconds += ex.sets * (ex.rest + 45);
  });
  return { sets, minutes: Math.round((seconds + 480) / 60) };
}

/* ---------------- 示例数据（可在设置中清除） ---------------- */
/* 演示数据生成器：默认不调用，仅在调试图表时手动执行 seedDemo(DB) */
function seedDemo(db) {
  const rnd = (() => {
    let s = 20261105;
    return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  })();
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const jitter = (v, amt) => Math.max(2.5, Math.round((v + (rnd() * 2 - 1) * amt) / 2.5) * 2.5);

  const base = {
    squat: 45, rdl: 50, bss: 16, legcurl: 35, calfraise: 40, abwheel: 0,
    bench: 40, inclinebb: 35, ohp: 30, lateral: 8, pushdown: 25,
    pullup: 0, assistedpullup: -25, tbar: 40, seatedrow: 45, reardelt: 15, barbellcurl: 20, hangingknee: 0,
    hacksquat: 60, legext: 40, hipthrust: 60, seatedcalf: 40, declinecrunch: 5,
    inclincedb: 16, chestpress: 45, shoulderpress: 35, overheadtri: 20,
    latpull: 50, singlelat: 20, chestsupportedrow: 40, facerpull: 15, machinecurl: 20, pallof: 10
  };
  const bwOnly = { pullup: 1, abwheel: 1, hangingknee: 1, assistedpullup: 1 };

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const thisMonday = startOfWeek(today);
  const now = Date.now();

  for (let w = 1; w <= 5; w++) {
    const monday = addDays(thisMonday, -(5 - w) * 7);
    const inc = [0, 0, 2.5, 2.5, 5][w - 1];
    const skip = { 2: ['fri'], 4: ['sun'] }[w] || [];

    WEEK_ORDER.forEach((dayKey, di) => {
      const plan = PLAN[dayKey];
      if (!plan.exercises.length) return;
      if (skip.includes(dayKey)) return;
      const date = dateKey(addDays(monday, di));
      if (date >= todayKey()) return; // 今天留给用户自己练

      const startedAt = new Date(parseKey(date).getTime() + 19 * 3600e3 + 10 * 60e3);
      let cursor = startedAt.getTime();
      const exercises = plan.exercises.map((pe, exIdx) => {
        const ex = LIB[pe.exId];
        const sets = [];
        const baseW = bwOnly[pe.exId] ? null : jitter(base[pe.exId] + inc, 1.5);
        for (let i = 0; i < pe.sets; i++) {
          cursor += (exIdx === 0 && i === 0 ? 0 : (plan.exercises[exIdx - 1] || pe).rest * 1000) + 40000;
          const reps = Math.max(pe.reps[0], pe.reps[1] - Math.floor(rnd() * 2) - (i > 1 ? 1 : 0));
          const weight = baseW;
          sets.push({
            idx: i,
            status: 'completed',
            weight,
            reps,
            rir: pe.rir === '≥1' ? 1 : Math.round(2 + rnd() * 1),
            note: '',
            completedAt: cursor,
            extra: false,
            dataComplete: true
          });
        }
        cursor += 90000;
        return {
          exId: pe.exId, name: ex.name, gear: ex.gear, group: ex.group,
          targetSets: pe.sets, reps: pe.reps, rir: pe.rir, rest: pe.rest, note: pe.note,
          status: 'done', sets, originalPlan: ex.name
        };
      });

      db.sessions.push({
        id: 'seed_' + date + '_' + dayKey,
        date, dayKey, dayName: plan.name, focus: plan.focus,
        status: 'completed',
        startedAt: startedAt.toISOString(),
        endedAt: new Date(cursor).toISOString(),
        exercises,
        seed: true
      });

      if (plan.run) {
        const mins = plan.run.title.includes('45') ? Math.round(48 + rnd() * 9) : Math.round(32 + rnd() * 7);
        const km = Math.round(mins / 6.2 * 10) / 10;
        db.runs.push({
          id: 'seedrun_' + date, date, title: plan.run.title,
          minutes: mins, distance: km, rpe: 4, note: '', seed: true
        });
      }
    });

    // 体重 / 腰围
    for (const off of [1, 3, 5]) {
      const date = dateKey(addDays(monday, off));
      if (date > todayKey()) continue;
      db.body.push({
        id: 'seedbw_' + date, date,
        weight: Math.round((62.5 - (5 - w) * 0.18 + (rnd() * 0.3 - 0.15)) * 10) / 10,
        waist: null, seed: true
      });
    }
    const wk = dateKey(addDays(monday, 6));
    if (wk <= todayKey()) {
      db.body.push({
        id: 'seedwaist_' + wk, date: wk, weight: null,
        waist: Math.round((77.7 + w * 0.1 + (rnd() * 0.2 - 0.1)) * 10) / 10, seed: true
      });
    }

    // 状态记录
    for (const off of [0, 1, 2, 3, 4, 5, 6]) {
      const date = dateKey(addDays(monday, off));
      if (date > todayKey()) continue;
      db.checkins.push({
        id: 'seedck_' + date, date,
        sleep: Math.round((6.6 + rnd() * 1.4) * 10) / 10,
        fatigue: Math.min(5, Math.max(1, Math.round(2.4 + rnd() * 1.6))),
        soreness: pick(['无', '轻微', '腿部轻微', '背部轻微', '无']),
        pain: '', seed: true
      });
    }
  }
  db.sessions.sort((a, b) => (a.date < b.date ? -1 : 1));
}

function clearDemoData() {
  DB.sessions = DB.sessions.filter(s => !s.seed);
  DB.runs = DB.runs.filter(r => !r.seed);
  DB.body = DB.body.filter(b => !b.seed);
  DB.checkins = DB.checkins.filter(c => !c.seed);
  saveDB(true);
}

  return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '>' + p + '</svg>';
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const root = $('#toast-root');
  if (!root) return;
  const node = document.createElement('div');
  node.className = 'toast';
  node.textContent = msg;
  root.innerHTML = '';
  root.appendChild(node);
  setTimeout(() => { node.style.transition = 'opacity .3s'; node.style.opacity = '0'; }, 1800);
  setTimeout(() => { if (node.parentNode) node.remove(); }, 2200);
}

/* ---------------- 弹层 ---------------- */
function openSheet(opts) {
  const mask = document.createElement('div');
  mask.className = 'sheet-mask';
  const actions = (opts.actions || []).map((a, i) =>
    '<button class="btn ' + (a.cls || '') + '" data-act="' + i + '">' + a.label + '</button>').join('');
  mask.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true">' +
      '<div class="sheet-grab"></div>' +
      (opts.title ? '<h3>' + esc(opts.title) + '</h3>' : '') +
      (opts.desc ? '<div class="desc">' + esc(opts.desc) + '</div>' : '') +
      '<div class="sheet-body">' + (opts.body || '') + '</div>' +
      (actions ? '<div class="sheet-actions">' + actions + '</div>' : '') +
    '</div>';
  if (actions) mask.querySelector('.sheet').classList.add('has-actions');
  document.getElementById('sheet-root').appendChild(mask);

  const onKey = e => { if (e.key === 'Escape') close(); };
  const close = () => {
    mask.classList.remove('on');
    document.removeEventListener('keydown', onKey);
    setTimeout(() => mask.remove(), 240);
    document.body.style.overflow = '';
  };
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(() => mask.classList.add('on'));
  document.body.style.overflow = 'hidden';

  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  (opts.actions || []).forEach((a, i) => {
    const btn = mask.querySelector('[data-act="' + i + '"]');
    btn.addEventListener('click', () => {
      if (a.keepOpen) { a.onClick && a.onClick(close); return; }
      const r = a.onClick ? a.onClick(close) : undefined;
      if (r !== false) close();
    });
  });
  if (opts.onMount) opts.onMount(mask, close);
  return { el: mask, close };
}

function confirmDialog(o) {
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.style.alignItems = 'center';
    mask.innerHTML =
      '<div class="dialog">' +
        '<h3>' + esc(o.title) + '</h3>' +
        '<p>' + esc(o.desc || '') + '</p>' +
        '<div class="sheet-actions">' +
          '<button class="btn ghost" data-x="0">' + (o.cancelText || '取消') + '</button>' +
          '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-x="1">' + (o.confirmText || '确认') + '</button>' +
        '</div>' +
      '</div>';
  document.getElementById('sheet-root').appendChild(mask);
    requestAnimationFrame(() => mask.classList.add('on'));
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    const done = v => {
      mask.classList.remove('on');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => mask.remove(), 220);
      resolve(v);
    };
    mask.querySelector('[data-x="0"]').onclick = () => done(false);
    mask.querySelector('[data-x="1"]').onclick = () => done(true);
    mask.addEventListener('click', e => { if (e.target === mask) done(false); });
  });
}

/* ---------------- 声音 / 振动 ----------------
   iOS / Android 都要求音频由用户手势解锁：首次点击时创建并 resume，
   并播一段 0 长度的静音，之后休息结束这种「无手势」时刻才响得出来。 */
let audioCtx = null;
function primeAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') {
      const r = audioCtx.resume();
      if (r && r.catch) r.catch(() => {});
    }
    if (!audioCtx.__primed) {
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      audioCtx.__primed = true;
    }
  } catch (e) { /* 静默失败 */ }
}
document.addEventListener('pointerdown', primeAudio, { capture: true, passive: true });
document.addEventListener('keydown', primeAudio, { capture: true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
});

function beep(freq, dur, gain) {
  if (!DB.settings.sound) return;
  try {
    if (!audioCtx) primeAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      const r = audioCtx.resume();
      if (r && r.catch) r.catch(() => {});
    }
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq || 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.13, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.18));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (dur || 0.18) + 0.02);
  } catch (e) { /* 静默失败 */ }
}
function vibrate(p) {
  if (!DB.settings.vibrate) return;
  if (navigator.vibrate) navigator.vibrate(p || 60);
}

/* 通知：Android Chrome 不允许 new Notification()，优先走 Service Worker；
   两者都不可用时返回 false，由页面内提示兜底。 */
async function showRestNotification() {
  if (!DB.settings.notify) return false;
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  const title = '休息结束';
  const opt = { body: '可以开始下一组了（不会自动切换）', tag: 'rest-end', renotify: true, vibrate: [140, 80, 140, 80, 220] };
  try {
    if (navigator.serviceWorker) {
      const reg = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise(r => setTimeout(() => r(null), 400))
      ]);
      if (reg && reg.showNotification) { await reg.showNotification(title, opt); return true; }
    }
  } catch (e) {}
  try { new Notification(title, opt); return true; } catch (e) { return false; }
}

/* 开始训练时申请一次通知权限（有手势，成功率最高） */
function askNotifyPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'default') {
    if (Notification.permission === 'granted' && !DB.settings.notify) {
      DB.settings.notify = true;
      saveDB(true);
    }
    return;
  }
  if (DB.settings.notifyAsked) return;
  DB.settings.notifyAsked = true;
  saveDB(true);
  Notification.requestPermission().then(p => {
    DB.settings.notify = p === 'granted';
    saveDB(true);
    toast(p === 'granted' ? '已开启休息结束通知' : '通知被拒绝，可在设置里再开');
  }).catch(() => {});
}

function restFinishedAlert() {
  primeAudio();
  if (DB.settings.sound) {
    beep(880, 0.16, 0.16);
    setTimeout(() => beep(1174, 0.2, 0.16), 220);
    setTimeout(() => beep(1568, 0.28, 0.13), 460);
  }
  vibrate([120, 80, 120, 80, 200]);
  if (document.hidden) showRestNotification();
}

/* ---------------- 通用格式化 ---------------- */
function mmss(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
}
function repRange(reps) {
  return reps[0] === reps[1] ? String(reps[0]) : reps[0] + '–' + reps[1];
}
function setSummary(st) {
  const parts = [];
  if (st.weight != null && st.weight !== '') parts.push(fmtW(st.weight));
  if (st.reps != null && st.reps !== '') parts.push('× ' + st.reps);
  return parts.join(' ') || '—';
}

/* 上次成绩的紧凑写法：45 kg × 8 / 7 / 6、辅助 25 kg × 10 / 8、RPE 8 · 10 次 */
function fmtLastSets(sets, exId) {
  const arr = (sets || []).filter(s => s.status === 'completed' &&
    (exId ? setHasData(s, exId) : s.reps != null)).slice(0, 4);
  if (!arr.length) return '—';
  const mode = exId ? exMode(exId) : 'reps';
  if (mode !== 'reps') return arr.map(s => fmtSetValue(s, exId)).join(' · ');
  const assist = exId ? isAssist(exId) : false;
  const ws = arr.map(s => s.weight).filter(w => w != null);
  const same = ws.length === arr.length && ws.every(w => w === ws[0]);
  const tail = arr[0].rir != null && arr[0].rir !== '' ? ' @' + arr[0].rir : '';
  if (same) return (assist ? '辅助 ' : '') + fmtW(Math.abs(ws[0])) + ' × ' + arr.map(s => s.reps).join(' / ') + tail;
  return arr.map(s => (s.weight != null ? (assist ? '辅助 ' : '') + fmtW(Math.abs(s.weight)) : '自重') + ' × ' + s.reps).join(' · ');
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function emptyBlock(text, iconName) {
  return '<div class="empty">' + icon(iconName || 'info') + '<div>' + esc(text) + '</div></div>';
}
